version: 2

models:
  - name: fagerh__activite_prestations

    config:
      tags: ["fagerh"]

    description: >
      Table finale d'activité des prestations FAGERH.

      Ce modèle:
      * contient une ligne par réponse et par prestation terminée.
      * Il rassemble les informations principales de la prestation, de l'établissement et du département.
      * Il contient aussi les principaux indicateurs d'activité : effectifs actifs, sorties, journées, hébergement, accompagnement hors les murs
      et suspensions.
      * Il expose les indicateurs emploi et la catégorie fine des parcours utiles au calcul du taux d'accès à l'emploi.

      Pour calculer les taux d'emploi des formations certifiantes ou professionnalisantes, il faut:
      * filtrer `is_emploi_relevant = true`.
      * garder les catégories fines `formation_certifiante`, `formation_accompagnee_certifiante_dfa`,
      `formation_professionnalisante_non_certifiante` et `formation_accompagnee_professionnalisante_non_certifiante_dfa`.
      * grouper par la dimension d'analyse souhaitée, par exemple `prestation_category_fine`, `departement` ou `formation_name`.
      * calculer les taux après agrégation: `sum(emploi_acces_nb) / sum(emploi_nb_repondants)` et
      `sum(emploi_presence_nb) / sum(emploi_nb_repondants)`.
      Il ne faut pas moyenner les colonnes `taux_acces_emploi` ou `taux_presence_emploi` ligne par ligne.

      Pour analyser les participations MDPH en BI, filtrer si besoin `prestation_label = 'Participations MDPH'`, puis sommer
      les colonnes `mdph_*_participations`.

      Attention : ces colonnes comptent des participations, pas des personnes et pas des journées. Il ne faut pas les additionner
      avec `nb_files_active`, `direct_beneficiaires`, `journees` ou les autres indicateurs d'activité des prestations directes.
      Pour les indicateurs MDPH demandés, ne pas utiliser `journees` : les nombres sont stockés dans les colonnes dédiées
      `mdph_epe_participations`, `mdph_cdaph_participations` et `mdph_groupes_travail_participations`.

      Pour les évaluations préliminaires, on veut garder le libellé commun `Évaluations préliminaires` dans les graphiques.
      Il faut quand même lire les indicateurs avec leurs unités:
      * `direct_beneficiaires` compte les personnes reçues ou concernées.
      * `journees` compte seulement les journées réellement déclarées, par exemple les informations collectives.
      * `sorties` ne doit pas être inventé: si la colonne est vide ou à 0, il n'y a pas de sorties à afficher.
      Les colonnes `direct_pec_beneficiaires`, `info_personnes_collectives_*` et `info_personnes_individuelles_*`
      servent à expliquer le détail du total.

      Pour l'information collective à destination des partenaires, utiliser
      `information_partenaires_collective_nb_partenaires` pour le nombre de partenaires concernés et
      `information_partenaires_collective_journees` pour le nombre de journées.
      Pour l'information collective à destination des organismes de formation, utiliser
      `information_organismes_formation_collective_nb_organismes` et
      `information_organismes_formation_collective_journees`.
      Ces colonnes ne sont pas des personnes reçues.

      Il ne contient pas le détail des publics ou des métiers.

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "emploi_durable_nb + emploi_autre_nb <= emploi_acces_nb"
          config:
            severity: warn
            where: "emploi_acces_nb is not null"

    columns:
      - name: uuid
        description: Identifiant unique de la réponse au questionnaire.
        data_tests:
          - not_null

      - name: finess
        description: Numéro FINESS de l'établissement.

      - name: establishment_name
        description: Nom de l'établissement répondant.
        data_tests:
          - not_null

      - name: departement
        description: Département de l'établissement.

      - name: prestation_key_base
        description: >
          Clé technique normalisée de la prestation.
          Le numéro final de la clé d'origine a été retiré.
          Cette clé sert à rattacher la prestation à son mapping.
        data_tests:
          - not_null

      - name: prestation_group
        description: >
          Grand groupe de la prestation.
          Il vient du mapping des prestations.
          Il permet de regrouper les prestations dans les analyses.
        data_tests:
          - not_null


      - name: prestation_label
        description: >
          Libellé métier de la prestation.
          Il est renseigné quand la prestation peut être identifiée de façon fiable.

      - name: orp_status
        description: >
          Statut ORP CDAPH de la prestation.
          Par exemple avec ORP CDAPH, sans ORP CDAPH, hors ORP CDAPH ou non applicable.

      - name: is_reliable_prestation_mapping
        description: >
          Indique si le mapping permet d'identifier précisément la prestation.
          Si la valeur est false, le mapping reste utile mais moins précis.
        data_tests:
          - not_null

      - name: is_unmapped_prestation
        description: >
          Indique si la prestation n'a pas été trouvée dans la seed de mapping.
          Cette colonne sert au contrôle qualité.
        data_tests:
          - not_null

      - name: prestation_name_detail
        description: Libellé détaillé de la prestation dans le wizard FAGERH.

      - name: prestation_category_fine
        description: >
          Catégorie fine de parcours issue du libellé détaillé de la prestation.
          Pour répondre aux demandes sur les formations certifiantes ou professionnalisantes, utiliser les valeurs
          `formation_certifiante`, `formation_accompagnee_certifiante_dfa`,
          `formation_professionnalisante_non_certifiante` et `formation_accompagnee_professionnalisante_non_certifiante_dfa`.

      - name: formation_name
        description: Nom de la formation lorsque la prestation correspond à une formation certifiante ou diplômante.

      - name: is_technical_step
        description: Indique si la ligne correspond à une étape technique du formulaire.

      - name: is_emploi_relevant
        description: >
          Indique si la prestation doit être retenue dans le calcul du taux d'accès à l'emploi par catégorie fine.
          Les analyses BI sur les taux d'emploi des parcours fins doivent filtrer cette colonne à true.

      - name: nb_files_active
        description: >
          Nombre de personnes présentes à l'effectif au 31 décembre.
          Ces personnes ont signé un contrat de séjour.

      - name: preaccueil_sans_suite
        description: >
          Nombre de personnes reçues en pré-accueil sans suite dans l'année.

      - name: sorties
        description: Nombre de sorties définitives déclarées pour la prestation.

      - name: sorties_avant_terme
        description: Nombre de sorties définitives avant le terme de la prestation.

      - name: sorties_terme
        description: Nombre de sorties définitives au terme de la prestation.

      - name: journees
        description: >
          Nombre de journées réalisées.
          Pour les évaluations préliminaires et certaines prestations indirectes, cette colonne inclut aussi les journées
          collectives déclarées dans les sous-blocs du formulaire.
          Elle ne transforme jamais des heures en journées.

      - name: journees_theoriques
        description: Nombre de journées théoriques.

      - name: direct_beneficiaires
        description: >
          Nombre total de bénéficiaires déclarés dans les blocs des prestations directes.
          Pour les évaluations préliminaires, cette colonne peut aussi inclure les personnes reçues en information collective
          ou en rencontre individuelle d'information.
          Elle ne doit pas être mélangée avec `nb_files_active`.

      - name: direct_avec_orp_beneficiaires
        description: >
          Nombre de bénéficiaires déclaré dans le bloc des prestations directes avec ORP CDAPH.

      - name: direct_sans_orp_beneficiaires
        description: >
          Nombre de bénéficiaires déclaré dans le bloc des prestations directes sans ORP CDAPH.
          Ce champ est notamment utilisé pour certaines évaluations préliminaires hors ORP.

      - name: direct_pec_beneficiaires
        description: >
          Nombre de bénéficiaires du bloc PEC sans ORP CDAPH.
          Dans le dashboard, ce champ sert surtout à expliquer une partie de `direct_beneficiaires` pour les évaluations préliminaires.

      - name: info_personnes_collectives_journees
        description: >
          Nombre de journées passées en informations collectives à destination des personnes.
          Cette valeur entre aussi dans `journees`.

      - name: info_personnes_collectives_personnes
        description: >
          Nombre de personnes reçues en informations collectives à destination des personnes.
          Cette valeur entre aussi dans `direct_beneficiaires`.

      - name: info_personnes_individuelles_personnes
        description: >
          Nombre de personnes reçues en rencontres individuelles d'information.
          Cette valeur entre aussi dans `direct_beneficiaires`.

      - name: direct_hors_murs_personnes
        description: Nombre de personnes accompagnées hors les murs.

      - name: direct_hors_murs_journees
        description: Nombre de journées d'accompagnement hors les murs.

      - name: direct_hebergees_personnes
        description: Nombre de personnes hébergées pendant la prestation.

      - name: direct_hebergees_nuitees
        description: Nombre total de nuitées déclarées pour les personnes hébergées.

      - name: information_partenaires_collective_journees
        description: >
          Nombre de journées passées en information collective à destination des partenaires.
          Pour répondre à la demande métier, sommer cette colonne sur les lignes `Informations partenaires`.

      - name: information_partenaires_collective_nb_partenaires
        description: >
          Nombre de partenaires concernés par l'information collective à destination des partenaires.
          C'est le compteur à utiliser pour "nombre de partenaires concernés".
          Ce n'est pas un nombre de personnes reçues.

      - name: information_partenaires_individuelle_nb_partenaires
        description: >
          Nombre de partenaires concernés par l'information individuelle à destination des partenaires.
          Ce compteur est séparé des informations collectives.

      - name: information_organismes_formation_collective_journees
        description: >
          Nombre de journées passées en information collective à destination des organismes de formation.
          Pour répondre à la demande métier, sommer cette colonne sur les lignes `Informations organismes formation`.

      - name: information_organismes_formation_collective_nb_organismes
        description: >
          Nombre d'organismes de formation concernés par l'information collective.
          C'est le compteur à utiliser pour "nombre d'organismes de formation concernés".
          Ce n'est pas un nombre de personnes reçues.

      - name: information_organismes_formation_individuelle_nb_organismes
        description: >
          Nombre d'organismes de formation concernés par l'information individuelle.
          Ce compteur est séparé des informations collectives.

      - name: mdph_epe_origine_participations
        description: >
          Nombre de participations aux EPE avec la MDPH du territoire de l'établissement.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle ne compte pas des personnes reçues et elle ne doit pas être mélangée avec `journees` ou `nb_files_active`.

      - name: mdph_epe_limitrophes_participations
        description: >
          Nombre de participations aux EPE avec des MDPH des territoires voisins.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle ne compte pas des personnes reçues et elle ne doit pas être mélangée avec `journees` ou `nb_files_active`.

      - name: mdph_epe_participations
        description: >
          Nombre de participations aux EPE de la MDPH.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle additionne les participations avec la MDPH du territoire et les MDPH des territoires voisins.
          C'est un compteur de participations, pas un compteur de personnes ni de journées.

      - name: mdph_cdaph_origine_participations
        description: >
          Nombre de participations aux CDAPH avec la MDPH du territoire de l'établissement.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle ne compte pas des personnes reçues et elle ne doit pas être mélangée avec `journees` ou `nb_files_active`.

      - name: mdph_cdaph_limitrophes_participations
        description: >
          Nombre de participations aux CDAPH avec des MDPH des territoires voisins.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle ne compte pas des personnes reçues et elle ne doit pas être mélangée avec `journees` ou `nb_files_active`.

      - name: mdph_cdaph_participations
        description: >
          Nombre de participations aux CDAPH.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle additionne les participations avec la MDPH du territoire et les MDPH des territoires voisins.
          C'est un compteur de participations, pas un compteur de personnes ni de journées.

      - name: mdph_groupes_travail_origine_participations
        description: >
          Nombre de participations aux groupes de travail de la MDPH du territoire de l'établissement.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle ne compte pas des personnes reçues et elle ne doit pas être mélangée avec `journees` ou `nb_files_active`.

      - name: mdph_groupes_travail_limitrophes_participations
        description: >
          Nombre de participations aux groupes de travail avec des MDPH des territoires voisins.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle ne compte pas des personnes reçues et elle ne doit pas être mélangée avec `journees` ou `nb_files_active`.

      - name: mdph_groupes_travail_participations
        description: >
          Nombre de participations aux groupes de travail de la MDPH.
          Cette colonne est renseignée seulement sur les lignes `Participations MDPH`.
          Elle additionne les participations avec la MDPH du territoire et les MDPH des territoires voisins.
          C'est un compteur de participations, pas un compteur de personnes ni de journées.

      - name: suspensions_nb
        description: Nombre de personnes ayant connu une suspension de parcours.

      - name: direct_presentiel_total
        description: Nombre total de personnes accompagnées en présentiel.

      - name: direct_hybride_total
        description: Nombre total de personnes accompagnées en format hybride.

      - name: direct_distanciel_total
        description: Nombre total de personnes accompagnées en distanciel.

      - name: emploi_nb_repondants
        description: >
          Nombre de personnes répondantes au suivi emploi.
          Ce champ sert de dénominateur aux taux d'emploi. Pour une analyse agrégée, utiliser `sum(emploi_nb_repondants)`.

      - name: emploi_acces_nb
        description: >
          Nombre de personnes ayant accédé à l'emploi.
          Ce champ sert de numérateur au taux d'accès à l'emploi. Pour une analyse agrégée, utiliser `sum(emploi_acces_nb)`.

      - name: emploi_presence_nb
        description: >
          Nombre de personnes encore en emploi au moment du suivi.
          Ce champ sert de numérateur au taux de présence en emploi. Pour une analyse agrégée, utiliser `sum(emploi_presence_nb)`.

      - name: emploi_acces_cdi
        description: Nombre d'accès à l'emploi en CDI.

      - name: emploi_acces_cdd_plus6
        description: Nombre d'accès à l'emploi en CDD de plus de 6 mois.

      - name: emploi_acces_cdd_moins6
        description: Nombre d'accès à l'emploi en CDD de moins de 6 mois.

      - name: emploi_acces_alternance
        description: Nombre d'accès à l'emploi en alternance.

      - name: emploi_acces_interim
        description: Nombre d'accès à l'emploi en intérim.

      - name: emploi_acces_autre
        description: Nombre d'accès à l'emploi dans une autre forme de contrat.

      - name: preco_emploi_milieu_ordinaire
        description: >
          Nombre de préconisations vers l'emploi en milieu ordinaire déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_emploi_milieu_ordinaire)`.

      - name: preco_entreprise_adaptee
        description: >
          Nombre de préconisations vers l'entreprise adaptée déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_entreprise_adaptee)`.

      - name: preco_esat
        description: >
          Nombre de préconisations vers un ESAT déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_esat)`.

      - name: preco_creation_entreprise
        description: >
          Nombre de préconisations vers la création d'entreprise déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_creation_entreprise)`.

      - name: preco_maintien_emploi
        description: >
          Nombre de préconisations vers le maintien en emploi déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_maintien_emploi)`.

      - name: preco_formation_droit_commun
        description: >
          Nombre de préconisations vers une formation de droit commun déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_formation_droit_commun)`.

      - name: preco_formation_alternance
        description: >
          Nombre de préconisations vers une formation en alternance déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_formation_alternance)`.

      - name: preco_formation_esrp_dfa
        description: >
          Nombre de préconisations vers une formation ESRP ou DFA déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_formation_esrp_dfa)`.

      - name: preco_espo_specialisee_ueros
        description: >
          Nombre de préconisations vers une ESPO spécialisée ou une UEROS déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_espo_specialisee_ueros)`.

      - name: preco_service_accompagnement_social
        description: >
          Nombre de préconisations vers un service d'accompagnement social déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_service_accompagnement_social)`.

      - name: preco_vie_sociale
        description: >
          Nombre de préconisations liées à la vie sociale déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_vie_sociale)`.

      - name: preco_soins
        description: >
          Nombre de préconisations vers les soins déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_soins)`.

      - name: preco_emploi_accompagne
        description: >
          Nombre de préconisations vers l'emploi accompagné déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_emploi_accompagne)`.

      - name: preco_autres
        description: >
          Nombre d'autres préconisations déclarées à l'issue de la prestation.
          Pour une analyse agrégée, utiliser `sum(preco_autres)`.

      - name: preco_autres_precision
        description: >
          Précision textuelle associée aux autres préconisations déclarées à l'issue de la prestation.
          Ce champ descriptif ne doit pas être agrégé comme une métrique.

      - name: emploi_durable_nb
        description: >
          Nombre d'accès à l'emploi durable, calculé comme CDI plus CDD de plus de 6 mois.
          Pour une analyse agrégée, utiliser `sum(emploi_durable_nb)`.

      - name: emploi_autre_nb
        description: >
          Nombre d'accès à l'emploi hors emploi durable, calculé comme CDD de moins de 6 mois, alternance, intérim et autre.
          Pour une analyse agrégée, utiliser `sum(emploi_autre_nb)`.

      - name: taux_acces_emploi
        description: >
          Taux d'accès à l'emploi de la ligne, calculé comme `emploi_acces_nb / emploi_nb_repondants`.
          Pour tout résultat agrégé, ne pas moyenner cette colonne: recalculer le taux avec
          `sum(emploi_acces_nb) / sum(emploi_nb_repondants)`.

      - name: taux_presence_emploi
        description: >
          Taux de présence en emploi de la ligne, calculé comme `emploi_presence_nb / emploi_nb_repondants`.
          Pour tout résultat agrégé, ne pas moyenner cette colonne: recalculer le taux avec
          `sum(emploi_presence_nb) / sum(emploi_nb_repondants)`.

  - name: fagerh__publics_prestations

    config:
      tags: ["fagerh"]

    description: >
      Table finale des publics accompagnés dans les prestations FAGERH. Ce modèle contient une ligne par réponse, prestation, dimension de public
      et catégorie de public.

      Il sert à analyser le profil des personnes accompagnées. Il permet de regarder les répartitions par genre, âge, niveau de formation à l'entrée,
      situation à l'entrée et type de handicap.

      Le modèle garde seulement les prestations terminées. Il ajoute aussi les informations de l'établissement et le mapping de la prestation.

      Le modèle contient seulement les effectifs déclarés (ex. pas de valeurs 0).

    columns:
      - name: uuid
        description: Identifiant unique de la réponse au questionnaire.
        data_tests:
          - not_null

      - name: finess
        description: Numéro FINESS de l'établissement.

      - name: establishment_name
        description: Nom de l'établissement répondant.
        data_tests:
          - not_null

      - name: departement
        description: Département de l'établissement.

      - name: prestation_key_base
        description: >
          Clé technique normalisée de la prestation.
          Le numéro final de la clé d'origine a été retiré.
          Cette clé sert à rattacher la prestation à son mapping.
        data_tests:
          - not_null

      - name: prestation_group
        description: >
          Grand groupe de la prestation.
          Il vient du mapping des prestations.
          Il permet de regrouper les prestations dans les analyses.
        data_tests:
          - not_null

      - name: prestation_label
        description: >
          Libellé métier de la prestation.
          Il est renseigné quand la prestation peut être identifiée de façon fiable.

      - name: orp_status
        description: >
          Statut ORP CDAPH de la prestation.
          Par exemple avec ORP CDAPH, sans ORP CDAPH, hors ORP CDAPH ou non applicable.

      - name: is_reliable_prestation_mapping
        description: >
          Indique si le mapping permet d'identifier précisément la prestation.
          Si la valeur est false, le mapping reste utile mais seulement à un niveau plus large.
        data_tests:
          - not_null

      - name: is_unmapped_prestation
        description: >
          Indique si la prestation n'a pas été trouvée dans la seed de mapping.
          Cette colonne sert au contrôle qualité.

      - name: public_dimension
        description: >
          Dimension du public analysée.
          Par exemple genre, âge, niveau de formation à l'entrée, situation à l'entrée
          ou type de handicap.
        data_tests:
          - not_null

      - name: public_subdimension
        description: >
          Sous-dimension du public.
          Elle est surtout utilisée pour le type de handicap.
          Elle permet de distinguer le handicap principal et le handicap associé.

      - name: public_category_code
        description: >
          Code stable de la catégorie de public.
          Il vient de la seed de mapping des catégories de public.

      - name: public_category_label
        description: >
          Libellé lisible de la catégorie de public.
          Il vient de la seed de mapping des catégories de public.
        data_tests:
          - not_null

      - name: public_count
        description: >
          Nombre de personnes déclarées pour cette prestation, cette dimension
          et cette catégorie de public.
        data_tests:
          - not_null

  - name: fagerh__rh_metiers

    config:
      tags: ["fagerh"]

    description: >
      Table finale des métiers déclarés dans le questionnaire FAGERH. Ce modèle contient une ligne par réponse, métier et mode d'intervention.

      Il sert à analyser les ressources humaines mobilisées par les établissements. Il permet de regarder les ETP par métier, par famille de métier,
      par mode d'intervention, par établissement et par département.

      Le modèle ajoute les informations simples de l'établissement.

    columns:
      - name: uuid
        description: Identifiant unique de la réponse au questionnaire.
        data_tests:
          - not_null

      - name: finess
        description: Numéro FINESS de l'établissement.

      - name: establishment_name
        description: Nom de l'établissement répondant.
        data_tests:
          - not_null

      - name: departement
        description: Département de l'établissement.

      - name: metier
        description: Métier déclaré dans le questionnaire.
        data_tests:
          - not_null

      - name: metier_family
        description: >
          Code de la famille de métier.
          Il permet de regrouper plusieurs métiers proches.

      - name: metier_family_label
        description: >
          Libellé lisible de la famille de métier.
          Il sert à analyser les ETP à un niveau plus agrégé.

      - name: employment_mode
        description: >
          Mode d'intervention du métier.
          Par exemple interne, externe ou mixte selon les valeurs du questionnaire.

      - name: etp_cdi
        description: Nombre d'ETP en CDI pour ce métier et ce mode d'intervention.

      - name: etp_cdd
        description: Nombre d'ETP en CDD pour ce métier et ce mode d'intervention.

      - name: etp_total
        description: >
          Nombre total d'ETP pour ce métier et ce mode d'intervention.
          Ce total vient du questionnaire.

  - name: fagerh__rh_etp_dispositif_etablissement

    config:
      tags: ["fagerh"]

    description: >
      Table finale des ETP par dispositif et par établissement. Ce modèle contient une ligne par réponse et par établissement.

      Il sert à analyser les ETP déclarés pour chaque dispositif : ESRP, ESPO, UEROS et DEAc.

    columns:
      - name: uuid
        description: Identifiant unique de la réponse au questionnaire.
        data_tests:
          - not_null
          - unique

      - name: finess
        description: Numéro FINESS de l'établissement.

      - name: establishment_name
        description: Nom de l'établissement répondant.
        data_tests:
          - not_null

      - name: departement
        description: Département de l'établissement.

      - name: esrp_etp
        description: Nombre total d'ETP déclarés pour le dispositif ESRP.

      - name: espo_etp
        description: Nombre total d'ETP déclarés pour le dispositif ESPO.

      - name: ueros_etp
        description: Nombre total d'ETP déclarés pour le dispositif UEROS.

      - name: deac_etp
        description: Nombre total d'ETP déclarés pour le dispositif DEAc.

  - name: fagerh__profil_etablissements

    config:
      tags: ["fagerh"]

    description: >
      Table finale de description des établissements FAGERH. Ce modèle contient une ligne par réponse et par établissement.

      Il sert à décrire le profil général de l'établissement. Il indique où se situe l'établissement, quels dispositifs il déclare,
      et quels services pratiques il propose.

      Le modèle contient notamment les informations sur l'implantation, les transports, l'accessibilité PMR, l'hébergement, la
      restauration et le coin cuisine.

      Il ne contient pas les données d'activité des prestations. Il ne contient pas non plus les publics accompagnés, les métiers
      ou les ETP par dispositif. Ces sujets sont traités dans d'autres modèles.

      Le modèle inclut les réponses validées et non validées. Le statut de validation est exposé dans la colonne `is_response_completed` pour permettre un filtrage explicite dans les analyses.

    columns:
      - name: uuid
        description: Identifiant unique de la réponse au questionnaire.
        data_tests:
          - not_null
          - unique

      - name: is_response_completed
        description: Indique si la réponse au questionnaire a été validée.

      - name: finess
        description: Numéro FINESS de l'établissement.

      - name: establishment_name
        description: Nom de l'établissement répondant.
        data_tests:
          - not_null

      - name: departement
        description: Département de l'établissement.

      - name: has_esrp
        description: Indique si l'établissement déclare proposer des prestations ESRP.

      - name: has_espo
        description: Indique si l'établissement déclare proposer des prestations ESPO.

      - name: has_ueros
        description: Indique si l'établissement déclare proposer des prestations UEROS.

      - name: has_deac
        description: Indique si l'établissement déclare proposer des DEAc.

      - name: implantation_zone
        description: >
          Zone d'implantation de l'établissement.
          Par exemple zone urbaine, périurbaine ou rurale selon la réponse au questionnaire.

      - name: has_public_transport
        description: Indique si l'établissement est desservi par les transports en commun.

      - name: is_pmr_accessible
        description: Indique si l'établissement est accessible aux personnes à mobilité réduite.

      - name: has_alternative_transport
        description: Indique si des transports alternatifs sont organisés.

      - name: distance_to_prefecture
        description: >
          Situation de l'établissement par rapport à la préfecture du département.
          Cette information vient de la réponse au questionnaire.

      - name: has_accommodation
        description: Indique si l'établissement propose un hébergement.

      - name: accommodation_places
        description: Nombre de places d'hébergement déclarées.

      - name: accommodation_open_weekend
        description: Indique si l'hébergement est ouvert le week-end.

      - name: accommodation_has_weekend_accounting
        description: >
          Indique si l'établissement déclare avoir une comptabilité différente
          pour l'hébergement le week-end.

      - name: accommodation_has_closure_periods
        description: Indique si l'hébergement prévoit des périodes de fermeture.

      - name: accommodation_closure_weeks
        description: Nombre de semaines de fermeture de l'hébergement.

      - name: accommodation_has_alternatives
        description: >
          Indique si des alternatives sont proposées pendant les périodes
          de fermeture de l'hébergement.

      - name: has_collective_restaurant
        description: Indique si l'établissement propose un restaurant collectif.

      - name: restaurant_open_weekend
        description: Indique si le restaurant collectif est ouvert le week-end.

      - name: has_external_catering
        description: Indique si une restauration externe est prévue.

      - name: has_catering_financial_participation
        description: >
          Indique s'il existe une participation financière de l'établissement
          pour la restauration.

      - name: has_shared_kitchen
        description: Indique si l'établissement propose un coin cuisine à disposition.

      - name: shared_kitchen_open_weekend
        description: Indique si le coin cuisine est ouvert le week-end.
