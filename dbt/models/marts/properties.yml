version: 2

models:
  - name: pdi_base_unique_tous_les_pros
    description: |
      Dimension des professionnels de l'inclusion, tous produits confondus : Dora, Les emplois,
      GPS, Pilotage, Le marché, MonRécap et RDV-i. Empile les sept modèles `int_*__tous_les_pros`
      (un par produit), avec les mêmes colonnes pour tous.

      Le grain n'est pas parfaitement un professionnel unique : côté Dora, Les emplois, GPS et
      Pilotage, un utilisateur rattaché à plusieurs structures/organisations apparaît sur
      plusieurs lignes (une par rattachement). La clé `(id, source)` n'est donc pas garantie
      unique. `id` est propre à chaque source (l'identifiant utilisateur de Dora n'a aucun
      rapport avec celui des Emplois) : c'est le couple `(id, source)` qui identifie une ligne,
      jamais `id` seul. `id` est casté en texte pour uniformiser les types : MonRécap n'a pas
      d'identifiant natif et utilise un hash de l'e-mail (`dbt_utils.generate_surrogate_key`).

      `admin` vaut `NA` pour GPS, Pilotage et MonRécap, qui ne portent pas cette information.

      Usage typique : analyses cross-produits (ex. nombre de professionnels distincts par
      département, ou utilisant plusieurs produits). Pour une analyse propre à un seul produit,
      préférer le modèle intermédiaire correspondant (`int_dora__tous_les_pros`,
      `int_emplois__tous_les_pros`, etc.), qui documente ses propres subtilités.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: >
          Identifiant de l'utilisateur, propre à sa source. Pas unique seul : voir `source`.
        tests:
          - not_null
      - name: source
        description: Produit d'origine de la ligne.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Dora
                  - Les emplois
                  - GPS
                  - Pilotage
                  - Le marché
                  - MonRécap
                  - RDV-i
      - name: date_derniere_connexion
        description: >
          Dernière activité de l'utilisateur, définie différemment selon la source (connexion,
          dernière visite, dernière commande...). Voir le modèle intermédiaire correspondant.
      - name: prenom
        description: Prénom, tel que porté par la source.
      - name: nom
        description: Nom, tel que porté par la source.
      - name: type_utilisateur
        description: Type de l'utilisateur, brut, tel que porté par la source.
      - name: date_inscription
        description: Date d'inscription ou de première activité, définie différemment selon la source.
      - name: email
        description: Adresse e-mail de l'utilisateur.
      - name: admin
        description: >
          `Oui`/`Non` si l'information existe pour la source, `NA` pour GPS, Pilotage et
          MonRécap. Attention, la définition d'« admin » diffère d'une source à l'autre — voir le
          modèle intermédiaire correspondant avant de comparer les sources entre elles.
        tests:
          - accepted_values:
              arguments:
                values:
                  - Oui
                  - Non
                  - NA
      - name: type_utilisateur_detail
        description: >
          Type détaillé de l'utilisateur, ou `NA` quand la source ne porte pas cette information.
      - name: departement_structure
        description: Département de la structure/organisation/institution de rattachement, ou `NA`.
      - name: type_structure
        description: Type de la structure/organisation/institution de rattachement, ou `NA`.
      - name: nom_structure
        description: Nom de la structure/organisation/institution de rattachement, ou `NA`.

  - name: actes_metier
    description: >
      Table finale consolidée des actes métier PDI. Elle agrège les modèles intermédiaires par source au grain commun
      mois, source, type d'acte, catégorie, indicateurs North Star et traité, type de structure et département.

      **ATTENTION : ce modèle réplique directement la logique qui existait sur Autometa pour le tableau de bord des actes métier.
      Il est possible que cette modélisation soit revue. Si tu es en train de t'en servir pour quelque chose, vérifie d'abord
      avec l'équipe data.**

    config:
      tags: ["actes-metier"]

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement
    columns:
      - name: mois
        description: Mois de l'acte métier agrégé, au format `YYYY-MM`.
        tests:
          - not_null
      - name: source
        description: Produit ou source métier auquel l'acte est rattaché.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - rdvi
                  - emplois
                  - GPS
                  - dora
                  - monrecap
                  - marche
                  - data-inclusion
      - name: type_acte
        description: Libellé métier de l'acte dans le référentiel des actes métier PDI.
        tests:
          - not_null
      - name: categorie_acte
        description: Catégorie métier de l'acte.
        tests:
          - not_null
      - name: north_star
        description: Indique si l'acte est comptabilisé dans la déclinaison North Star à 30 jours.
        tests:
          - not_null
      - name: north_star_70
        description: Indique si l'acte est comptabilisé dans la déclinaison North Star à 70 jours.
        tests:
          - not_null
      - name: traite
        description: Indique si l'acte est considéré comme traité dans la source métier.
        tests:
          - not_null
      - name: type_structure
        description: Type de structure associé à l'acte métier.
        tests:
          - not_null
      - name: departement
        description: Département associé à l'acte métier, ou `Inconnu` quand il n'est pas disponible.
        tests:
          - not_null
      - name: nombre_actes
        description: Nombre d'actes métier agrégés au grain final.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: data_inclusion__structures_sans_dedupliquer
    description: >
      La table reprend les données de l'API Data Inclusion sans dédupliquer les structures.

      Par défaut, on préfère utiliser la table `dim_data_inclusion__structures`, car elle prend en compte les doublons. En revanche,
      pour certaines demandes métier où l'on nous demande de fournir toutes les structures Data Inclusion, ligne par ligne, sans tenir
      compte du fait qu'elles soient ou non des doublons, on utilise ce modèle.

      Le seul ajout fait par rapport à la donnée brute est l'ajout du `structure_id` des structures dédupliquées, afin de pouvoir
      identifier, si besoin, le groupe de doublons auquel chaque structure appartient.


    config:
        tags:
            - data-inclusion
    columns:
      - name: source_structure_id
        description: >
          Identifiant original de la structure dans sa source. Provenant directement de l'API Data Inclusion.
        tests:
          - not_null
          - unique

      - name: structure_id
        description: >
          Identifiant unique de la structure Data Inclusion dédupliquée. Géneré dans `int_data_inclusion__structure_source_mapping`
        tests:
          - not_null

      - name: nom
        description: >
          Nom de la structure.

      - name: description
        description: >
          Description de la structure.

      - name: lien_source
        description: >
          Lien vers la fiche de la structure dans la source conservée.

      - name: date_maj
        description: >
          Date de dernière mise à jour de la structure dans la source conservée.

      - name: siret
        description: >
          Numéro SIRET de la structure, lorsqu'il est disponible.

      - name: code_commune_insee
        description: >
          Code INSEE de la commune de la structure. Il permet de faire le lien avec `dim_commune`.

      - name: code_postal
        description: >
          Code postal de la structure.

      - name: adresse
        description: >
          Adresse de la structure.

      - name: complement_adresse
        description: >
          Complément d'adresse de la structure.

      - name: longitude
        description: >
          Longitude de la structure.

      - name: latitude
        description: >
          Latitude de la structure.

      - name: telephone
        description: >
          Numéro de téléphone de la structure.

      - name: courriel
        description: >
          Adresse email de contact de la structure.

      - name: site_web
        description: >
          Site web de la structure.

      - name: horaires_accueil
        description: >
          Horaires d'accueil de la structure.

      - name: accessibilite_lieu
        description: >
          Informations sur l'accessibilité du lieu.

      - name: reseaux_porteurs
        description: >
          Réseaux porteurs associés à la structure.

      - name: adresse_certifiee
        description: >
          Indique si l'adresse de la structure est certifiée dans Data Inclusion.

      - name: score_qualite
        description: >
          Score de qualité de la fiche structure dans Data Inclusion.

  - name: matomo__actes_metier
    description: >
      Table finale reutilisable des actes metier Emplois calcules depuis Matomo.

      **ATTENTION : ce modèle réplique directement la logique qui existait sur Autometa pour le tableau de bord des actes métier.
      Il est possible que cette modélisation soit revue. Si tu es en train de t'en servir pour quelque chose, vérifie d'abord
      avec l'équipe data.**

    config:
      tags: ["actes-metier"]

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - type_structure
              - departement
    columns:
      - name: mois
        description: >
          Mois des visites Matomo agrégées.
        tests:
          - not_null
      - name: source
        description: >
          Produit auquel l'acte métier est rattaché. Pour ce modèle Matomo, la valeur est toujours `emplois`.
        tests:
          - not_null
      - name: type_acte
        description: >
          Type d'acte métier reconstruit à partir des visites Matomo.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Recherche d’offre d’emploi"
                  - "Recherche d’offre de service, hors emploi solidaire"
      - name: categorie_acte
        description: >
          Catégorie métier de l'acte. Pour les actes Matomo de recherche, la valeur est toujours `Support`.
        tests:
          - not_null
      - name: nombre_actes
        description: >
          Nombre de visites Matomo interprété comme nombre d'actes métier. Pour les recherches d'offres d'emploi,
          le total Matomo est decomposé par département ; pour les recherches de services, le total reste rattaché
          au département `Inconnu`.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: north_star
        description: >
          Indique si l'acte est comptabilisé dans la déclinaison North Star du référentiel des actes métier PDI.
          Pour les actes Matomo de recherche, cette valeur est toujours `false`.
        tests:
          - not_null
      - name: north_star_70
        description: >
          Variante héritée du modèle commun des actes métier. Non applicable aux actes Matomo de recherche,
          donc toujours `false`.
        tests:
          - not_null
      - name: traite
        description: >
          Indicateur hérité du modèle commun des actes métier pour les actes traités. Non applicable aux visites
          Matomo de recherche, donc toujours `false`.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure associé à l'acte métier. Cette information n'est pas disponible dans les données
          Matomo utilisées ici, donc la valeur est toujours `Inconnu`.
        tests:
          - not_null
      - name: departement
        description: >
          Département associé à la recherche d'offre d'emploi lorsque la dimension personnalisée Matomo le permet.
          La valeur est `Inconnu` quand le département n'est pas disponible ou pour les recherches de services.
        tests:
          - not_null
