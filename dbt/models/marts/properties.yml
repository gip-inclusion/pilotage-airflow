version: 2

models:
  - name: dim_date
    description: |
      Cette table sert à analyser les données par jour, semaine, mois, trimestre ou année.
      On a une ligne par jour du 1er janvier 1990 au 31 décembre 2045, plus une ligne
      « Date inconnue ». Cela fait 20 455 lignes au total, dont 20 454 jours.
      On la crée directement dans les marts, sans source, seed ni staging.

      Les semaines vont du lundi au dimanche, selon la règle ISO : la semaine 1 est celle
      qui contient le premier jeudi de l'année. Autour du Nouvel An, une semaine peut donc
      appartenir à l'année précédente ou suivante. Par exemple, le 1er janvier 2021 fait partie
      de la semaine 53 de 2020. Pour regrouper par semaine, on utilise annee_iso avec semaine_iso,
      ou directement annee_semaine_iso. Pour les mois, trimestres et années, on utilise annee.
      Une semaine peut commencer avant 1990 ou finir après 2045.

      Les noms des jours et des mois sont en français.
      On ne gère pas ici les jours fériés, les exercices fiscaux, les heures ni les repères comme « aujourd'hui ».

      Les faits utilisent une clé de jour calculée sans jointure. Pour les timestamps avec fuseau horaire,
      on prend le jour en UTC. La clé vaut -1 si la date manque.
      Une date hors de 1990–2045 fait échouer le test not_null, sauf pour les deux exceptions temporaires
      en warning, expliquées dans les colonnes concernées.
      Sur la ligne -1, le libellé est « Date inconnue », est_date_inconnue vaut true et les autres infos sont NULL.

      Si on a besoin d'autres années, il faudra adapter le modèle et les tests.
    columns:
      - name: date_id
        description: "Identifiant au format YYYYMMDD, par exemple 20210101 pour le 1er janvier 2021. Vaut -1 si la date est inconnue."
        tests:
          - unique
          - not_null
      - name: date_jour
        description: "Le jour, au type SQL date. Vaut NULL seulement sur la ligne Date inconnue."
        tests:
          - unique
          - not_null:
              config:
                where: "date_id != -1"
      - name: libelle_date
        description: "La date écrite en français, par exemple 1 janvier 1990. Vaut Date inconnue pour date_id = -1."
        tests:
          - not_null
      - name: est_date_inconnue
        description: "Vaut true seulement pour la ligne Date inconnue (date_id = -1)."
        tests:
          - not_null
      - name: jour_du_mois
        description: "Numéro du jour dans le mois, de 1 à 31."
      - name: jour_de_annee
        description: "Numéro du jour dans l'année, de 1 à 366. Le 1er janvier vaut 1."
      - name: jour_semaine_iso
        description: "Jour de la semaine : 1 pour lundi, 2 pour mardi, jusqu'à 7 pour dimanche."
      - name: nom_jour
        description: "Nom du jour en français et en minuscules, par exemple lundi."
      - name: semaine_iso
        description: "Numéro de la semaine ISO, de 1 à 53. On l'utilise avec annee_iso pour ne pas mélanger les années."
      - name: annee_iso
        description: "Année à laquelle appartient la semaine ISO. Par exemple, pour le 1er janvier 2021, elle vaut 2020."
      - name: annee_semaine_iso
        description: "Année et semaine ISO réunies, par exemple 2020-W53 pour la semaine 53 de 2020."
      - name: date_debut_semaine
        description: "Le lundi de cette semaine. Il peut tomber avant le début de la table."
      - name: date_fin_semaine
        description: "Le dimanche de cette semaine. Il peut tomber après le 31 décembre 2045."
      - name: mois
        description: "Numéro du mois : 1 pour janvier, jusqu'à 12 pour décembre."
      - name: nom_mois
        description: "Nom du mois en français et en minuscules, par exemple février ou août."
      - name: annee_mois
        description: "Année et mois réunis, par exemple 2026-11 pour novembre 2026."
      - name: date_debut_mois
        description: "Premier jour du mois."
      - name: date_fin_mois
        description: "Dernier jour du mois."
      - name: trimestre
        description: "Numéro du trimestre, de 1 à 4. Le trimestre 1 va de janvier à mars."
      - name: annee_trimestre
        description: "Année et trimestre réunis, par exemple 2026-T4 pour le dernier trimestre de 2026."
      - name: annee
        description: "L'année de la date, du 1er janvier au 31 décembre. Pour le 1er janvier 2021, elle vaut 2021."
      - name: date_debut_trimestre
        description: "Premier jour du trimestre."
      - name: date_fin_trimestre
        description: "Dernier jour du trimestre."
      - name: date_debut_annee
        description: "Le 1er janvier de cette année."
      - name: date_fin_annee
        description: "Le 31 décembre de cette année."
      - name: est_weekend
        description: "Vaut true le samedi et le dimanche. Les jours fériés ne sont pas pris en compte."
      - name: est_fin_de_mois
        description: "Vaut true si c'est le dernier jour du mois."
      - name: est_annee_bissextile
        description: "Vaut true si l'année compte 366 jours, comme 2000 ou 2024. Cela vaut pour tous les jours de cette année."

  - name: pdi_base_unique_tous_les_pros
    description: |
      Dimension des professionnels de l'inclusion, tous produits confondus : Dora, Les emplois,
      GPS, Pilotage, Le marché, MonRécap et RDV-i. Empile les sept modèles `int_*__tous_les_pros`
      (un par produit), avec les mêmes colonnes pour tous.

      Une ligne correspond à un utilisateur rattaché à une structure dans un produit, et non à
      un professionnel unique :
      - un même professionnel apparaît une fois par produit qu'il utilise ;
      - dans un même produit, il apparaît une fois par structure à laquelle il est rattaché.
        Seul Le marché garde une seule ligne par utilisateur.

      `id` n'identifie un utilisateur qu'au sein de sa source : il faut toujours le lire avec
      `source`. Les emplois, GPS et Pilotage partagent l'identifiant des Emplois ; Dora, Le
      marché et RDV-i ont chacun le leur ; MonRécap n'en a pas et utilise un hash de l'e-mail.
      `id` est donc en texte. Le couple `(id, source)` n'est pas unique, à cause des
      rattachements multiples.

      `admin` vaut `NA` pour GPS, Pilotage et MonRécap, qui ne portent pas cette information.

      Usage typique : analyses cross-produits (ex. nombre de professionnels distincts par
      département, ou utilisant plusieurs produits). Pour une analyse propre à un seul produit,
      préférer le modèle intermédiaire correspondant (`int_dora__tous_les_pros`,
      `int_emplois__tous_les_pros`, etc.), qui documente ses propres subtilités.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: >
          Identifiant de l'utilisateur, propre à sa source. Pas unique seul : voir `source`.
        tests:
          - not_null
      - name: source
        description: Produit d'origine de la ligne.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Dora
                  - Les emplois
                  - GPS
                  - Pilotage
                  - Le marché
                  - MonRécap
                  - RDV-i
      - name: date_derniere_connexion
        description: >
          Dernière activité de l'utilisateur, définie différemment selon la source (connexion,
          dernière visite, dernière commande...). Voir le modèle intermédiaire correspondant.
      - name: prenom
        description: Prénom, tel que porté par la source.
      - name: nom
        description: Nom, tel que porté par la source.
      - name: type_utilisateur
        description: Type de l'utilisateur, brut, tel que porté par la source.
      - name: date_inscription
        description: Date d'inscription ou de première activité, définie différemment selon la source.
      - name: email
        description: Adresse e-mail de l'utilisateur.
      - name: admin
        description: >
          `Oui`/`Non` si l'information existe pour la source, `NA` pour GPS, Pilotage et
          MonRécap. Attention, la définition d'« admin » diffère d'une source à l'autre — voir le
          modèle intermédiaire correspondant avant de comparer les sources entre elles.
        tests:
          - accepted_values:
              arguments:
                values:
                  - Oui
                  - Non
                  - NA
      - name: type_utilisateur_detail
        description: >
          Type détaillé de l'utilisateur, ou `NA` quand la source ne porte pas cette information.
      - name: departement_structure
        description: Département de la structure/organisation/institution de rattachement, ou `NA`.
      - name: type_structure
        description: Type de la structure/organisation/institution de rattachement, ou `NA`.
      - name: nom_structure
        description: Nom de la structure/organisation/institution de rattachement, ou `NA`.

  - name: actes_metier
    description: >
      Table finale consolidée des actes métier PDI. Elle agrège les modèles intermédiaires par source au grain commun
      mois, source, type d'acte, catégorie, indicateurs North Star et traité, type de structure et département.

      **ATTENTION : ce modèle réplique directement la logique qui existait sur Autometa pour le tableau de bord des actes métier.
      Il est possible que cette modélisation soit revue. Si tu es en train de t'en servir pour quelque chose, vérifie d'abord
      avec l'équipe data.**

    config:
      tags: ["actes-metier"]

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement
    columns:
      - name: mois
        description: Mois de l'acte métier agrégé, au format `YYYY-MM`.
        tests:
          - not_null
      - name: source
        description: Produit ou source métier auquel l'acte est rattaché.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - rdvi
                  - emplois
                  - GPS
                  - dora
                  - monrecap
                  - marche
                  - data-inclusion
      - name: type_acte
        description: Libellé métier de l'acte dans le référentiel des actes métier PDI.
        tests:
          - not_null
      - name: categorie_acte
        description: Catégorie métier de l'acte.
        tests:
          - not_null
      - name: north_star
        description: Indique si l'acte est comptabilisé dans la déclinaison North Star à 30 jours.
        tests:
          - not_null
      - name: north_star_70
        description: Indique si l'acte est comptabilisé dans la déclinaison North Star à 70 jours.
        tests:
          - not_null
      - name: traite
        description: Indique si l'acte est considéré comme traité dans la source métier.
        tests:
          - not_null
      - name: type_structure
        description: Type de structure associé à l'acte métier.
        tests:
          - not_null
      - name: departement
        description: Département associé à l'acte métier, ou `Inconnu` quand il n'est pas disponible.
        tests:
          - not_null
      - name: nombre_actes
        description: Nombre d'actes métier agrégés au grain final.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: data_inclusion__structures_sans_dedupliquer
    description: >
      La table reprend les données de l'API Data Inclusion sans dédupliquer les structures.

      Par défaut, on préfère utiliser la table `dim_data_inclusion__structures`, car elle prend en compte les doublons. En revanche,
      pour certaines demandes métier où l'on nous demande de fournir toutes les structures Data Inclusion, ligne par ligne, sans tenir
      compte du fait qu'elles soient ou non des doublons, on utilise ce modèle.

      Le seul ajout fait par rapport à la donnée brute est l'ajout du `structure_id` des structures dédupliquées, afin de pouvoir
      identifier, si besoin, le groupe de doublons auquel chaque structure appartient.


    config:
        tags:
            - data-inclusion
    columns:
      - name: source_structure_id
        description: >
          Identifiant original de la structure dans sa source. Provenant directement de l'API Data Inclusion.
        tests:
          - not_null
          - unique

      - name: structure_id
        description: >
          Identifiant unique de la structure Data Inclusion dédupliquée. Géneré dans `int_data_inclusion__structure_source_mapping`
        tests:
          - not_null

      - name: nom
        description: >
          Nom de la structure.

      - name: description
        description: >
          Description de la structure.

      - name: lien_source
        description: >
          Lien vers la fiche de la structure dans la source conservée.

      - name: date_maj
        description: >
          Date de dernière mise à jour de la structure dans la source conservée.

      - name: siret
        description: >
          Numéro SIRET de la structure, lorsqu'il est disponible.

      - name: code_commune_insee
        description: >
          Code INSEE de la commune de la structure. Il permet de faire le lien avec `dim_commune`.

      - name: code_postal
        description: >
          Code postal de la structure.

      - name: adresse
        description: >
          Adresse de la structure.

      - name: complement_adresse
        description: >
          Complément d'adresse de la structure.

      - name: longitude
        description: >
          Longitude de la structure.

      - name: latitude
        description: >
          Latitude de la structure.

      - name: telephone
        description: >
          Numéro de téléphone de la structure.

      - name: courriel
        description: >
          Adresse email de contact de la structure.

      - name: site_web
        description: >
          Site web de la structure.

      - name: horaires_accueil
        description: >
          Horaires d'accueil de la structure.

      - name: accessibilite_lieu
        description: >
          Informations sur l'accessibilité du lieu.

      - name: reseaux_porteurs
        description: >
          Réseaux porteurs associés à la structure.

      - name: adresse_certifiee
        description: >
          Indique si l'adresse de la structure est certifiée dans Data Inclusion.

      - name: score_qualite
        description: >
          Score de qualité de la fiche structure dans Data Inclusion.

  - name: matomo__actes_metier
    description: >
      Table finale reutilisable des actes metier Emplois calcules depuis Matomo.

      **ATTENTION : ce modèle réplique directement la logique qui existait sur Autometa pour le tableau de bord des actes métier.
      Il est possible que cette modélisation soit revue. Si tu es en train de t'en servir pour quelque chose, vérifie d'abord
      avec l'équipe data.**

    config:
      tags: ["actes-metier"]

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - type_structure
              - departement
    columns:
      - name: mois
        description: >
          Mois des visites Matomo agrégées.
        tests:
          - not_null
      - name: source
        description: >
          Produit auquel l'acte métier est rattaché. Pour ce modèle Matomo, la valeur est toujours `emplois`.
        tests:
          - not_null
      - name: type_acte
        description: >
          Type d'acte métier reconstruit à partir des visites Matomo.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Recherche d’offre d’emploi"
                  - "Recherche d’offre de service, hors emploi solidaire"
      - name: categorie_acte
        description: >
          Catégorie métier de l'acte. Pour les actes Matomo de recherche, la valeur est toujours `Support`.
        tests:
          - not_null
      - name: nombre_actes
        description: >
          Nombre de visites Matomo interprété comme nombre d'actes métier. Pour les recherches d'offres d'emploi,
          le total Matomo est decomposé par département ; pour les recherches de services, le total reste rattaché
          au département `Inconnu`.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: north_star
        description: >
          Indique si l'acte est comptabilisé dans la déclinaison North Star du référentiel des actes métier PDI.
          Pour les actes Matomo de recherche, cette valeur est toujours `false`.
        tests:
          - not_null
      - name: north_star_70
        description: >
          Variante héritée du modèle commun des actes métier. Non applicable aux actes Matomo de recherche,
          donc toujours `false`.
        tests:
          - not_null
      - name: traite
        description: >
          Indicateur hérité du modèle commun des actes métier pour les actes traités. Non applicable aux visites
          Matomo de recherche, donc toujours `false`.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure associé à l'acte métier. Cette information n'est pas disponible dans les données
          Matomo utilisées ici, donc la valeur est toujours `Inconnu`.
        tests:
          - not_null
      - name: departement
        description: >
          Département associé à la recherche d'offre d'emploi lorsque la dimension personnalisée Matomo le permet.
          La valeur est `Inconnu` quand le département n'est pas disponible ou pour les recherches de services.
        tests:
          - not_null
