version: 2

models:
  - name : dim_thematiques_clpe
    description: >
     Table de dimension contenant les données de thematiques CLPE. Est basée sur int_thematiques_clpe.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('int_thematiques_clpe')

  - name : fct_nombre_freins
    description: >
     Table de dimension contenant les données de thematiques CLPE. Est basée sur fct_nombre_freins.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('int_thematiques_clpe')

  - name: dim_clpe_ft
    description: >
      Table contenant les infos de clpe sans les codes communes, afin d'avoir une ligne par territoire.

    columns:
      - name: territoire_id
        description: Identifiant unique du territoire (CLPE)
        tests:
          - not_null
          - unique

  - name: fct_offre_insertion
    description: >
        Table passthrough contenant les métriques offre/demande avec les indicateurs de couverture par type de frein.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('int_offre_insertion')

  - name: fct_logins_utilisateurs_emplois
    description: >
      Table contenant les last logins des utilisateurs des Emplois récuperés via la table utilisateurs_v0, en utilisant un modèle incrémentale.
      Nous éliminons de la table les user qui ne sont plus suivis dans la table utilisateurs_v0 d'origine.
    columns:
      - name: user_id
        description: "Identifiant de l'utilisateur"
        tests:
          - not_null
      - name: last_login
        description: "Date de dernière connexion"
        tests:
          - not_null
      - name: loaded_at
        description: "Timestamp de chargement"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - 'user_id'
            - 'last_login'

  - name: bridge_commune_code_postal
    description: >
      Table de correspondance entre les communes et les codes postaux.
      Ce modèle est nécessaire car la relation entre une commune et un code postal n'est pas 1:1. Une
      commune peut être associée à plusieurs codes postaux, et un même code postal peut couvrir
      plusieurs communes.
      Cette table permet donc de préserver cette relation sans dégrader le grain de dim_commune, qui
      reste à une ligne par commune.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_commune_insee
              - code_postal

    columns:
      - name: code_commune_insee
        description: "Code INSEE de la commune."
        tests:
          - not_null

      - name: code_postal
        description: "Code postal associé à la commune."
        tests:
          - not_null

  - name: dim_commune
    description: >
      Dimension des communes enrichie à partir des référentiels INSEE et d'autres sources géographiques.
      Cette table contient une ligne par code_commune_insee.
      Lorsqu'il existe plusieurs enregistrements pour un même code_commune_insee dans la source,
      une seule ligne est conservée dans cette dimension selon une règle de priorité :
      priorité aux communes sans commune parente, puis aux types de commune selon l'ordre
      COM, COMD, COMA, ARM.
      La table regroupe les principales informations administratives et territoriales de la commune,
      ainsi que des informations sur les codes postaux, l'EPCI, la zone d'emploi et la CLPE.
      Lorsque certaines informations sont absentes pour une commune mais disponibles pour sa commune parente,
      elles sont complétées à partir de cette dernière.

    columns:
      - name: code_commune_insee
        description: "Code commune INSEE"
        tests:
          - not_null
          - unique

      - name: nom_commune
        description: "Nom de la commune"
        tests:
          - not_null

      - name: type_commune
        description: "Type de commune (COM, COMD, COMA, ARM)"

      - name: type_commune_label
        description: "Type de commune en clair"

      - name: code_region_insee
        description: "Code région INSEE"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_insee_regions')
                field: code_region_insee

      - name: nom_region
        description: "Nom de la région"

      - name: code_departement_insee
        description: "Code département INSEE"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_insee_departements')
                field: code_departement_insee

      - name: nom_departement
        description: "Nom du département"

      - name: nom_departement_complet
        description: "Code et nom du département concaténés"

      - name: code_arrondissement_insee
        description: >
          Code arrondissement INSEE.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_arrondissement
        description: >
          Nom de l'arrondissement.
          Complété à partir de la commune parente si absent pour la commune.

      - name: code_insee_epci
        description: >
          Code INSEE de l'EPCI.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_epci
        description: >
          Nom de l'EPCI.
          Complété à partir de la commune parente si absent pour la commune.

      - name: code_zone_emploi
        description: >
          Code de la zone d'emploi.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_zone_emploi
        description: >
          Nom de la zone d'emploi.
          Complété à partir de la commune parente si absent pour la commune.

      - name: zone_emploi_partie_regionale
        description: >
          Indique la partie régionale de la zone d'emploi.
          Complétée à partir de la commune parente si absente pour la commune.

      - name: code_ft_clpe
        description: >
          Code FT de la CLPE.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_clpe
        description: >
          Nom de la CLPE.
          Complété à partir de la commune parente si absent pour la commune.

      - name: code_postal_principal
        description: >
          Code postal principal de la commune.
          Il correspond au plus petit code postal observé pour cette commune.
          Lorsqu'il est absent pour la commune mais disponible pour la commune parente,
          il est complété à partir de cette dernière.

      - name: nb_codes_postaux
        description: >
          Nombre de codes postaux distincts associés à la commune.
          Lorsqu'il est absent pour la commune mais disponible pour la commune parente,
          il est complété à partir de cette dernière.

      - name: code_postal_filled_from_parent
        description: >
          Indique si le code postal principal et le nombre de codes postaux
          ont été complétés à partir de la commune parente

      - name: arrondissement_filled_from_parent
        description: >
          Indique si le code et le nom de l'arrondissement
          ont été complétés à partir de la commune parente

      - name: epci_filled_from_parent
        description: >
          Indique si le code et le nom de l'EPCI
          ont été complétés à partir de la commune parente

      - name: zone_emploi_filled_from_parent
        description: >
          Indique si les informations de zone d'emploi
          ont été complétées à partir de la commune parente

      - name: clpe_filled_from_parent
        description: >
          Indique si le code et le nom de la CLPE
          ont été complétés à partir de la commune parente

      - name: code_commune_parente
        description: "Code de la commune parente"

      - name: nom_commune_parente
        description: "Nom de la commune parente"

      - name: has_parent_commune
        description: "Indique si la commune possède une commune parente"

      - name: same_code_as_parent
        description: >
          Indique si la commune partage le même code INSEE que sa commune parente

      - name: is_arrondissement_municipal
        description: "Indique si la commune est un arrondissement municipal"

      - name: region_or_departement_filled_from_parent
        description: >
          Indique si le code région ou le code département a été complété
          à partir de la commune parente

  - name: dim_esat
    config:
      tags:
        - esat
    description: >
      Table de dimension recensant les ESAT issus de la liste officielle fournie. Elle contient une ligne unique par établissement ESAT, avec ses principaux
      attributs descriptifs et les clés permettant de le rattacher à d'autres référentiels (le code commune et le code commune de son établissement juridique).

    columns:
      - name: finess_num
        description: Numéro FINESS de l'établissement ESAT.
        tests:
          - not_null
          - unique

      - name: esat_name
        description: Raison sociale de l'établissement ESAT.

      - name: adresse
        description: Adresse postale de l'établissement ESAT.

      - name: code_postal
        description: Code postal de l'établissement ESAT.

      - name: type_esat
        description: >
          Type d'établissement dans la liste officielle. Permet notamment d'identifier les établissements principaux et secondaires.

      - name: siret
        description: Numéro SIRET de l'établissement ESAT.

      - name: code_commune_insee
        description: >
          Code INSEE de la commune de l'établissement ESAT.
          Ce champ permet de rattacher la dimension ESAT à `dim_commune` pour récupérer les informations géographiques complémentaires.

      - name: telephone
        description: Numéro de téléphone de l'établissement ESAT.

      - name: email
        description: Adresse e-mail de l'établissement ESAT.

      - name: capacite_autorisee
        description: Capacité autorisée agrégée de l'établissement ESAT.

      - name: managing_organization_finess
        description: >
          Numéro FINESS de l'établissement juridique auquel l'ESAT est rattaché.
          Ce champ permet de relier la dimension ESAT au modèle `int_esat__legal_entities`.

  - name: fct_dora__imer
    config:
      tags:
        - dora
    description: >
      Table de faits des intentions de mise en relation (IMER). Une ligne correspond à une IMER,
      qu'elle vienne des Emplois ou de DORA.

      La clé du mart est `id`. L'identifiant reçu dans la source reste disponible dans
      `source_imer_id` pour auditer les données.

      Attention : plusieurs colonnes gardent l'identifiant reçu dans la source d'origine, comme
      `source_imer_id` et `user_id`. Elles peuvent donc mélanger des identifiants Emplois et DORA.
      Il ne faut pas les utiliser seules pour faire une jointure. Pour revenir à une source, il faut
      toujours filtrer avec `origin_source` en plus de l'identifiant.
    columns:
      - name: id
        description: >
          Identifiant unique de l'IMER dans ce mart. C'est la clé à utiliser pour identifier une
          ligne de `fct_dora__imer`, quelle que soit sa source.
        tests:
          - not_null
          - unique
      - name: origin_source
        description: >
          Source de l'IMER. La valeur est `emplois` quand la ligne vient des Emplois, et `dora`
          quand elle vient des événements DORA. La valeur `dora-data-inclusion` distingue les IMER
          DORA qui mobilisent un service Data Inclusion.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - emplois
                  - dora
                  - dora-data-inclusion
      - name: source_imer_id
        description: >
          Identifiant de l'IMER dans sa source d'origine. Cette colonne peut contenir des IDs
          Emplois ou des IDs DORA. Elle sert surtout à contrôler les données ou à revenir à la
          source. Elle n'est pas unique toute seule dans tous les systèmes : pour faire une jointure
          vers une source, il faut toujours utiliser `origin_source` avec `source_imer_id`.
        tests:
          - not_null
      - name: date
        description: Date à laquelle l'intention de mise en relation a été enregistrée.
        tests:
          - not_null
      - name: user_session
        description: >
          Identifiant de session reçu côté Emplois. Cette information n'existe pas pour les IMER
          DORA et reste donc vide quand `origin_source = 'dora'`.
      - name: user_kind
        description: >
          Type d'utilisateur à l'origine de l'intention, tel qu'il est reçu dans la source. Les
          valeurs peuvent venir du référentiel Emplois ou du référentiel DORA selon `origin_source`.
      - name: is_logged_imer
        description: >
          Dit si l'IMER a été faite par un utilisateur connecté à son compte. Côté DORA, on reprend
          `int_dora__imer.is_logged`, qui vient de l'événement source. Côté
          Emplois, on regarde `user_kind` : `emplois_anonymous` veut dire non connecté,
          les autres valeurs veulent dire connecté.
        tests:
          - not_null
      - name: user_id
        description: >
          Identifiant source de l'utilisateur à l'origine de l'intention. Quand `origin_source =
          'emplois'`, c'est un identifiant utilisateur Emplois. Quand `origin_source = 'dora'`,
          c'est un identifiant utilisateur DORA. Il ne faut donc pas faire une jointure unique avec
          cette colonne seule : il faut choisir la table utilisateur selon `origin_source`. Pour les
          lignes DORA, les structures de rattachement de l'utilisateur se retrouvent via
          `int_dora__structure_members`, mais cette relation peut être 1:N et multiplier les lignes.
      - name: user_prescriber_organization_id
        description: >
          Identifiant de l'organisation prescriptrice côté Emplois. Il est rempli uniquement pour
          les lignes Emplois et reste vide pour les lignes DORA.
      - name: user_company_id
        description: >
          Identifiant de la structure employeuse côté Emplois. Il est rempli uniquement pour les
          lignes Emplois et reste vide pour les lignes DORA.
      - name: target_structure_source_id
        description: >
          Identifiant de la structure ciblée avec son espace de noms. Pour DORA, il vaut `dora--<id>`;
          pour Data Inclusion, l'identifiant Data Inclusion reçu; pour Emplois, l'identifiant source
          Emplois. Son espace de noms se déduit de `origin_source`.
          Pour les lignes `origin_source = 'dora'`, c'est la clé à utiliser pour joindre
          `dim_dora__structures` via `structure_id_jointure_di` et récupérer les informations de
          structure DORA quand `target_di_structure_id` est vide.
      - name: target_di_structure_id
        description: >
          Identifiant canonique Data Inclusion de la structure ciblée par l'intention de mise en
          relation, quand on le retrouve depuis la structure cible reçue dans l'événement. Si ce
          mapping direct n'aboutit pas, on peut le compléter depuis le service mobilisé.
          Le test de relation avec `dim_data_inclusion__structures` est configuré en warning car
          le DAG Data Inclusion reconstruit cette dimension avant que `fct_dora__imer` ne soit
          recalculée par le DAG DORA. Pendant cet intervalle, la fact table peut encore contenir
          des identifiants calculés avec le snapshot Data Inclusion précédent.
        tests:
          - relationships:
              arguments:
                to: ref('dim_data_inclusion__structures')
                field: structure_id
              config:
                severity: warn
                warn_if: "> 0"
      - name: kind
        description: >
          Type de l'intention de mise en relation. `service_ext_link`, `service_orientation` et
          `service_contact` côté Les Emplois correspondent à `mobilisation` côté DORA, mais avec plus
          de granularité.
          `structure_contact` représente une vue des informations de contact d'une structure et
          s'applique à DORA comme aux Emplois.

        tests:
          - accepted_values:
              arguments:
                values:
                  - service_ext_link
                  - service_orientation
                  - service_contact
                  - structure_contact
                  - mobilisation
      - name: service_id
        description: >
          Identifiant Data Inclusion du service concerné par l'intention, quand on le retrouve.
          Il garde le format Data Inclusion avec espace de noms, par exemple `dora--<uuid>`
          ou `soliguide--<id>`. Pour DORA, il vient d'abord du service confirmé de l'orientation
          liée à la mobilisation, puis du service reconstruit depuis la mobilisation. Les services
          reconstruits depuis les mobilisations sont gardés uniquement s'ils existent dans
          `dim_data_inclusion__services`. Il reste vide pour les IMER DORA de type
          `structure_contact`.
      - name: source
        description: >
          Source du service concerné par l'intention. Cette colonne décrit le service ciblé, pas
          forcément la source de l'IMER. Pour savoir si la ligne vient des Emplois ou de DORA, il
          faut utiliser `origin_source`.
      - name: external_link
        description: Lien externe associé à l'intention de mise en relation.
      - name: orientation_id
        description: |
          Identifiant de l'orientation dans `fct_dora__orientations`, quand l'IMER est liée à
          une orientation.

          - Pour une IMER Emplois, on retrouve cette orientation à partir de l'identifiant
            reçu dans la source Emplois.
          - Pour une IMER DORA, c'est la première orientation retrouvée après la
            mobilisation.
          - Pour les mobilisations DORA, on utilise la règle déjà présente côté DORA :
            même utilisateur, même service via le slug, et orientation créée dans l'heure
            qui suit.
          - Pour les IMER DORA `structure_contact`, cette colonne reste vide.
          - Cette colonne sert à joindre le mart des orientations.
          - Il ne faut pas l'utiliser pour dédoublonner les IMER, car une même orientation
            peut être liée à plusieurs lignes d'IMER.
        tests:
          - relationships:
              arguments:
                to: ref('fct_dora__orientations')
                field: id
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de cette ligne dans Metabase.

  - name: fct_dora__orientations
    config:
      tags:
        - dora
    description: >
      Table de faits des orientations DORA et Emplois. Une ligne correspond à une orientation.
      Certaines orientations sont créées directement dans DORA, d'autres viennent des Emplois.

      Pour les services, on reçoit parfois un identifiant DORA, parfois un identifiant Data Inclusion.
      Ce mart expose les deux quand c'est possible. Il garde aussi quelques libellés pour lire les
      orientations sans refaire toutes les jointures.

      Ce n'est donc pas une table de faits complètement pure. Les identifiants et les dimensions
      Data Inclusion ne sont pas toujours stables dans le temps, donc on garde aussi des noms ici.
      Les orientations restent ainsi lisibles même quand une jointure ne retrouve plus la ligne attendue.
    columns:
      - name: id
        description: 'Identifiant canonique en texte : ID DORA pour l''origine dora, UUID Emplois pour l''origine
          emplois.'
        tests:
          - unique
          - not_null
      - name: origin_source
        description: dora pour les orientations avec prescripteur DORA, y compris les JWT historiques ; emplois pour
          celles de la Plateforme (Emplois).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - emplois
                  - dora
      - name: creation_date
        description: Date de création de l'orientation.
        tests:
          - not_null
      - name: processing_date
        description: Date de traitement de l'orientation.
      - name: status
        description: Statut de traitement de l'orientation dans DORA.
      - name: requirements
        description: Prérequis du formulaire DORA ; NULL typé pour Emplois car absent de l'export.
      - name: situation
        description: Situation du bénéficiaire dans DORA ; NULL typé pour Emplois car absent de l'export.
      - name: beneficiary_contact_preferences
        description: Préférences de contact DORA ; NULL typé pour Emplois car absent de l'export.
      - name: beneficiary_availability
        description: Disponibilité du bénéficiaire DORA ; NULL typé pour Emplois car absent de l'export.
      - name: duration_weekly_hours
        description: 'Volume horaire hebdomadaire : formulaire DORA ou catalogue Emplois, sans arrondi ; type numeric dans le mart.'
      - name: duration_weeks
        description: 'Durée en semaines : formulaire DORA ou catalogue Emplois.'
      - name: query_expires_at
        description: Expiration de la demande DORA ; NULL typé pour Emplois car absent de l'export.
      - name: last_reminder_email_sent
        description: >
          Date du dernier email de relance envoyé pour cette orientation.
      - name: data_protection_commitment
        description: >
          Booléen représentant l’engagement RGPD de l’utilisateur ayant émis l’orientation.
      - name: is_anonymized
        description: Indicateur DORA ; NULL typé pour Emplois car absent de l'export.
      - name: prescriber_id_dora
        description: Identifiant du professionnel DORA, y compris pour le flux JWT historique ; NULL pour Emplois.
      - name: user_kind
        description: main_activity du profil DORA actuel, y compris pour les JWT ; sender_kind enregistré sur l'orientation
          Emplois (emplois_employer ou emplois_prescriber), sans harmonisation.
      - name: prescriber_id_emplois
        description: 'UUID public du professionnel : sender_public_id pour Emplois, donnée historique transmise à
          DORA pour les JWT quand elle existe.'
      - name: prescriber_structure_id_di
        description: >
          Identifiant Data Inclusion de la structure prescriptrice. C'est la colonne à utiliser si on veut
          analyser les orientations par structure Data Inclusion. Elle peut rester vide si la structure
          source n'existe pas dans le mapping Data Inclusion courant. En théorie, on aimerait tester la
          relation avec `dim_data_inclusion__structures`, mais cette dimension n'est pas historisée :
          certaines structures peuvent apparaître ou disparaître selon la version disponible.

      - name: prescriber_structure_id_dora
        description: >
          Identifiant de la structure prescriptrice côté DORA. Il est rempli pour les orientations classées
          en `dora`.
      - name: prescriber_structure_id_emplois
        description: UID de l'entreprise Emplois, repris de sender_company_uid sans condition sur sender_kind ; NULL pour DORA.
      - name: prescriber_organization_id_emplois
        description: UID de l'organisation prescriptrice Emplois, repris de sender_prescriber_organization_uid sans condition sur sender_kind ; NULL pour DORA.
      - name: prescriber_nom_etablissement
        description: >
          Nom de la structure prescriptrice. On l'ajoute directement dans le mart parce que les dimensions
          Data Inclusion ne sont pas historisées et que les jointures ne sont pas toujours stables dans le
          temps. Côté Les Emplois, le nom vient de `stg_organisations.nom` pour les prescripteurs ou de
          `stg_structures.nom` pour les employeurs. Côté DORA, y compris pour le flux JWT
          Emplois, il vient de l'état courant de `stg_dora__structure.name`. La colonne peut rester vide,
          par exemple si une orientation DORA n'a pas de structure prescriptrice renseignée.
      - name: prescriber_structure_siret
        description: SIRET actuel de la structure DORA ou de l'organisation/entreprise Emplois référencée par l'orientation
          ; NULL si absent.
      - name: oriented_service_id_di
        description: 'Emplois : service_uid conservé même si le catalogue DI ne contient plus le service. DORA : identifiant
          DI reçu directement, ou correspondance du service DORA dans la dimension DI.'
      - name: oriented_service_id_dora
        description: Identifiant du service DORA reçu dans l'orientation DORA ; NULL pour Emplois.
      - name: oriented_service_name
        description: 'DORA : nom DI reçu, puis nom du service DORA, puis nom historisé. Emplois : nom dans stg_emplois__services,
          y compris pour les services inactifs.'
      - name: oriented_service_structure_name
        description: 'DORA : nom DI reçu puis nom de structure du service DORA. Emplois : nom de la structure DI canonique
          retrouvée depuis structure_uid.'
      - name: oriented_service_code_commune_insee
        description: 'DORA : commune du service DI puis commune du service DORA. Emplois : code_insee du catalogue
          Emplois, y compris pour les services inactifs.'
      - name: emplois_beneficiary_id
        description: >-
          UUID public du bénéficiaire côté Emplois. Il concerne uniquement les orientations réalisées dans
          les Emplois et les orientations DORA issues du flux JWT Emplois historique ; il reste NULL pour
          les autres orientations DORA. Il vient de beneficiary_public_id pour le flux Emplois et de
          stg_dora__emplois_orientation_data.beneficiary_id pour les JWT.
