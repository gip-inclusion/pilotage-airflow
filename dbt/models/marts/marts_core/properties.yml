version: 2

models:
  - name : dim_thematiques_clpe
    description: >
     Table de dimension contenant les données de thematiques CLPE. Est basée sur int_thematiques_clpe.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('int_thematiques_clpe')

  - name : fct_nombre_freins
    description: >
     Table de dimension contenant les données de thematiques CLPE. Est basée sur fct_nombre_freins.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('int_thematiques_clpe')

  - name: dim_clpe_ft
    description: >
      Table contenant les infos de clpe sans les codes communes, afin d'avoir une ligne par territoire.

    columns:
      - name: territoire_id
        description: Identifiant unique du territoire (CLPE)
        tests:
          - not_null
          - unique

  - name: fct_offre_insertion
    description: >
        Table passthrough contenant les métriques offre/demande avec les indicateurs de couverture par type de frein.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('int_offre_insertion')

  - name: fct_logins_utilisateurs_emplois
    description: >
      Table contenant les last logins des utilisateurs des Emplois récuperés via la table utilisateurs_v0, en utilisant un modèle incrémentale.
      Nous éliminons de la table les user qui ne sont plus suivis dans la table utilisateurs_v0 d'origine.
    columns:
      - name: user_id
        description: "Identifiant de l'utilisateur"
        tests:
          - not_null
      - name: last_login
        description: "Date de dernière connexion"
        tests:
          - not_null
      - name: loaded_at
        description: "Timestamp de chargement"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - 'user_id'
            - 'last_login'

  - name: bridge_commune_code_postal
    description: >
      Table de correspondance entre les communes et les codes postaux.
      Ce modèle est nécessaire car la relation entre une commune et un code postal n'est pas 1:1. Une
      commune peut être associée à plusieurs codes postaux, et un même code postal peut couvrir
      plusieurs communes.
      Cette table permet donc de préserver cette relation sans dégrader le grain de dim_commune, qui
      reste à une ligne par commune.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_commune_insee
              - code_postal

    columns:
      - name: code_commune_insee
        description: "Code INSEE de la commune."
        tests:
          - not_null

      - name: code_postal
        description: "Code postal associé à la commune."
        tests:
          - not_null

  - name: dim_commune
    description: >
      Dimension des communes enrichie à partir des référentiels INSEE et d'autres sources géographiques.
      Cette table contient une ligne par code_commune_insee.
      Lorsqu'il existe plusieurs enregistrements pour un même code_commune_insee dans la source,
      une seule ligne est conservée dans cette dimension selon une règle de priorité :
      priorité aux communes sans commune parente, puis aux types de commune selon l'ordre
      COM, COMD, COMA, ARM.
      La table regroupe les principales informations administratives et territoriales de la commune,
      ainsi que des informations sur les codes postaux, l'EPCI, la zone d'emploi et la CLPE.
      Lorsque certaines informations sont absentes pour une commune mais disponibles pour sa commune parente,
      elles sont complétées à partir de cette dernière.

    columns:
      - name: code_commune_insee
        description: "Code commune INSEE"
        tests:
          - not_null
          - unique

      - name: nom_commune
        description: "Nom de la commune"
        tests:
          - not_null

      - name: type_commune
        description: "Type de commune (COM, COMD, COMA, ARM)"

      - name: type_commune_label
        description: "Type de commune en clair"

      - name: code_region_insee
        description: "Code région INSEE"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_insee_regions')
                field: code_region_insee

      - name: nom_region
        description: "Nom de la région"

      - name: code_departement_insee
        description: "Code département INSEE"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_insee_departements')
                field: code_departement_insee

      - name: nom_departement
        description: "Nom du département"

      - name: nom_departement_complet
        description: "Code et nom du département concaténés"

      - name: code_arrondissement_insee
        description: >
          Code arrondissement INSEE.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_arrondissement
        description: >
          Nom de l'arrondissement.
          Complété à partir de la commune parente si absent pour la commune.

      - name: code_insee_epci
        description: >
          Code INSEE de l'EPCI.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_epci
        description: >
          Nom de l'EPCI.
          Complété à partir de la commune parente si absent pour la commune.

      - name: code_zone_emploi
        description: >
          Code de la zone d'emploi.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_zone_emploi
        description: >
          Nom de la zone d'emploi.
          Complété à partir de la commune parente si absent pour la commune.

      - name: zone_emploi_partie_regionale
        description: >
          Indique la partie régionale de la zone d'emploi.
          Complétée à partir de la commune parente si absente pour la commune.

      - name: code_ft_clpe
        description: >
          Code FT de la CLPE.
          Complété à partir de la commune parente si absent pour la commune.

      - name: nom_clpe
        description: >
          Nom de la CLPE.
          Complété à partir de la commune parente si absent pour la commune.

      - name: code_postal_principal
        description: >
          Code postal principal de la commune.
          Il correspond au plus petit code postal observé pour cette commune.
          Lorsqu'il est absent pour la commune mais disponible pour la commune parente,
          il est complété à partir de cette dernière.

      - name: nb_codes_postaux
        description: >
          Nombre de codes postaux distincts associés à la commune.
          Lorsqu'il est absent pour la commune mais disponible pour la commune parente,
          il est complété à partir de cette dernière.

      - name: code_postal_filled_from_parent
        description: >
          Indique si le code postal principal et le nombre de codes postaux
          ont été complétés à partir de la commune parente

      - name: arrondissement_filled_from_parent
        description: >
          Indique si le code et le nom de l'arrondissement
          ont été complétés à partir de la commune parente

      - name: epci_filled_from_parent
        description: >
          Indique si le code et le nom de l'EPCI
          ont été complétés à partir de la commune parente

      - name: zone_emploi_filled_from_parent
        description: >
          Indique si les informations de zone d'emploi
          ont été complétées à partir de la commune parente

      - name: clpe_filled_from_parent
        description: >
          Indique si le code et le nom de la CLPE
          ont été complétés à partir de la commune parente

      - name: code_commune_parente
        description: "Code de la commune parente"

      - name: nom_commune_parente
        description: "Nom de la commune parente"

      - name: has_parent_commune
        description: "Indique si la commune possède une commune parente"

      - name: same_code_as_parent
        description: >
          Indique si la commune partage le même code INSEE que sa commune parente

      - name: is_arrondissement_municipal
        description: "Indique si la commune est un arrondissement municipal"

      - name: region_or_departement_filled_from_parent
        description: >
          Indique si le code région ou le code département a été complété
          à partir de la commune parente

  - name: dim_esat
    config:
      tags:
        - esat
    description: >
      Table de dimension recensant les ESAT issus de la liste officielle fournie. Elle contient une ligne unique par établissement ESAT, avec ses principaux
      attributs descriptifs et les clés permettant de le rattacher à d'autres référentiels (le code commune et le code commune de son établissement juridique).

    columns:
      - name: finess_num
        description: Numéro FINESS de l'établissement ESAT.
        tests:
          - not_null
          - unique

      - name: esat_name
        description: Raison sociale de l'établissement ESAT.

      - name: adresse
        description: Adresse postale de l'établissement ESAT.

      - name: code_postal
        description: Code postal de l'établissement ESAT.

      - name: type_esat
        description: >
          Type d'établissement dans la liste officielle. Permet notamment d'identifier les établissements principaux et secondaires.

      - name: siret
        description: Numéro SIRET de l'établissement ESAT.

      - name: code_commune_insee
        description: >
          Code INSEE de la commune de l'établissement ESAT.
          Ce champ permet de rattacher la dimension ESAT à `dim_commune` pour récupérer les informations géographiques complémentaires.

      - name: telephone
        description: Numéro de téléphone de l'établissement ESAT.

      - name: email
        description: Adresse e-mail de l'établissement ESAT.

      - name: capacite_autorisee
        description: Capacité autorisée agrégée de l'établissement ESAT.

      - name: managing_organization_finess
        description: >
          Numéro FINESS de l'établissement juridique auquel l'ESAT est rattaché.
          Ce champ permet de relier la dimension ESAT au modèle `int_esat__legal_entities`.

  - name: fct_imer
    config:
      tags:
        - imer
    description: >
      Table de faits des intentions de mise en relation (IMER) effectuées sur les Emplois de l'Inclusion.
      L'id_structure de data inclusion est récupéré dans cette table afin de faciliter la jointure dans la table suivante.
      Une ligne correspond à une intention de mise en relation.
      à partir de stg_emplois__imer.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('stg_emplois__imer')
    columns:
      - name: id
        description: Identifiant unique de l'intention de mise en relation.
        tests:
          - not_null
          - unique
      - name: date
        description: Date à laquelle l'intention de mise en relation a été enregistrée.
        tests:
          - not_null
      - name: user_session
        description: Identifiant de la session de l'utilisateur à l'origine de l'intention.
      - name: user_kind
        description: Type d'utilisateur à l'origine de l'intention.
      - name: user_id
        description: Identifiant de l'utilisateur à l'origine de l'intention.
      - name: user_prescriber_organization_id
        description: Identifiant de l'organisation prescriptrice de l'utilisateur.
      - name: user_company_id
        description: Identifiant de la structure prescriptrice..
      - name: source_structure_id
        description: Identifiant source data inclusion de la structure ciblée par l'intention de mise en relation.
      - name: structure_id
        description: Identifiant unique de data inclusion de la structure ciblée par l'intention de mise en relation.
      - name: kind
        description: >
          Type de l'intention de mise en relation.
        tests:
          - accepted_values:
              values:
                - service_ext_link
                - service_orientation
                - service_contact
                - structure_contact
      - name: service_id
        description: Identifiant du service concerné par l'intention.
      - name: source
        description: Source du service concerné par l'intention.
      - name: external_link
        description: Lien externe associé à l'intention de mise en relation.
      - name: orientation_id
        description: >
          Identifiant de l'orientation. Renseigné uniquement lorsqu'une orientation a eu lieu.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de cette ligne dans Metabase.

  - name: fct_orientations
    config:
      tags:
        - imer
        - dora
    description: >
      Table de faits des orientations DORA. Une ligne correspond à une orientation.
      Certaines orientations sont créées directement dans DORA. D'autres sont créées depuis
      Les Emplois. Les colonnes `prescriber_*` servent à retrouver la structure qui a prescrit
      l'orientation.
    columns:
      - name: id
        description: Identifiant canonique de l'orientation DORA.
        tests:
          - unique
          - not_null
      - name: origin_source
        description: >
          Origine applicative de l'orientation. Indique si l'orientation vient de DORA ou a été
          créée depuis Les Emplois.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - emplois
                  - dora
      - name: emplois_sync_uid
        description: >
          UID de synchronisation Les Emplois, renseigné pour les orientations d'origine Les Emplois.
      - name: creation_date
        description: Date de création de l'orientation.
        tests:
          - not_null
      - name: processing_date
        description: Date de traitement de l'orientation.
      - name: status
        description: Statut de traitement de l'orientation dans DORA.
      - name: prescriber_id
        description: >
          Identifiant du prescripteur DORA, renseigné pour les orientations DORA natives.
          Clé de jointure vers `dim_dora__users.id`.
      - name: prescriber_di_structure_id
        description: >
          Identifiant Data Inclusion de la structure du prescripteur. C'est la colonne à utiliser
          pour analyser les orientations par structure. Elle peut être vide si la structure source
          n'existe pas dans Data Inclusion.
          Clé de jointure vers `dim_data_inclusion__structures.structure_id`.
        tests:
          - relationships:
              arguments:
                to: ref('dim_data_inclusion__structures')
                field: structure_id
      - name: prescriber_dora_structure_id
        description: >
          Identifiant de la structure du prescripteur dans DORA. Cette colonne est remplie pour les
          orientations créées dans DORA. Elle sert à garder l'identifiant source de la structure DORA.
      - name: prescriber_emplois_structure_id
        description: >
          Identifiant de la structure du prescripteur dans Les Emplois. Cette colonne est remplie pour
          les orientations créées depuis Les Emplois. Elle sert à garder l'identifiant source de
          la structure dans Les Emplois.
      - name: oriented_di_service_id
        description: >
          Identifiant Data Inclusion du service vers lequel le bénéficiaire est orienté. C'est la colonne
          à utiliser pour analyser les orientations par service Data Inclusion. Pour les services DORA,
          elle est remplie seulement si le service existe dans `dim_data_inclusion__services`. Pour les
          services déjà transmis avec un identifiant Data Inclusion, elle garde l'identifiant source reçu
          par DORA. Attention : certains de ces identifiants source n'existent pas dans
          `dim_data_inclusion__services`. Il ne faut donc pas ajouter de test `relationships` sur cette
          colonne.
      - name: oriented_dora_service_id
        description: >
          Identifiant du service orienté dans DORA. Cette colonne est remplie quand l'orientation pointe
          vers un service DORA. Elle sert à garder l'identifiant source du service DORA.
      - name: emplois_beneficiary_id
        description: >
          Identifiant du bénéficiaire transmis par Les Emplois. Correspond à
          `stg_dora__emplois_orientation_data.beneficiary_id`.
      - name: emplois_prescriber_id
        description: >
          Identifiant du prescripteur transmis par Les Emplois. Correspond à
          `stg_dora__emplois_orientation_data.prescriber_id`.
