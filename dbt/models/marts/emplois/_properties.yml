version: 2
models:
  - name: dim_emplois__services
    description: >
      Les services présents sur les Emplois, avec leur nom, leur source et leurs principales infos.
      Il y a une ligne par service, actif ou désactivé.

      On utilise cette table pour retrouver les services contactés par le passé. Les Emplois gardent les
      services désactivés, même quand ils ont disparu de data·inclusion. C'est la différence avec
      `dim_data_inclusion__services`, qui contient le catalogue actuel de data·inclusion.
    config:
      tags:
        - dora  # car c'est necessaire pour l'inbound parsing lié aux imers
        - emplois
    columns:
      - name: id
        description: Identifiant du service propre aux Emplois.
        tests:
          - not_null
          - unique
      - name: service_uid_di
        description: >
          Identifiant data·inclusion du service.
        tests:
          - not_null
          - unique
      - name: structure_uid_di
        description: Identifiant data·inclusion de la structure qui propose le service.
      - name: source
        description: >
          D'où vient le service, par exemple `dora` ou `soliguide`, d'après le dernier export des Emplois.
      - name: source_link
        description: Lien vers la fiche du service sur son site d'origine, quand on l'a.
      - name: name
        description: Nom du service dans le dernier export des Emplois.
      - name: description
        description: Texte qui présente le service dans le dernier export des Emplois.
      - name: duration_weekly_hours
        description: Nombre d'heures prévues par semaine, quand on a cette info.
      - name: duration_weeks
        description: Durée du service en semaines, quand on a cette info.
      - name: code_insee
        description: Code INSEE de la commune du service.
      - name: is_active
        description: >
          Dit si le service est actif dans le dernier export des Emplois. On garde aussi ceux qui sont
          désactivés. Les infos sont celles du dernier export disponible.
      - name: date_mise_a_jour_metabase
        description: Dernière date de mise à jour du service dans l'export pour Metabase.

  - name: fct_emplois__inbound_parsing_mer_email
    description: >
      Les mails envoyés depuis les Emplois pour contacter un offreur de service.
      Il y a une ligne par mail, avec sa date d'envoi, la date de première réponse et le temps d'attente.
      On garde aussi les mails restés sans réponse.
    config:
      tags:
        - dora
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__mer_mail')
    columns:
      - name: id
        description: Identifiant du mail envoyé, tel qu'on le reçoit dans l'export des Emplois.
        tests:
          - not_null
          - unique
      - name: imer_id
        description: >
          Identifiant de l'iMER liée au mail dans `fct_dora__imer.id`. Pour le retrouver, on cherche
          l'iMER avec `origin_source = 'emplois'` et `source_imer_id` égal à l'identifiant reçu dans
          l'export des mails. On garde donc ici l'identifiant du mart, qui est différent de celui de l'export.
          Chaque mail doit avoir une iMER : si on ne la retrouve pas, on garde le mail et le test échoue.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_dora__imer')
                field: id
      - name: service_uid_di
        description: >
          Identifiant data·inclusion du service contacté. Il permet de retrouver le service dans
          `dim_emplois__services.service_uid_di`.
        tests:
          - relationships:
              arguments:
                to: ref('dim_emplois__services')
                field: service_uid_di
              config:
                severity: error
      - name: sent_at
        description: Date et heure d'envoi, avec le fuseau horaire. On utilise cette date pour suivre les envois.
        tests:
          - not_null
      - name: sent_date
        description: >
          Date extraite du timestamp `sent_at`, utilisée pour les regroupements par date.
        data_type: date
        tests:
          - not_null
      - name: answered_at
        description: >
          Date et heure de la première réponse, avec le fuseau horaire, telles qu'on les reçoit dans l'export.
          Reste vide tant qu'on n'a pas de réponse. On garde les réponses présentes dans l'export,
          y compris les réponses automatiques s'il y en a.
      - name: is_answered
        description: >
          Dit si le mail a reçu une réponse : `true` quand `answered_at` est renseigné, `false` sinon.
        data_type: boolean
        tests:
          - not_null
      - name: response_time_days
        description: >
          Temps d'attente entre l'envoi et la première réponse, en jours. Par exemple, 36 heures donnent 1,5 jour.
          Reste vide si on n'a pas de réponse. Si le délai est négatif, on le garde
          et le test échoue. Pour la moyenne, utiliser `avg(response_time_days)` : les mails sans
          réponse ne sont pas comptés.
      - name: date_mise_a_jour_metabase
        description: Dernière date de mise à jour du mail dans l'export pour Metabase.

  - name: dim_emplois__candidats
    config:
      tags:
        - emplois
    description: >-
      Candidats inscrits sur La Plateforme de l'inclusion, aussi appelés usagers ou bénéficiaires selon le contexte.
      Une ligne correspond à un compte candidat, y compris s'il a été créé par un professionnel ou un
      administrateur et si la personne n'a encore déposé aucune candidature. Les candidats peuvent postuler dans
      des SIAE ou dans des structures hors parcours IAE. La table décrit le profil, la commune de résidence,
      l'utilisation de la plateforme, le dernier diagnostic d'éligibilité et les critères administratifs associés.
      Elle indique aussi le respect des seuils de critères pour l'éligibilité IAE et résume les PASS du candidat.
      Un PASS désigne ici un PASS IAE ou un ancien agrément Pôle emploi.
      Référence métier des critères d'éligibilité IAE :
      https://aide.emplois.inclusion.beta.gouv.fr/hc/fr/articles/14733921254161--Les-crit%C3%A8res-d-%C3%A9ligibilit%C3%A9-IAE
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__candidats')
    columns:
      - name: id_candidat
        description: >-
          Identifiant unique du candidat sur Les Emplois de l'inclusion.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_emplois__candidats')
                field: id
      - name: uid
        description: >-
          Identifiant public du candidat, au format UUID. Il permet de retrouver son compte dans d'autres
          services, notamment via beneficiary_id dans les orientations DORA.
      - name: hash_nir
        description: >-
          Empreinte du NIR du candidat (numéro de Sécurité sociale), permettant de le représenter sans afficher le
          numéro.
      - name: sexe_selon_nir
        description: >-
          Sexe du candidat déduit du premier chiffre de son NIR (numéro de Sécurité sociale).
      - name: age
        description: >-
          Âge du candidat calculé à partir de la date de naissance renseignée sur Les Emplois.
      - name: code_commune_insee
        description: >-
          Code INSEE de la commune du candidat. Il permet de retrouver sa commune et ses rattachements
          territoriaux dans dim_commune. Peut être absent si la commune n'est pas renseignée.
        tests:
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: code_commune_insee
              config:
                severity: warn
      - name: departement
        description: >-
          Code du département du candidat, par exemple 44, 976 ou 2A.
          Normalement, on n'ajouterait pas cette colonne au mart, le code commune suffit pour retrouver
          le département dans dim_commune. Mais certains candidats n'ont pas de code commune, ou ont
          un code qu'on ne retrouve pas dans dim_commune, alors que leur département est bien renseigné
          dans le staging. Si on gardait seulement le code commune, on perdrait cette information.
          C'est pour ça qu'on garde aussi le département ici.
          Pour éviter les désaccords entre les deux tables, l'intermédiaire int_emplois__candidats_geographie
          choisit le département de dim_commune quand il est disponible, et celui du staging sinon.
          Le mart reprend ce choix. Si aucun département n'est disponible, la colonne reste vide.
      - name: tranche_age
        description: >-
          Tranche d'âge du candidat : « Moins de 26 ans », « 26–54 ans » ou « 55 ans et plus ». « Non renseigné »
          lorsque l'âge manque ou est négatif.
        tests:
          - accepted_values:
              arguments:
                values: ['Non renseigné', 'Moins de 26 ans', '26–54 ans', '55 ans et plus']
      - name: date_inscription
        description: >-
          Date de création du compte du candidat sur Les Emplois.
      - name: type_inscription
        description: >-
          Mode de création du compte : « autonome » si le candidat s'est inscrit lui-même, « par professionnel »
          ou « par administrateur » si le compte a été créé pour lui.
      - name: pe_inscrit
        description: >-
          Indique si le candidat dispose d'un identifiant France Travail.
      - name: pe_connect
        description: >-
          Indique si le candidat utilise France Travail Connect pour se connecter à la plateforme.
      - name: actif
        description: >-
          Indique si le candidat s'est connecté à la plateforme au cours des 7 derniers jours, au moment de
          l'import.
      - name: date_premiere_connexion
        description: >-
          Date de la première connexion du candidat à la plateforme.
      - name: date_derniere_connexion
        description: >-
          Date de la dernière connexion du candidat à la plateforme.
      - name: date_diagnostic
        description: >-
          Date du dernier diagnostic d'éligibilité du candidat.
      - name: date_expiration_diagnostic
        description: >-
          Date à laquelle le dernier diagnostic d'éligibilité du candidat expire.
      - name: diagnostic_valide
        description: >-
          Indique si le dernier diagnostic d'éligibilité du candidat est encore en cours de validité au moment de
          l'import.
      - name: type_auteur_diagnostic
        description: >-
          Type de l'auteur du dernier diagnostic d'éligibilité : « Prescripteur » ou « Employeur ».
      - name: sous_type_auteur_diagnostic
        description: >-
          Type de l'organisation prescriptrice ou de l'entreprise à l'origine du dernier diagnostic d'éligibilité,
          par exemple « Prescripteur FT » ou « Employeur ACI ».
      - name: id_auteur_diagnostic_prescripteur
        description: >-
          Identifiant de l'organisation prescriptrice à l'origine du dernier diagnostic d'éligibilité, lorsqu'il a
          été établi par un prescripteur. Correspond à organisations_v0.id.
      - name: id_auteur_diagnostic_employeur
        description: >-
          Identifiant de l'entreprise à l'origine du dernier diagnostic d'éligibilité, lorsqu'il a été établi par
          un employeur. Correspond à structures_v0.id.
      - name: critere_n1_beneficiaire_du_rsa
        description: >-
          Indique si le critère administratif de niveau 1 « bénéficiaire du revenu de solidarité active (RSA) »
          est associé au diagnostic d'éligibilité du candidat.
      - name: date_certification_rsa
        description: >-
          Date de vérification automatique du critère RSA.
      - name: periode_certification_rsa
        description: >-
          Période de certification du critère RSA.
      - name: critere_n1_allocataire_ass
        description: >-
          Indique si le critère administratif de niveau 1 « allocataire de l'allocation de solidarité spécifique
          (ASS) » est associé au diagnostic d'éligibilité du candidat.
      - name: critere_n1_allocataire_aah
        description: >-
          Indique si le critère administratif de niveau 1 « allocataire de l'allocation aux adultes handicapés
          (AAH) » est associé au diagnostic d'éligibilité du candidat.
      - name: date_certification_aah
        description: >-
          Date de vérification automatique du critère AAH.
      - name: periode_certification_aah
        description: >-
          Période de certification du critère AAH, reprise du staging.
      - name: critere_n1_detld_plus_de_24_mois
        description: >-
          Indique si le critère administratif de niveau 1 « demandeur d'emploi de très longue durée, avec au moins
          24 mois d'inscription à France Travail sur les 27 derniers mois » est associé au diagnostic d'éligibilité
          du candidat.
      - name: critere_n2_niveau_d_etude_3_cap_bep_ou_infra
        description: >-
          Indique si le critère administratif de niveau 2 « niveau d'études 3 (CAP, BEP) ou inférieur » est
          associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_senior_plus_de_50_ans
        description: >-
          Indique si le critère administratif de niveau 2 « senior de plus de 50 ans » est associé au diagnostic
          d'éligibilité du candidat.
      - name: critere_n2_jeune_moins_de_26_ans
        description: >-
          Indique si le critère administratif de niveau 2 « jeune de moins de 26 ans » est associé au diagnostic
          d'éligibilité du candidat.
      - name: critere_n2_sortant_de_l_ase
        description: >-
          Indique si le critère administratif de niveau 2 « sortant de l'aide sociale à l'enfance (ASE) » est
          associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_deld_12_a_24_mois
        description: >-
          Indique si le critère administratif de niveau 2 « demandeur d'emploi de longue durée, avec au moins
          12 mois d'inscription à France Travail sur les 15 derniers mois » est associé au diagnostic d'éligibilité
          du candidat.
      - name: critere_n2_travailleur_handicape
        description: >-
          Indique si le critère administratif de niveau 2 « travailleur handicapé » est associé au diagnostic
          d'éligibilité du candidat.
      - name: date_certification_travailleur_handicape
        description: >-
          Date de vérification automatique du critère handicap.
      - name: periode_certification_travailleur_handicape
        description: >-
          Période de certification du critère handicap.
      - name: critere_n2_parent_isole
        description: >-
          Indique si le critère administratif de niveau 2 « parent isolé » est associé au diagnostic d'éligibilité
          du candidat.
      - name: date_certification_parent_isole
        description: >-
          Date de vérification automatique du critère parent isolé.
      - name: periode_certification_parent_isole
        description: >-
          Période de certification du critère parent isolé, reprise du staging.
      - name: critere_n2_personne_sans_hebergement_ou_hebergee_ou_ayant_u
        description: >-
          Indique si le critère administratif de niveau 2 « situation de précarité de l'hébergement » est associé
          au diagnostic d'éligibilité du candidat.
      - name: critere_n2_refugie_statutaire_beneficiaire_d_une_protectio
        description: >-
          Indique si le critère administratif de niveau 2 « réfugié statutaire, bénéficiaire d'une protection
          temporaire ou subsidiaire, ou demandeur d'asile » est associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_resident_zrr
        description: >-
          Indique si le critère administratif de niveau 2 « résident en zone de revitalisation rurale (ZRR) » est
          associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_resident_qpv
        description: >-
          Indique si le critère administratif de niveau 2 « résident d'un quartier prioritaire de la politique de
          la ville (QPV) » est associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_sortant_de_detention_ou_personne_placee_sous_main
        description: >-
          Indique si le critère administratif de niveau 2 « sortant de détention ou personne placée sous main de
          justice » est associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_maitrise_de_la_langue_francaise_inferieure_au_ni
        description: >-
          Indique si le critère administratif de niveau 2 « niveau de français inférieur à A1 » est
          associé au diagnostic d'éligibilité du candidat.
      - name: critere_n2_probleme_de_mobilite
        description: >-
          Indique si le critère administratif de niveau 2 « problème de mobilité » est associé au diagnostic
          d'éligibilité du candidat.
      - name: total_criteres_niveau_1
        description: >-
          Nombre de critères administratifs de niveau 1 associés au diagnostic d'éligibilité du candidat.
      - name: total_criteres_niveau_2
        description: >-
          Nombre de critères administratifs de niveau 2 associés au diagnostic d'éligibilité du candidat.
      - name: has_crit_nv_1
        description: >-
          Indique si le candidat possède au moins un critère administratif de niveau 1 pour l'éligibilité IAE.
          Vaut false si le total de critères de niveau 1 est absent.
        data_type: boolean
      - name: has_crit_nv_2
        description: >-
          Indique si le candidat possède au moins trois critères administratifs de niveau 2, seuil applicable aux
          SIAE hors entreprises de travail temporaire d'insertion (ETTI) et associations intermédiaires (AI). Ce
          seuil peut être atteint même sans critère de niveau 1. Vaut false si le total de niveau 2 est absent.
        data_type: boolean
      - name: has_crit_nv_2_etti_ai
        description: >-
          Indique si le candidat possède au moins deux critères administratifs de niveau 2, seuil applicable aux
          entreprises de travail temporaire d'insertion (ETTI) et associations intermédiaires (AI). Ce seuil peut
          être atteint même sans critère de niveau 1. Vaut false si le total de niveau 2 est absent.
        data_type: boolean
      - name: injection_ai
        description: >-
          Indique si le candidat fait partie de l'import massif des PASS réalisé le 30 novembre 2021, sans
          diagnostic d'éligibilité, pour les associations intermédiaires (AI).
      - name: date_mise_a_jour_metabase
        description: >-
          Date de la dernière synchronisation des données du candidat dans Metabase. La source est mise à jour
          quotidiennement.
      - name: is_eligible_pass_iae
        description: >-
          Indique si le candidat satisfait les seuils de critères administratifs pour les SIAE hors ETTI et AI :
          au moins un critère de niveau 1 ou au moins trois critères de niveau 2. Cet indicateur ne prouve ni la
          validité d'un diagnostic ni la détention d'un PASS. Un seuil satisfait suffit ; si aucun seuil n'est
          satisfait, y compris faute de total renseigné, vaut false.
        data_type: boolean
      - name: is_eligible_pass_iae_etti_ai
        description: >-
          Indique si le candidat satisfait les seuils de critères administratifs pour les entreprises de travail
          temporaire d'insertion (ETTI) et les associations intermédiaires (AI) : au moins un critère de niveau 1
          ou au moins deux critères de niveau 2. Cet indicateur ne prouve ni la validité d'un diagnostic ni la
          détention d'un PASS. Un seuil satisfait suffit ; si aucun seuil n'est satisfait, y compris faute de
          total renseigné, vaut false.
        data_type: boolean

      - name: nombre_pass
        description: >-
          Nombre de PASS du candidat. Tous les états sont comptés, y compris les PASS à venir.
          Vaut 0 si le candidat n'a aucun PASS.
        data_type: bigint
      - name: date_debut_premier_pass_iae
        description: >-
          Date de début la plus ancienne parmi les PASS du candidat.
          Vaut NULL si le candidat n'a aucun PASS.
      - name: date_debut_dernier_pass_iae
        description: >-
          Date de début du PASS le plus récent du candidat, même s'il n'a pas encore commencé.
          Le PASS le plus récent est celui dont la date de début est la plus récente ;
          à égalité, on retient la date de fin la plus récente, puis l'identifiant le plus élevé.
          Vaut NULL si le candidat n'a aucun PASS.
      - name: date_fin_dernier_pass_iae
        description: >-
          Dernier jour de validité, inclus, du PASS décrit par date_debut_dernier_pass_iae.
          Vaut NULL si le candidat n'a aucun PASS.
      - name: statut_dernier_pass_iae
        description: >-
          État du PASS le plus récent du candidat à la dernière mise à jour des données :
          « Actif », « Suspendu », « Expiré » ou « À venir ».
          Il s'agit du même PASS que date_debut_dernier_pass_iae.
          « Sans PASS IAE » signifie que le candidat n'a aucun PASS associé.
        tests:
          - accepted_values:
              arguments:
                values: ['Sans PASS IAE', 'Actif', 'Suspendu', 'Expiré', 'À venir']

  - name: fct_emplois__pass
    config:
      tags:
        - emplois
    description: >-
      Cette table rassemble les PASS. Un PASS désigne ici un PASS IAE ou un ancien agrément Pôle emploi,
      y compris ceux repris de l’historique des AI. Chaque ligne correspond à un PASS,
      avec son candidat, sa structure, ses dates de validité et sa durée.
      On y retrouve son état à la dernière mise à jour : actif, suspendu, expiré ou à venir.
      Elle résume aussi ses suspensions, ses prolongations accordées et ses demandes de prolongation,
      avec leur nombre et leurs principales dates. Un candidat peut avoir plusieurs PASS, donc plusieurs lignes.
    columns:
      - name: id_pass
        description: Identifiant du PASS.
        tests:
          - not_null
          - unique
      - name: id_candidat
        description: Identifiant du candidat titulaire. S'il manque, on garde la ligne et le test not_null échoue.
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw_emplois', 'candidats_v0')
                field: id
              config:
                severity: warn
      - name: type_pass
        description: Type du PASS, avec les valeurs PASS IAE ou Agrément PE, déjà normalisé dans le staging.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PASS IAE
                  - Agrément PE
      - name: hash_numero_pass_iae
        description: Empreinte du numéro du PASS, sans exposer le numéro.
      - name: injection_ai
        description: >-
          true pour un PASS issu de l’import des données ASP de salariés déjà en poste
          dans une association intermédiaire (AI). C’est ce qu’on appelle la reprise de stock AI.
          Ces personnes étaient déjà dans le parcours : leur import ne correspond pas à une nouvelle entrée.
          false pour un PASS qui ne vient pas de cette reprise ; NULL si l’information manque.
        data_type: boolean
      - name: id_structure
        description: Identifiant de la structure disponible dans la source. Aucun filtre sur son type.
      - name: date_debut
        description: Premier jour de validité du PASS.
        tests:
          - not_null
      - name: date_fin
        description: >-
          Dernier jour de validité, inclus.
        tests:
          - not_null
      - name: duree
        description: Durée fournie par la source.
      - name: nombre_suspensions
        description: Nombre total de suspensions du PASS, terminées ou en cours. Vaut zéro en l’absence d’événement.
        tests:
          - not_null
      - name: date_premiere_suspension
        description: Première date de début de suspension, sans filtre sur son état. Vaut NULL si aucun jalon n’existe.
      - name: date_derniere_suspension
        description: Dernière date de début de suspension, sans filtre sur son état. Vaut NULL si aucun jalon n’existe.
      - name: date_de_fin_derniere_suspension
        description: >
          Date de fin de la dernière suspension, choisie par date de début puis par identifiant décroissant.
          Les dates de début NULL passent en dernier. On garde la date de fin de la source,
          même si la suspension est en cours. Vaut NULL si cette date manque ou si le PASS n’a aucune suspension.
      - name: is_suspension_en_cours
        description: >
          Vaut true si au moins une suspension a en_cours = true dans la source.
          On ne regarde pas les dates. Si tous les indicateurs sont NULL, le résultat reste NULL.
          Vaut false si le PASS n’a aucune suspension.
        data_type: boolean
      - name: nombre_prolongations
        description: Nombre de prolongations accordées dans prolongations, avec ou sans demande liée. Les demandes
          acceptées ne sont pas ajoutées à ce nombre. Vaut zéro en l’absence d’événement.
        tests:
          - not_null
      - name: date_premiere_prolongation
        description: Première date de création d’une prolongation accordée. Vaut NULL si aucun jalon n’existe.
      - name: date_derniere_prolongation
        description: Dernière date de création d’une prolongation accordée. Vaut NULL si aucun jalon n’existe.
      - name: date_debut_derniere_prolongation
        description: Début de la dernière prolongation accordée, choisie par date de création puis par identifiant
          décroissant. Les dates NULL passent en dernier. Vaut NULL si aucun jalon n’existe.
      - name: date_fin_derniere_prolongation
        description: Fin de cette même dernière prolongation, conservée telle quelle depuis la source. Vaut NULL si
          aucun jalon n’existe.
      - name: nombre_demandes_prolongation
        description: Nombre total de demandes, indépendamment des prolongations accordées. Vaut zéro en l’absence
          d’événement.
        tests:
          - not_null
      - name: nombre_demandes_acceptees
        description: Nombre de demandes dans l’état Acceptée, même sans prolongation associée. Vaut zéro en l’absence
          d’événement.
        tests:
          - not_null
      - name: nombre_demandes_refusees
        description: Nombre de demandes dans l’état Refusée. Vaut zéro en l’absence d’événement.
        tests:
          - not_null
      - name: nombre_demandes_en_attente
        description: Nombre de demandes dans l’état À traiter. Vaut zéro en l’absence d’événement.
        tests:
          - not_null
      - name: date_premiere_demande_prolongation
        description: Première date de demande de prolongation. Vaut NULL si aucun jalon n’existe.
      - name: date_derniere_demande_prolongation
        description: Dernière date de demande de prolongation. Vaut NULL si aucun jalon n’existe.
      - name: date_dernier_traitement_demande
        description: Dernier horodatage de traitement, toutes demandes du PASS confondues. Peut concerner une demande
          plus ancienne. Vaut NULL si aucun jalon n’existe.
      - name: etat_derniere_demande_prolongation
        description: État de la dernière demande, choisie par date de demande puis par identifiant décroissant. Les
          dates NULL passent en dernier. Vaut NULL si aucun jalon n’existe.
      - name: statut_pass
        description: >-
          État à la date d'exécution du modèle, dans cet ordre de priorité : Expiré, À venir, Suspendu, Actif.
          Le dernier jour de validité est inclus. Si on ne peut pas déterminer la validité du PASS,
          ou si le PASS est valide mais que ses indicateurs de suspension sont tous NULL,
          le statut reste NULL et le test not_null échoue. Un statut manquant est une anomalie à corriger.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Expiré
                  - À venir
                  - Suspendu
                  - Actif
      - name: is_pass_valide
        description: >-
          Vaut true si le PASS a commencé à la date d’exécution du modèle
          et si sa date de fin n’est pas dépassée. Les bornes sont incluses.
          Les dates de début et de fin doivent être renseignées ; sinon, les tests not_null sur ces dates échouent.
          Une suspension ne change pas la validité du PASS.
        data_type: boolean
        tests:
          - not_null
      - name: is_pass_actif
        description: >-
          Indique si le PASS est encore valide et n’a pas de suspension en cours
          au moment de la mise à jour de la table.
        data_type: boolean
        tests:
          - not_null

  - name: fct_emplois__prolongations
    config:
      tags:
        - emplois
    description: >-
      Les prolongations accordées pour un PASS IAE ou un ancien agrément Pôle emploi.
      Une ligne correspond à une prolongation, avec ses dates, son motif, le candidat concerné
      et les acteurs de la déclaration et de la validation.
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__prolongations')
    columns:
      - name: id_prolongation
        description: Identifiant unique de la prolongation.
        tests:
          - not_null
          - unique
      - name: id_pass
        description: >-
          Identifiant du PASS prolongé. Un même PASS peut avoir plusieurs prolongations.
          Il doit être renseigné et correspondre à un PASS présent dans fct_emplois__pass.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_emplois__pass')
                field: id_pass
              config:
                severity: error
      - name: id_candidat
        description: >-
          Identifiant du candidat titulaire du PASS.
      - name: date_debut
        description: Date de début de la prolongation.
      - name: date_fin
        description: Date de fin de la prolongation.
      - name: motif
        description: Raison pour laquelle le PASS est prolongé.
      - name: id_utilisateur_declarant
        description: Identifiant de l'utilisateur de la structure qui a déclaré la prolongation.
      - name: id_structure_declarante
        description: >-
          Clé de l'établissement qui a déclaré la prolongation, dans son rôle de structure employeuse.
          On le retrouve avec une jointure sur dim_emplois__etablissements.id.
          C'est l'id de cette dimension, pas l'id de la table des structures.
          Reste NULL si la structure n'est pas renseignée ou si on ne la retrouve pas dans la dimension.
        tests:
          - relationships:
              arguments:
                to: ref('dim_emplois__etablissements')
                field: id
              config:
                severity: error
      - name: id_organisation_prescripteur
        description: >-
          Clé de l'établissement qui a validé la demande, dans son rôle d'organisation prescriptrice.
          On le retrouve avec une jointure sur dim_emplois__etablissements.id.
          C'est l'id de cette dimension, pas l'id de la table des organisations.
          Reste NULL si l'organisation n'est pas renseignée ou si on ne la retrouve pas dans la dimension.
          Elle peut être absente si la structure valide directement ou pour les prolongations d'avant juillet 2023.
        tests:
          - relationships:
              arguments:
                to: ref('dim_emplois__etablissements')
                field: id
              config:
                severity: error
      - name: id_utilisateur_prescripteur
        description: Identifiant du prescripteur qui a traité la demande. Peut être absent.
      - name: date_creation
        description: Date de création de la prolongation dans les Emplois.
      - name: id_demande_de_prolongation
        description: Identifiant de la demande liée à la prolongation. Peut être absent.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière mise à jour de cette ligne dans Metabase, reprise du staging.

  - name: fct_emplois__demandes_prolongation
    config:
      tags:
        - emplois
    description: >-
      Les demandes de prolongation d'un PASS IAE ou d'un ancien agrément Pôle emploi.
      Une ligne correspond à une demande. On y retrouve la période demandée, le motif, le candidat
      concerné et les informations qui permettent de suivre son traitement.
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__demandes_prolongation')
    columns:
      - name: id_demande_prolongation
        description: Identifiant unique de la demande de prolongation.
        tests:
          - not_null
          - unique
      - name: id_pass
        description: >-
          Identifiant du PASS concerné. Un même PASS peut avoir plusieurs demandes de prolongation.
          Il doit être renseigné et correspondre à un PASS présent dans fct_emplois__pass.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_emplois__pass')
                field: id_pass
              config:
                severity: error
      - name: id_candidat
        description: >-
          Identifiant du candidat titulaire du PASS, repris de fct_emplois__pass.
      - name: date_debut
        description: Date de début de la prolongation demandée.
      - name: date_fin
        description: Date de fin de la prolongation demandée.
      - name: motif
        description: Raison donnée pour demander la prolongation.
      - name: id_utilisateur_declarant
        description: Identifiant de l'utilisateur de la structure qui a déclaré la demande.
      - name: id_structure_declarante
        description: >-
          Clé de l'établissement qui a déclaré la demande, dans son rôle de structure employeuse.
          On le retrouve avec une jointure sur dim_emplois__etablissements.id.
          C'est l'id de cette dimension, pas l'id de la table des structures.
          Reste NULL si la structure n'est pas renseignée ou si on ne la retrouve pas dans la dimension.
        tests:
          - relationships:
              arguments:
                to: ref('dim_emplois__etablissements')
                field: id
              config:
                severity: error
      - name: id_organisation_prescripteur
        description: >-
          Clé de l'établissement associé à la demande, dans son rôle d'organisation prescriptrice.
          On le retrouve avec une jointure sur dim_emplois__etablissements.id.
          C'est l'id de cette dimension, pas l'id de la table des organisations.
          Reste NULL si l'organisation n'est pas renseignée ou si on ne la retrouve pas dans la dimension.
        tests:
          - relationships:
              arguments:
                to: ref('dim_emplois__etablissements')
                field: id
              config:
                severity: error
      - name: id_utilisateur_prescripteur
        description: Identifiant du prescripteur associé à la demande, quand il est renseigné.
      - name: id_prolongation
        description: Identifiant de la prolongation liée à la demande. Peut être absent.
      - name: etat
        description: >-
          État de la demande à la dernière mise à jour, par exemple Acceptée, Refusée ou À traiter.
          On garde les demandes dans tous ces états. Cette colonne donne l'état actuel de la demande,
          pas l'historique de ses changements d'état.
      - name: motif_de_refus
        description: Raison du refus, quand elle est renseignée.
      - name: date_de_demande
        description: Date à laquelle la demande a été faite.
      - name: date_traitement
        description: Date à laquelle la demande a été traitée. Peut être absente si elle est encore à traiter.
      - name: id_utilisateur_traitant
        description: Identifiant de l'utilisateur qui a traité la demande, quand il est renseigné.
      - name: date_envoi_rappel
        description: Date d'envoi du rappel lié à la demande, quand elle est renseignée.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière mise à jour de cette ligne dans Metabase, reprise du staging.

  - name: fct_emplois__suspensions
    config:
      tags:
        - emplois
    description: >-
      Les suspensions de PASS IAE ou d'anciens agréments Pôle emploi.
      Une ligne correspond à un épisode de suspension. On y retrouve le candidat concerné,
      les dates, le motif et l'information qui indique si la suspension est en cours.
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__suspensions')
    columns:
      - name: id_suspension
        description: Identifiant unique de la suspension.
        tests:
          - not_null
          - unique
      - name: id_pass
        description: >-
          Identifiant du PASS suspendu. Un même PASS peut avoir plusieurs suspensions.
          Il doit être renseigné et correspondre à un PASS présent dans fct_emplois__pass.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_emplois__pass')
                field: id_pass
              config:
                severity: error
      - name: id_candidat
        description: >-
          Identifiant du candidat titulaire du PASS, repris de fct_emplois__pass.
      - name: date_debut
        description: Date de début de la suspension, telle qu'elle est renseignée dans la source.
      - name: date_fin
        description: Date de fin de la suspension, telle qu'elle est renseignée dans la source. Peut être absente.
      - name: motif
        description: Raison pour laquelle le PASS est suspendu.
      - name: en_cours
        description: >-
          Indique si la suspension est en cours d'après la source. Vaut true si elle est en cours,
          false si elle ne l'est pas et NULL si l'information manque. On garde les suspensions
          quelle que soit cette valeur, sans la recalculer à partir des dates.
        data_type: boolean
      - name: date_creation
        description: Date de création de la suspension dans les Emplois.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière mise à jour de cette ligne dans Metabase, reprise du staging.

  - name: dim_emplois__etablissements
    description: >
      Établissements inscrits sur les Emplois de l'Inclusion : structures employeuses et organisations
      prescriptrices ou orienteuses. Une ligne par établissement.
      Une structure et une organisation partageant le même SIRET sont rapprochées sur une seule ligne
      lorsque la correspondance est 1:1 : la structure est seule sur son SIRET et l'organisation est
      seule sur son SIRET, ou est l'unique organisation de type Autre parmi celles partageant ce SIRET.
      Les autres structures et organisations ont chacune leur propre ligne.
      Pour les structures importées de l'ASP (source Export ASP), le nom, le SIRET, le code NAF et
      la commune proviennent du flux ASP, sinon des Emplois.
      Les colonnes propres à un seul type d'établissement sont nulles pour l'autre.
    config:
      tags:
        - emplois
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: uid_structure is not null or uid_organisation is not null
    columns:
      - name: id
        description: >
          Identifiant de l'établissement, hash des UUID de la structure et de l'organisation.
          Stable d'une exécution à l'autre tant que le rapprochement ne change pas.
        tests:
          - not_null
          - unique
      - name: type_etablissement
        description: >
          Type d'établissement, structure pour une structure employeuse, organisation pour une organisation
          prescriptrice, structure_organisation pour une structure et une organisation rapprochées par SIRET.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - structure
                  - organisation
                  - structure_organisation
      - name: uid_structure
        description: Identifiant unique universel (UUID) de la structure dans les Emplois. Null pour les organisations non rapprochées.
        tests:
          - unique
      - name: id_structure
        description: Identifiant de la structure dans les Emplois. Null pour les organisations non rapprochées.
        tests:
          - unique
      - name: uid_organisation
        description: Identifiant unique universel (UUID) de l'organisation dans les Emplois. Null pour les structures non rapprochées.
        tests:
          - unique
      - name: id_organisation
        description: Identifiant de l'organisation dans les Emplois. Null pour les structures non rapprochées.
        tests:
          - unique
      - name: id_strct_mere
        description: >
          Identifiant ASP de la structure mère. Renseigné pour les structures de source Export ASP.
          Les antennes n'ont pas d'existence juridique, elles sont administrativement portées par leur structure mère.
          Null pour les organisations et les structures hors IAE
      - name: nom_structure
        description: Nom de la structure saisi sur les Emplois. Null pour les organisations non rapprochées.
      - name: nom_organisation
        description: Nom de l'organisation saisi sur les Emplois. Null pour les structures non rapprochées.
      - name: nom_structure_asp
        description: >
            Dénomination de la structure à l'ASP. Renseignée uniquement pour les structures de source Export ASP.
            Le nom de la structure peut différer entre les emplois et l'ASP, les deux sont corrects il est donc nécessaire d'exposer les deux.
      - name: type_structure
        description: Code du type de structure, par exemple ACI, EI, AI, ETTI, EITI, GEIQ, EA ou OPCS.
      - name: type_organisation
        description: Code du type d'organisation, par exemple FT, ML, CAP_EMPLOI, DEPT, CCAS ou Autre.
      - name: type_complet
        description: Libellé long du type d'organisation. Null pour les structures non rapprochées.
      - name: habilitee
        description: >
          Entier 0/1 indiquant si l'organisation est habilitée à réaliser des diagnostics
          d'éligibilité IAE. Null pour les structures non rapprochées.
      - name: siret
        description: >
          Numéro SIRET de l'établissement. Pour les structures de source Export ASP, SIRET actualisé
          issu de l'ASP.
      - name: code_naf
        description: >
          Code NAF de la structure, issu de l'ASP pour les structures de source Export ASP.
          Null pour les organisations non rapprochées.
      - name: code_commune
        description: >
          Code INSEE de la commune de l'établissement. Pour les structures de source Export ASP,
          commune de l'adresse administrative ASP, sinon commune de l'adresse C1 des Emplois.
          Pour un établissement rapproché, commune de la structure.
      - name: code_safir
        description: Code SAFIR de l'agence France Travail. Renseigné uniquement pour les organisations de type FT.
      - name: source
        description: >
          Origine de la création de la structure. Valeurs possibles : Export ASP, Export GEIQ,
          Utilisateur (Antenne), Staff Itou. Null pour les organisations non rapprochées.
      - name: date_inscription_emplois
        description: >
          Date d'inscription de l'établissement sur les Emplois de l'Inclusion. Pour un établissement
          rapproché, date la plus ancienne entre la structure et l'organisation.
      - name: active
        description: >
          Entier 0/1 indiquant si l'établissement est actif sur la plateforme. Pour un établissement
          rapproché, actif si la structure ou l'organisation l'est.
