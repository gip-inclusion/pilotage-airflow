version: 2
models:
  - name: dim_emplois__candidats
    description: >-
      Table de dimension contenant toutes les informations relatives aux utilisateurs non professionnels inscrits sur Les Emplois,
      principalement pour travailler dans une SIAE, mais qui peuvent également postuler dans des structures en dehors du parcours
      IAE. Une ligne = un utilisateur.
      Ça inclut les personnes qui se sont inscrites elles-mêmes ou qui ont été inscrites par des pros. Un candidat peut être dans cette table sans avoir encore fait de candidature.
      Référence métier critères elegibilité IAE : https://aide.emplois.inclusion.beta.gouv.fr/hc/fr/articles/14733921254161--Les-crit%C3%A8res-d-%C3%A9ligibilit%C3%A9-IAE
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__candidats')
    columns:
      - name: id_candidat
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_emplois__candidats')
                field: id
      - name: uid
        description: >-
          Identifiant public du compte du candidat sur Les Emplois, au format UUID.
          Il correspond à users_user.public_id dans Les Emplois.
          Il permet de retrouver ce compte dans d'autres services, par exemple via
          beneficiary_id dans les orientations DORA.
      - name: hash_nir
      - name: sexe_selon_nir
      - name: age
      - name: tranche_age
        data_tests:
          - accepted_values:
              arguments:
                values: ['Non renseigné', 'Moins de 26 ans', '26–54 ans', '55 ans et plus']
      - name: date_inscription
      - name: type_inscription
      - name: pe_inscrit
      - name: pe_connect
      - name: actif
      - name: date_premiere_connexion
      - name: date_derniere_connexion
      - name: date_diagnostic
      - name: date_expiration_diagnostic
      - name: diagnostic_valide
      - name: type_auteur_diagnostic
      - name: sous_type_auteur_diagnostic
      - name: id_auteur_diagnostic_prescripteur
      - name: id_auteur_diagnostic_employeur
      - name: critere_n1_beneficiaire_du_rsa
      - name: critere_n1_allocataire_ass
      - name: critere_n1_allocataire_aah
      - name: critere_n1_detld_plus_de_24_mois
      - name: critere_n2_niveau_d_etude_3_cap_bep_ou_infra
      - name: critere_n2_senior_plus_de_50_ans
      - name: critere_n2_jeune_moins_de_26_ans
      - name: critere_n2_sortant_de_l_ase
      - name: critere_n2_deld_12_a_24_mois
      - name: critere_n2_travailleur_handicape
      - name: critere_n2_parent_isole
      - name: critere_n2_personne_sans_hebergement_ou_hebergee_ou_ayant_u
      - name: critere_n2_refugie_statutaire_beneficiaire_d_une_protectio
      - name: critere_n2_resident_zrr
      - name: critere_n2_resident_qpv
      - name: critere_n2_sortant_de_detention_ou_personne_placee_sous_main
      - name: critere_n2_maitrise_de_la_langue_francaise_inferieure_au_ni
      - name: critere_n2_probleme_de_mobilite
      - name: total_criteres_niveau_1
      - name: total_criteres_niveau_2
      - name: has_crit_nv_1
        description: >-
          Booléen valant true si total_criteres_niveau_1 >= 1 : le candidat possède au moins
          un critère de niveau 1. Vaut false si le total est inférieur à 1 ou NULL.
          Calculé à partir du total fourni par le staging, sans recompter les critères individuels.
        data_type: boolean
      - name: has_crit_nv_2
        description: >-
          Booléen valant true si total_criteres_niveau_2 >= 3 : le candidat possède au moins
          trois critères de niveau 2. Vaut false si le total est inférieur à 3 ou NULL.
          Ce seuil est indépendant de la présence de critères de niveau 1.
        data_type: boolean
      - name: has_crit_nv_2_etti_ai
        description: >-
          Booléen valant true si total_criteres_niveau_2 >= 2 : le candidat possède au moins
          deux critères de niveau 2 (seuil ETTI/AI). Vaut false si le total est inférieur à 2
          ou NULL. Ce seuil est indépendant de la présence de critères de niveau 1.

        data_type: boolean
      - name: injection_ai
      - name: date_mise_a_jour_metabase
      - name: is_eligible_pass_iae
        description: >-
          Booléen calculé par has_crit_nv_1 OR has_crit_nv_2. Vaut true si le candidat
          possède au moins un critère de niveau 1 ou au moins trois critères de niveau 2,
          sinon false. Représente uniquement le respect des seuils administratifs pour
          les SIAE hors ETTI/AI, selon la référence métier du modèle.
          Un seuil satisfait suffit même si l'autre total est NULL.
        data_type: boolean
      - name: is_eligible_pass_iae_etti_ai
        description: >-
          Booléen calculé par has_crit_nv_1 OR has_crit_nv_2_etti_ai. Vaut true si le candidat
          possède au moins un critère de niveau 1 ou au moins deux critères de niveau 2,
          sinon false. Représente uniquement le respect des seuils administratifs pour
          les ETTI/AI, selon la référence métier du modèle.
          Un seuil satisfait suffit même si l'autre total est NULL.
        data_type: boolean

      - name: nombre_pass_iae
        description: >-
          Nombre de titres du candidat dans fct_emplois__pass_iae.
          On compte les PASS IAE et les anciens agréments Pôle emploi, quel que soit leur état,
          même ceux qui n'ont pas encore commencé. Vaut 0 si le candidat n'a aucun titre.
        data_type: bigint
      - name: date_debut_premier_pass_iae
        description: >-
          Date à laquelle le premier PASS du candidat a commencé. On prend la date de début
          la plus ancienne, en comptant aussi les anciens agréments Pôle emploi.
          Vaut NULL si le candidat n'a aucun titre ou si aucune date de début n'est connue.
      - name: date_debut_dernier_pass_iae
        description: >-
          Date à laquelle le dernier PASS du candidat commence. On compte aussi les anciens
          agréments Pôle emploi et on prend le titre qui commence le plus récemment,
          même s'il n'a pas encore commencé. Les dates de début manquantes passent après les dates connues.
          Vaut NULL si le candidat n'a aucun titre ou si le début du dernier titre n'est pas connu.
      - name: date_fin_dernier_pass_iae
        description: >-
          Dernier jour de validité du même titre que date_debut_dernier_pass_iae.
          Vaut NULL si le candidat n'a aucun titre, si ce titre a une durée indéterminée
          ou si sa date de fin manque.
      - name: statut_dernier_pass_iae
        description: >-
          État du dernier Pass IAE, repris à la dernière mise à jour de fct_emplois__pass_iae : Actif, Suspendu,
          Expiré ou À venir.
          Sans PASS IAE veut dire que le candidat n'a aucun titre, ni PASS IAE ni ancien agrément Pôle emploi.
          Vaut NULL si le candidat a un titre mais que son état n'est pas connu.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Sans PASS IAE', 'Actif', 'Suspendu', 'Expiré', 'À venir']

  - name: fct_emplois__pass_iae
    description: >-
      Cette table rassemble les PASS IAE et les anciens agréments Pôle emploi,
      y compris ceux repris de l’historique des AI. Chaque ligne correspond à un titre,
      avec son candidat, sa structure, ses dates de validité et sa durée.
      On y retrouve son état à la dernière mise à jour : actif, suspendu, expiré ou à venir.
      Elle résume aussi ses suspensions, ses prolongations accordées et ses demandes de prolongation,
      avec leur nombre et leurs principales dates. Un candidat peut avoir plusieurs titres, donc plusieurs lignes.
    columns:
      - name: id_pass_iae
        description: Identifiant du PASS IAE ou de l’ancien agrément.
        data_tests:
          - not_null
          - unique
      - name: id_candidat
        description: Identifiant du candidat titulaire. S'il manque, on garde la ligne et le test not_null échoue.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw_emplois', 'candidats_v0')
                field: id
              config:
                severity: warn
      - name: type_pass
        description: PASS IAE ou Agrément PE, déjà normalisé dans le staging.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PASS IAE
                  - Agrément PE
      - name: hash_numero_pass_iae
        description: Empreinte du numéro du titre, sans exposer le numéro.
      - name: injection_ai
        description: >-
          true pour un PASS issu de l’import des données ASP de salariés déjà en poste
          dans une association intermédiaire (AI). C’est ce qu’on appelle la reprise de stock AI.
          Ces personnes étaient déjà dans le parcours : leur import ne correspond pas à une nouvelle entrée.
          false pour un titre qui ne vient pas de cette reprise ; NULL si l’information manque.
        data_type: boolean
      - name: id_structure
        description: Identifiant de la structure disponible dans la source. Aucun filtre sur son type.
      - name: date_debut
        description: Premier jour de validité du titre.
        data_tests:
          - not_null
      - name: date_fin
        description: >-
          Dernier jour de validité, inclus. On reprend la fin du staging : NULL si la durée est indéterminée.
        data_tests:
          - not_null:
              config:
                where: "is_duree_indeterminee is not true"
      - name: duree
        description: Durée reprise du staging. NULL si le titre a une durée indéterminée.
      - name: is_duree_indeterminee
        description: >-
          Indicateur repris du staging : true si la durée est indéterminée, false sinon.
          NULL signale une date de fin absente dans la source.
        data_type: boolean
        data_tests:
          - not_null
      - name: nombre_suspensions
        description: Nombre total de suspensions du titre, terminées ou en cours. Vaut zéro en l’absence d’événement.
        data_tests:
          - not_null
      - name: date_premiere_suspension
        description: Première date de début de suspension, sans filtre sur son état. Vaut NULL si aucun jalon n’existe.
      - name: date_derniere_suspension
        description: Dernière date de début de suspension, sans filtre sur son état. Vaut NULL si aucun jalon n’existe.
      - name: date_de_fin_derniere_suspension
        description: >
          Date de fin de la dernière suspension, choisie par date de début puis par identifiant décroissant.
          Les dates de début NULL passent en dernier. On garde la date de fin de la source,
          même si la suspension est en cours. Vaut NULL si cette date manque ou si le PASS n’a aucune suspension.
      - name: is_suspension_en_cours
        description: >
          Vaut true si au moins une suspension a en_cours = true dans la source.
          On ne regarde pas les dates. Si tous les indicateurs sont NULL, le résultat reste NULL.
          Vaut false si le PASS n’a aucune suspension.
        data_type: boolean
      - name: nombre_prolongations
        description: Nombre de prolongations accordées dans prolongations, avec ou sans demande liée. Les demandes
          acceptées ne sont pas ajoutées à ce nombre. Vaut zéro en l’absence d’événement.
        data_tests:
          - not_null
      - name: date_premiere_prolongation
        description: Première date de création d’une prolongation accordée. Vaut NULL si aucun jalon n’existe.
      - name: date_derniere_prolongation
        description: Dernière date de création d’une prolongation accordée. Vaut NULL si aucun jalon n’existe.
      - name: date_debut_derniere_prolongation
        description: Début de la dernière prolongation accordée, choisie par date de création puis par identifiant
          décroissant. Les dates NULL passent en dernier. Vaut NULL si aucun jalon n’existe.
      - name: date_fin_derniere_prolongation
        description: Fin de cette même dernière prolongation. La sentinelle 2040-01-01 est conservée. Vaut NULL si
          aucun jalon n’existe.
      - name: nombre_demandes_prolongation
        description: Nombre total de demandes, indépendamment des prolongations accordées. Vaut zéro en l’absence
          d’événement.
        data_tests:
          - not_null
      - name: nombre_demandes_acceptees
        description: Nombre de demandes dans l’état Acceptée, même sans prolongation associée. Vaut zéro en l’absence
          d’événement.
        data_tests:
          - not_null
      - name: nombre_demandes_refusees
        description: Nombre de demandes dans l’état Refusée. Vaut zéro en l’absence d’événement.
        data_tests:
          - not_null
      - name: nombre_demandes_en_attente
        description: Nombre de demandes dans l’état À traiter. Vaut zéro en l’absence d’événement.
        data_tests:
          - not_null
      - name: date_premiere_demande_prolongation
        description: Première date de demande de prolongation. Vaut NULL si aucun jalon n’existe.
      - name: date_derniere_demande_prolongation
        description: Dernière date de demande de prolongation. Vaut NULL si aucun jalon n’existe.
      - name: date_dernier_traitement_demande
        description: Dernier horodatage de traitement, toutes demandes du titre confondues. Peut concerner une demande
          plus ancienne. Vaut NULL si aucun jalon n’existe.
      - name: etat_derniere_demande_prolongation
        description: État de la dernière demande, choisie par date de demande puis par identifiant décroissant. Les
          dates NULL passent en dernier. Vaut NULL si aucun jalon n’existe.
      - name: statut_pass
        description: 'État à la date d’exécution du modèle, dans cet ordre de priorité : Expiré, À venir, Suspendu, Actif.
          Le dernier jour de validité est inclus. Un titre à durée indéterminée ne peut pas expirer.
          Si la validité est inconnue, ou si le PASS est valide et les indicateurs de suspension sont tous NULL, le statut reste NULL.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Expiré
                  - À venir
                  - Suspendu
                  - Actif
      - name: is_pass_valide
        description: >-
          Vaut true si le titre a commencé à la date d’exécution du modèle et si sa durée est indéterminée
          ou sa date de fin n’est pas dépassée. Les bornes sont incluses. Une date de fin manquante
          dans la source ne rend pas le titre valide. Une suspension ne change pas la validité du titre.
        data_type: boolean
        data_tests:
          - not_null
      - name: is_pass_actif
        description: >-
          Indique si le titre est encore valide et n’a pas de suspension en cours
          au moment de la mise à jour de la table. Un titre à durée indéterminée peut aussi être actif.
        data_type: boolean
        data_tests:
          - not_null
