version: 2

models:
  - name: stg_emplois__fiches_de_poste
    description: >
      Fiches de poste publiées sur les Emplois de l'Inclusion.
    config:
      tags:
        - actes-metier
    columns:
      - name: id
        description: Identifiant unique de la fiche de poste.
        tests:
          - not_null
          - unique
      - name: date_creation
        description: Date de création de la fiche de poste.
      - name: date_derniere_modification
        description: Date de dernière modification de la fiche de poste.
      - name: type_employeur
        description: Type de l'employeur porteur de la fiche de poste.
      - name: departement_employeur
        description: Département de l'employeur porteur de la fiche de poste.

  - name: stg_emplois__imer
    description: >
      Intentions de mise en relation (IMER) effectuées sur les
      Emplois de l'Inclusion.

      Chaque ligne représente une intention de mise en relation initiée par un utilisateur,
      canidat, prescripteur ou employeur.

    config:
      tags:
        - dora
    columns:
      - name: id
        description: Identifiant unique de l'intention de mise en relation.
        tests:
          - not_null
          - unique
      - name: date
        description: Date à laquelle l'intention de mise en relation a été enregistrée.
        tests:
          - not_null
      - name: user_session
        description: Identifiant de la session de l'utilisateur à l'origine de l'intention.
      - name: user_kind
        description: Type d'utilisateur à l'origine de l'intention.
      - name: user_id
        description: Identifiant de l'utilisateur à l'origine de l'intention.
      - name: user_prescriber_organization_id
        description: Identifiant de l'organisation prescriptrice de l'utilisateur.
      - name: user_company_id
        description: Identifiant de la structure employeuse de l'utilisateur.
      - name: structure_id
        description: Identifiant de la structure ciblée par l'intention de mise en relation.
      - name: kind
        description: >
          Type de l'intention de mise en relation. Valeurs possibles : service_ext_link,
          service_orientation, service_contact, structure_contact.
        tests:
          - accepted_values:
              values:
                - service_ext_link
                - service_orientation
                - service_contact
                - structure_contact
      - name: service_id
        description: Identifiant du service concerné par l'intention.
      - name: source
        description: Source à l'origine de l'intention de mise en relation.
      - name: external_link
        description: Lien externe associé à l'intention de mise en relation.
      - name: orientation_id
        description: >
          Identifiant de l'orientation. Renseigné uniquement lorsqu'une orientation a eu lieu.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de cette ligne dans Metabase.

  - name: stg_emplois__utilisateurs
    description: >
      Utilisateurs professionnels inscrits sur les Emplois de l'Inclusion : employeurs,
      prescripteurs et inspecteurs du travail. Les candidats ne sont pas dans cette table.
      Une ligne par utilisateur. Le rattachement à une structure, une organisation ou une
      institution est porté par `stg_emplois__collaborations`.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: Identifiant unique de l'utilisateur.
        tests:
          - not_null
          - unique
      - name: uid
        description: Identifiant unique universel (UUID) de l'utilisateur.
        tests:
          - not_null
          - unique
      - name: email
        description: Adresse e-mail de l'utilisateur. Donnée non publique.
      - name: type
        description: >
          Type de l'utilisateur professionnel. Valeurs possibles : employer, prescriber, labor_inspector.
      - name: prenom
        description: Prénom de l'utilisateur.
      - name: nom
        description: Nom de famille de l'utilisateur.
      - name: derniere_connexion
        description: Horodatage de la dernière connexion de l'utilisateur à la plateforme.
      - name: date_inscription
        description: Date d'inscription de l'utilisateur sur la plateforme.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__collaborations
    description: >
      Rattachements des utilisateurs professionnels à leur structure employeuse, organisation
      prescriptrice ou institution. Une ligne par rattachement : un utilisateur rattaché à
      plusieurs organisations apparaît sur plusieurs lignes, et la table n'a pas de clé primaire
      propre. Seuls les rattachements actifs sont exportés depuis les Emplois.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id_utilisateur
        description: >
          Identifiant de l'utilisateur rattaché. Correspond à `stg_emplois__utilisateurs.id`
          et n'est pas unique dans cette table.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emplois__utilisateurs')
                field: id
      - name: administrateur
        description: >
          Entier 0/1 (et non un booléen) indiquant si l'utilisateur est administrateur de la
          structure, de l'organisation ou de l'institution de cette ligne.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 0
                  - 1
                quote: false
      - name: id_structure
        description: >
          Identifiant de la structure employeuse. Null pour les autres types de rattachement.
      - name: id_organisation
        description: >
          Identifiant de l'organisation prescriptrice. Null pour les autres types de rattachement.
      - name: id_institution
        description: Identifiant de l'institution. Null pour les autres types de rattachement.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__institutions
    description: >
      Institutions rattachées aux Emplois de l'Inclusion : DDETS, DREETS, DGEFP, réseaux IAE et
      autres acteurs institutionnels. Une ligne par institution.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: Identifiant unique de l'institution.
        tests:
          - not_null
          - unique
      - name: type
        description: >
          Type de l'institution. Par exemple DDETS IAE, DDETS GEIQ, DDETS LOG, DREETS IAE, DREETS GEIQ,
          Réseau IAE ou DGEFP IAE.
      - name: nom
        description: Nom de l'institution.
      - name: departement
        description: Code du département de l'institution.
      - name: nom_departement
        description: Code et nom du département de l'institution, par exemple 45 - Loiret.
      - name: region
        description: Nom de la région de l'institution.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__candidats
    description: >-
      On reprend toutes les colonnes de raw_emplois.candidats_v0. On enlève les accents
      dans les noms et on transforme les indicateurs entiers 0/1 en booléens : 0 devient
      false, 1 devient true et les valeurs NULL restent NULL. On garde les autres types
      et valeurs tels quels. On ne filtre aucune ligne, on ne regroupe pas les données,
      on ne supprime pas les doublons et on ne fait pas de jointure avec d'autres tables.
      On ne décrit une colonne que si elle est documentée dans la source.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('raw_emplois', 'candidats_v0')
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('raw_emplois', 'candidats_v0')
                field: id
      - name: uid
      - name: hash_nir
      - name: sexe_selon_nir
      - name: annee_naissance_selon_nir
      - name: mois_naissance_selon_nir
      - name: age
      - name: date_inscription
      - name: type_inscription
      - name: pe_connect
      - name: pe_inscrit
      - name: date_derniere_connexion
      - name: date_premiere_connexion
      - name: actif
      - name: code_postal
      - name: departement
      - name: nom_departement
      - name: region
      - name: adresse_en_qpv
      - name: total_candidatures
      - name: total_embauches
      - name: total_diagnostics
      - name: date_diagnostic
      - name: date_expiration_diagnostic
      - name: diagnostic_valide
      - name: id_auteur_diagnostic_prescripteur
      - name: id_auteur_diagnostic_employeur
      - name: type_auteur_diagnostic
      - name: sous_type_auteur_diagnostic
      - name: nom_auteur_diagnostic
      - name: type_structure_derniere_embauche
      - name: total_criteres_niveau_1
      - name: total_criteres_niveau_2
      - name: critere_n1_beneficiaire_du_rsa
      - name: critere_n1_beneficiaire_du_rsa_date_certification
      - name: critere_n1_beneficiaire_du_rsa_periode_certification
      - name: critere_n1_allocataire_ass
      - name: critere_n1_allocataire_aah
      - name: critere_n1_allocataire_aah_date_certification
      - name: critere_n1_allocataire_aah_periode_certification
      - name: critere_n1_detld_plus_de_24_mois
      - name: critere_n2_niveau_d_etude_3_cap_bep_ou_infra
      - name: critere_n2_senior_plus_de_50_ans
      - name: critere_n2_jeune_moins_de_26_ans
      - name: critere_n2_sortant_de_l_ase
      - name: critere_n2_deld_12_a_24_mois
      - name: critere_n2_travailleur_handicape
      - name: critere_n2_travailleur_handicape_date_certification
      - name: critere_n2_travailleur_handicape_periode_certification
      - name: critere_n2_parent_isole
      - name: critere_n2_parent_isole_date_certification
      - name: critere_n2_parent_isole_periode_certification
      - name: critere_n2_personne_sans_hebergement_ou_hebergee_ou_ayant_u
      - name: critere_n2_refugie_statutaire_beneficiaire_d_une_protectio
      - name: critere_n2_resident_zrr
      - name: critere_n2_resident_qpv
      - name: critere_n2_sortant_de_detention_ou_personne_placee_sous_main
      - name: critere_n2_maitrise_de_la_langue_francaise_inferieure_au_ni
      - name: critere_n2_probleme_de_mobilite
      - name: injection_ai
      - name: date_mise_a_jour_metabase

  - name: stg_emplois__pass_iae
    description: >
      On garde tous les titres de emplois.pass_agréments. Ici, on nettoie les textes et on simplifie les noms.
      On ramène les types à PASS IAE ou Agrément PE. Quand la source donne 2040-01-01 comme fin,
      on met date_fin et duree à NULL, avec is_duree_indeterminee à true.
      Une fin absente dans la source reste une anomalie. Le mart reprend ces champs tels quels.
      Pour injection_ai, 1 devient true, 0 devient false et NULL reste NULL.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('emplois', 'pass_agréments')
    columns:
      - name: id_pass_iae
        description: Identifiant unique du PASS IAE ou de l'agrément.
        data_tests:
          - not_null
          - unique
      - name: type_pass
        description: >
          On nettoie les espaces, puis PASS IAE (99999) devient PASS IAE
          et Agrément PE via ITOU (non 99999) devient Agrément PE.
          Un type vide ou inconnu donne NULL ; les tests le signalent.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PASS IAE
                  - Agrément PE
      - name: date_debut
        description: Début de validité du PASS IAE. C'est en général la date d'embauche du candidat.
        data_tests:
          - not_null
      - name: date_fin
        description: >
          Dernier jour de validité, inclus. Si la source donne 2040-01-01, on met NULL ici
          et is_duree_indeterminee vaut true. Si la fin manque déjà dans la source, le test échoue.
        data_tests:
          - not_null:
              config:
                where: "is_duree_indeterminee is not true"
      - name: duree
        description: >
          On garde la durée fournie par la source, sans la recalculer.
          Pour un titre à durée indéterminée, on met NULL.
      - name: is_duree_indeterminee
        description: >
          true si la fin source vaut 2040-01-01, false pour une autre date.
          Si la date manque dans la source, on garde NULL et le test le signale.
        data_type: boolean
        data_tests:
          - not_null
      - name: id_candidat
        description: Identifiant du candidat qui a le PASS IAE.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw_emplois', 'candidats_v0')
                field: id
              config:
                severity: warn
      - name: id_structure
        description: Identifiant de la structure employeuse qui a déclenché le PASS IAE.
      - name: type_structure
        description: Type de la structure employeuse liée au PASS IAE.
      - name: siret_structure
        description: SIRET de la structure employeuse au moment où le PASS IAE a été délivré.
      - name: nom_structure
        description: Nom de la structure employeuse au moment où le PASS IAE a été délivré.
      - name: departement_structure_ou_org_pe
        description: >
          Code INSEE du département de la structure employeuse.
          Pour les anciens agréments, c'est celui de l'organisation Pôle emploi.
      - name: nom_departement_structure_ou_org_pe
        description: >
          Nom du département de la structure employeuse.
          Pour les anciens agréments, c'est celui de l'organisation Pôle emploi.
      - name: region_structure_ou_org_pe
        description: >
          Nom de la région de la structure employeuse.
          Pour les anciens agréments, c'est celle de l'organisation Pôle emploi.
      - name: injection_ai
        description: >
          Indique si le PASS vient de la reprise de l'historique des AI (Associations Intermédiaires).
          1 devient true, 0 devient false et NULL reste NULL.
          Pour analyser les flux courants, la source recommande de garder les PASS avec injection_ai = 0,
          soit false ici.
        data_type: boolean
      - name: hash_numero_pass_iae
        description: Numéro du PASS IAE anonymisé par hachage. Il permet de retrouver le PASS sans afficher son vrai numéro.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière mise à jour de cette ligne dans Metabase. La source est mise à jour chaque jour.
        data_tests:
          - not_null
  - name: stg_emplois__suspensions
    description: >
      Une ligne par suspension de PASS IAE ou d'ancien agrément.
      On garde toutes les colonnes et toutes les lignes de raw_emplois.suspensions_v0,
      sans jointure, regroupement ni filtre métier. On simplifie les noms de colonnes
      et on nettoie les textes. Pour en_cours, 1 devient true, 0 devient false et NULL reste NULL.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('raw_emplois', 'suspensions_v0')
    columns:
      - name: id_suspension
        data_tests:
          - not_null
          - unique
      - name: id_pass_iae
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emplois__pass_iae')
                field: id_pass_iae
              config:
                severity: warn
      - name: date_debut
      - name: date_fin
      - name: motif
      - name: en_cours
        data_type: boolean
      - name: date_creation
      - name: date_mise_a_jour_metabase
  - name: stg_emplois__prolongations
    description: Une ligne par prolongation accordée. On garde toutes les colonnes et toutes les lignes de la source.
      On simplifie les noms de colonnes et on nettoie les textes, sans jointure, regroupement ni filtre métier.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('raw_emplois', 'prolongations')
    columns:
      - name: id_prolongation
        description: Identifiant unique de la prolongation.
        data_tests:
          - not_null
          - unique
      - name: id_pass_iae
        description: Identifiant du PASS IAE prolongé. Un même PASS peut avoir plusieurs prolongations.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emplois__pass_iae')
                field: id_pass_iae
              config:
                severity: warn
      - name: date_debut
        description: >
          Début de la prolongation. C'est en général la date de fin du PASS initial
          ou de la prolongation précédente.
      - name: date_fin
        description: Fin de la prolongation. 2040-01-01 correspond à une durée indéterminée. On garde cette valeur.
      - name: motif
        description: Raison pour laquelle le PASS IAE est prolongé.
      - name: id_utilisateur_declarant
        description: Identifiant de l'utilisateur de la structure qui a déclaré la prolongation.
      - name: id_structure_declarante
        description: Identifiant de la structure employeuse qui a déclaré la prolongation.
      - name: id_organisation_prescripteur
        description: >
          Identifiant de l'organisation prescriptrice qui a validé la demande de prolongation.
          Il est NULL quand la SIAE valide directement, ou pour les prolongations d'avant juillet 2023.
      - name: id_utilisateur_prescripteur
        description: Identifiant de l'utilisateur prescripteur qui a traité la demande. NULL si aucun prescripteur n'intervient.
      - name: date_creation
        description: Date de création de la prolongation dans le système. On garde le type de la source.
      - name: id_demande_de_prolongation
        description: Identifiant de la demande de prolongation liée. Il est NULL pour les prolongations d'avant juillet 2023.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_emplois__demandes_prolongation')
                field: id_demande_prolongation
              config:
                severity: warn
      - name: date_mise_a_jour_metabase
        description: Date de la dernière mise à jour de cette ligne dans Metabase. La source est mise à jour chaque jour.
  - name: stg_emplois__demandes_prolongation
    description: Une ligne par demande de prolongation de PASS IAE. On garde toutes les colonnes et toutes les lignes de raw_emplois.demandes_de_prolongation.
      On simplifie les noms de colonnes et on nettoie les textes, sans jointure, regroupement ni filtre métier.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('raw_emplois', 'demandes_de_prolongation')
    columns:
      - name: id_demande_prolongation
        description: Colonne id de la source, renommée id_demande_prolongation.
        data_tests:
          - not_null
          - unique
      - name: id_pass_iae
        description: Colonne id_pass_agrément de la source, renommée id_pass_iae.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emplois__pass_iae')
                field: id_pass_iae
              config:
                severity: warn
      - name: date_debut
      - name: date_fin
      - name: motif
        description: On enlève les espaces au début et à la fin du texte et on remplace les textes vides par NULL.
      - name: id_utilisateur_declarant
      - name: id_structure_declarante
      - name: id_organisation_prescripteur
      - name: id_utilisateur_prescripteur
      - name: id_prolongation
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_emplois__prolongations')
                field: id_prolongation
              config:
                severity: warn
      - name: etat
        description: On enlève les espaces au début et à la fin du texte et on remplace les textes vides par NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Acceptée
                  - Refusée
                  - À traiter
      - name: motif_de_refus
        description: On enlève les espaces au début et à la fin du texte et on remplace les textes vides par NULL.
      - name: date_de_demande
      - name: date_traitement
      - name: id_utilisateur_traitant
      - name: date_envoi_rappel
      - name: date_mise_a_jour_metabase
