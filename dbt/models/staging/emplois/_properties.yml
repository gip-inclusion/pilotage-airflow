version: 2

models:
  - name: stg_emplois__fiches_de_poste
    description: >
      Fiches de poste publiées sur les Emplois de l'Inclusion.
    config:
      tags:
        - actes-metier
    columns:
      - name: id
        description: Identifiant unique de la fiche de poste.
        tests:
          - not_null
          - unique
      - name: date_creation
        description: Date de création de la fiche de poste.
      - name: date_derniere_modification
        description: Date de dernière modification de la fiche de poste.
      - name: type_employeur
        description: Type de l'employeur porteur de la fiche de poste.
      - name: departement_employeur
        description: Département de l'employeur porteur de la fiche de poste.

  - name: stg_emplois__imer
    description: >
      Intentions de mise en relation (IMER) effectuées sur les
      Emplois de l'Inclusion.

      Chaque ligne représente une intention de mise en relation initiée par un utilisateur,
      canidat, prescripteur ou employeur.

    config:
      tags:
        - dora
    columns:
      - name: id
        description: Identifiant unique de l'intention de mise en relation.
        tests:
          - not_null
          - unique
      - name: date
        description: Date à laquelle l'intention de mise en relation a été enregistrée.
        tests:
          - not_null
      - name: user_session
        description: Identifiant de la session de l'utilisateur à l'origine de l'intention.
      - name: user_kind
        description: Type d'utilisateur à l'origine de l'intention.
      - name: user_id
        description: Identifiant de l'utilisateur à l'origine de l'intention.
      - name: user_prescriber_organization_id
        description: Identifiant de l'organisation prescriptrice de l'utilisateur.
      - name: user_company_id
        description: Identifiant de la structure employeuse de l'utilisateur.
      - name: structure_id
        description: Identifiant de la structure ciblée par l'intention de mise en relation.
      - name: kind
        description: >
          Type de l'intention de mise en relation. Valeurs possibles : service_ext_link,
          service_orientation, service_contact, structure_contact.
        tests:
          - accepted_values:
              values:
                - service_ext_link
                - service_orientation
                - service_contact
                - structure_contact
      - name: service_id
        description: Identifiant du service concerné par l'intention.
      - name: source
        description: Source à l'origine de l'intention de mise en relation.
      - name: external_link
        description: Lien externe associé à l'intention de mise en relation.
      - name: orientation_id
        description: >
          Identifiant de l'orientation. Renseigné uniquement lorsqu'une orientation a eu lieu.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de cette ligne dans Metabase.

  - name: stg_emplois__utilisateurs
    description: >
      Utilisateurs professionnels inscrits sur les Emplois de l'Inclusion : employeurs,
      prescripteurs et inspecteurs du travail. Les candidats ne sont pas dans cette table.
      Une ligne par utilisateur. Le rattachement à une structure, une organisation ou une
      institution est porté par `stg_emplois__collaborations`.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: Identifiant unique de l'utilisateur.
        tests:
          - not_null
          - unique
      - name: uid
        description: Identifiant unique universel (UUID) de l'utilisateur.
        tests:
          - not_null
          - unique
      - name: email
        description: Adresse e-mail de l'utilisateur. Donnée non publique.
      - name: type
        description: >
          Type de l'utilisateur professionnel. Valeurs possibles : employer, prescriber, labor_inspector.
      - name: prenom
        description: Prénom de l'utilisateur.
      - name: nom
        description: Nom de famille de l'utilisateur.
      - name: derniere_connexion
        description: Horodatage de la dernière connexion de l'utilisateur à la plateforme.
      - name: date_inscription
        description: Date d'inscription de l'utilisateur sur la plateforme.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__collaborations
    description: >
      Rattachements des utilisateurs professionnels à leur structure employeuse, organisation
      prescriptrice ou institution. Une ligne par rattachement : un utilisateur rattaché à
      plusieurs organisations apparaît sur plusieurs lignes, et la table n'a pas de clé primaire
      propre. Seuls les rattachements actifs sont exportés depuis les Emplois.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id_utilisateur
        description: >
          Identifiant de l'utilisateur rattaché. Correspond à `stg_emplois__utilisateurs.id`
          et n'est pas unique dans cette table.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_emplois__utilisateurs')
                field: id
      - name: administrateur
        description: >
          Entier 0/1 (et non un booléen) indiquant si l'utilisateur est administrateur de la
          structure, de l'organisation ou de l'institution de cette ligne.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 0
                  - 1
                quote: false
      - name: id_structure
        description: >
          Identifiant de la structure employeuse. Null pour les autres types de rattachement.
      - name: id_organisation
        description: >
          Identifiant de l'organisation prescriptrice. Null pour les autres types de rattachement.
      - name: id_institution
        description: Identifiant de l'institution. Null pour les autres types de rattachement.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__institutions
    description: >
      Institutions rattachées aux Emplois de l'Inclusion : DDETS, DREETS, DGEFP, réseaux IAE et
      autres acteurs institutionnels. Une ligne par institution.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: Identifiant unique de l'institution.
        tests:
          - not_null
          - unique
      - name: type
        description: >
          Type de l'institution. Par exemple DDETS IAE, DDETS GEIQ, DDETS LOG, DREETS IAE, DREETS GEIQ,
          Réseau IAE ou DGEFP IAE.
      - name: nom
        description: Nom de l'institution.
      - name: departement
        description: Code du département de l'institution.
      - name: nom_departement
        description: Code et nom du département de l'institution, par exemple 45 - Loiret.
      - name: region
        description: Nom de la région de l'institution.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__orientations
    description: >-
      Liste des orientations émises par la plateforme (les Emplois).
      Une orientation (id) correspond à l'envoi d'un formulaire de la part d'un prescripteur (sender_id).
      Un formulaire étant la recommandation d'un service (service_uid) à un tiers (beneficiary).
    config:
      tags:
        - dora
    columns:
      - name: id
        description: >
          Identifiant unique de l'orientation.
          Correspond à raw_emplois.imer_v0.orientation_id.
        tests:
          - unique
          - not_null
      - name: creation_date
        description: Date d'envoi de l'orientation.
        tests:
          - not_null
      - name: processing_date
        description: >
          Date de traitement de l'orientation (acceptée ou déclinée).
          Vide lorsque l'orientation est encore ouverte.
      - name: status
        description: État de l'orientation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - OUVERTE
                  - VALIDÉE
                  - REFUSÉE
                  - EXPIRÉE
      - name: service_uid
        description: >
          Identifiant Data Inclusion du service vers lequel le bénéficiaire est orienté.
          Correspond à raw_emplois.services_v0.uid.
      - name: structure_uid
        description: >
          Identifiant Data Inclusion de la structure porteuse du service.
          Correspond à int_di__structure_source_mapping.source_structure_id.
      - name: beneficiary_id
        description: Identifiant du bénéficiaire, correspondant à raw_emplois.candidats_v0.id.
      - name: beneficiary_public_id
        description: Identifiant public du bénéficiaire, correspondant à raw_emplois.candidats_v0.uid.
      - name: sender_id
        description: >
          Identifiant du professionnel (employeur ou prescripteur) qui a envoyé l'orientation.
          Correspond à raw_emplois.utilisateurs_v0.id.
      - name: sender_public_id
        description: >
          Identifiant public du professionnel (employeur ou prescripteur) qui a envoyé l'orientation.
          Correspond à raw_emplois.utilisateurs_v0.uid.
      - name: sender_kind
        description: Type d'utilisateur à l'origine de l'orientation (employeur ou prescripteur).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - emplois_employer
                  - emplois_prescriber
      - name: sender_prescriber_organization_id
        description: >
          Identifiant de l'organisation prescriptrice de l'utilisateur.
          Correspond à raw_emplois.organisations_v0.id.
      - name: sender_prescriber_organization_uid
        description: >
          Identifiant public de l'organisation prescriptrice de l'utilisateur.
          Correspond à raw_emplois.organisations_v0.uid.
      - name: sender_company_id
        description: Identifiant de l'entreprise de l'utilisateur, correspondant à raw_emplois.structures_v0.id.
      - name: sender_company_uid
        description: Identifiant public de l'entreprise de l'utilisateur, correspondant à raw_emplois.structures_v0.uid.
      - name: data_protection_commitment
        description: Engagement RGPD de l'utilisateur ayant émis l'orientation.
      - name: last_reminder_email_sent_at
        description: >
          Date du dernier rappel envoyé à l'offreur de service. Les relances ont lieu à J+10 et J+20
          après l'envoi, tant que l'orientation reste ouverte.
      - name: date_mise_a_jour_metabase
        description: Date de dernière synchronisation dans Metabase.
  - name: stg_emplois__services
    description: >-
      Liste des services d'insertion référencés sur la plateforme (les Emplois).
      L'API data·inclusion renvoie une photographie des services actuels ; un service supprimé chez
      un fournisseur disparaît des résultats. Sur la plateforme, il est simplement désactivé
      (is_active=False), ce qui préserve les relations avec les IMER et les orientations.
    config:
      tags:
        - dora
    columns:
      - name: id
        description: Identifiant interne du service.
        tests:
          - unique
          - not_null
      - name: uid
        description: >
          Identifiant public (Data Inclusion) du service. Correspond à raw_emplois.orientations_v0.service_uid
          et à dim_data_inclusion__services.service_id.
        tests:
          - unique
          - not_null
      - name: structure_uid
        description: >
          Identifiant public (Data Inclusion) de la structure qui offre le service.
          Correspond à int_di__structure_source_mapping.source_structure_id.
      - name: source
        description: Source de la donnée.
      - name: source_link
        description: Lien de la source (peut être vide).
      - name: name
        description: Nom du service.
      - name: description
        description: Description du service.
      - name: duration_weekly_hours
        description: Volume horaire hebdomadaire.
      - name: duration_weeks
        description: Nombre de semaines.
      - name: code_insee
        description: Code INSEE de la commune du service, correspondant à dim_commune.code_commune_insee.
      - name: is_active
        description: >
          État du service. Si False, le service n'apparaissait plus dans les résultats de l'API data·inclusion.
          Certains services sont désactivés temporairement, le temps d'un weekend par exemple.
      - name: date_mise_a_jour_metabase
        description: Date de dernière synchronisation dans Metabase.

  - name: stg_emplois__structures
    description: >
      Structures employeuses inscrites sur les Emplois de l'Inclusion (SIAE, GEIQ, EA, EATT, OPCS).
      Une ligne par structure, avec ses informations administratives, ses deux adresses
      (principale et de correspondance C1=adresse entrée dans les Emplois), ses agrégats d'activité (candidatures, embauches, fiches de poste)
      et ses métadonnées de suivi. Une structure est considérée comme mère si elle provient de l'export ASP
    config:
      tags:
        - emplois
    columns:
      - name: id
        description: Identifiant unique de la structure.
        tests:
          - not_null
          - unique
      - name: uid
        description: Identifiant unique universel (UUID) de la structure.
        tests:
          - not_null
          - unique
      - name: id_asp
        description: >
          Identifiant de la structure dans le système de l'ASP, qui gère les conventionnements
          et le financement des SIAE. Les structures mères et antenne ont le même id_asp.
          Il faut que source = Export ASP pour que l'on identifie la structure mère (ou qu'elle soit présente dans stg_asp__structures)
          Null pour les structures non conventionnées via l'ASP
          (GEIQ, EA, OPCS).
      - name: nom
        description: Nom de la structure tel que saisi lors de l'inscription.
      - name: nom_complet
        description: Nom complet de la structure, au format Type de structure - ID structure - Nom de la structure.
      - name: description
        description: Description libre de la structure et de ses activités, saisie par l'employeur.
      - name: type
        description: >
          Type de structure employeuse. Valeurs possibles : ACI (Atelier et Chantier d'Insertion),
          EI (Entreprise d'Insertion), AI (Association Intermédiaire), ETTI (Entreprise de Travail
          Temporaire d'Insertion), EITI (Entreprise d'Insertion par le Travail Indépendant),
          EA (Entreprise Adaptée), EATT (Entreprise Adaptée de Travail Temporaire),
          GEIQ (Groupement d'Employeurs pour l'Insertion et la Qualification),
          OPCS (Organisme concourant à l'insertion des personnes placées sous main de justice).
      - name: siret
        description: Numéro SIRET de la structure (14 chiffres). Le structures mères et antennes peuvent avoir le même SIRET.
      - name: source
        description: >
          Origine de la création de la structure. Valeurs possibles : Export ASP, Export GEIQ,
          Utilisateur (Antenne), Staff Itou.
      - name: code_naf
        description: Code NAF de la structure, décrivant son activité principale.
      - name: email_public
        description: Adresse e-mail publique de la structure, visible des candidats.
      - name: email_authentification
        description: Adresse e-mail utilisée pour l'authentification sur la plateforme. Donnée non publique.
      - name: convergence_france
        description: >
          Entier 0/1 indiquant si la structure participe au programme Convergence France,
          dispositif d'accompagnement renforcé vers l'emploi durable.
      - name: adresse_ligne_1
        description: Première ligne de l'adresse principale, équivalente à celle de la structure mère.
      - name: adresse_ligne_2
        description: Complément de l'adresse principale, équivalent à celui de la structure mère.
      - name: code_postal
        description: Code postal de l'adresse principale, équivalent à celui de la structure mère.
      - name: code_commune
        description: Code INSEE de la commune de l'adresse principale, équivalent à celui de la structure mère.
      - name: ville
        description: Nom de la ville de l'adresse principale, équivalent à celui de la structure mère.
      - name: longitude
        description: Longitude de l'adresse principale (WGS84), équivalente à celle de la structure mère.
      - name: latitude
        description: Latitude de l'adresse principale (WGS84), équivalente à celle de la structure mère.
      - name: departement
        description: Code du département de l'adresse principale, par exemple 59, 75 ou 974.
      - name: nom_departement
        description: Code et nom du département de l'adresse principale, par exemple 93 - Seine-Saint-Denis.
      - name: region
        description: Nom de la région de l'adresse principale.
      - name: adresse_ligne_1_c1
        description: >
          Première ligne de l'adresse de correspondance (C1=telle que déclarée dans les emplois), distincte de l'adresse principale
          pour les structures ayant deux établissements.
      - name: adresse_ligne_2_c1
        description: Complément de l'adresse C1=telle que déclarée dans les emplois.
      - name: code_postal_c1
        description: Code postal de l'adresse C1=telle que déclarée dans les emplois.
      - name: code_commune_c1
        description: Code INSEE de la commune de l'adresse C1=telle que déclarée dans les emplois.
      - name: ville_c1
        description: Nom de la ville de l'adresse C1=telle que déclarée dans les emplois.
      - name: longitude_c1
        description: Longitude de l'adresse C1=telle que déclarée dans les emplois (WGS84).
      - name: latitude_c1
        description: Latitude de l'adresse C1=telle que déclarée dans les emplois (WGS84).
      - name: departement_c1
        description: Code du département de l'adresse C1=telle que déclarée dans les emplois.
      - name: nom_departement_c1
        description: Code et nom du département de l'adresse C1=telle que déclarée dans les emplois.
      - name: region_c1
        description: Nom de la région de l'adresse C1=telle que déclarée dans les emplois.
      - name: date_inscription
        description: Date d'inscription de la structure sur les Emplois de l'Inclusion.
      - name: total_membres
        description: Nombre d'utilisateurs rattachés à la structure.
      - name: total_candidatures
        description: Nombre total de candidatures reçues par la structure, tous états confondus.
      - name: total_candidatures_30j
        description: Nombre de candidatures reçues au cours des 30 derniers jours.
      - name: total_embauches
        description: Nombre total de candidatures acceptées par la structure.
      - name: total_embauches_30j
        description: Nombre de candidatures acceptées au cours des 30 derniers jours.
      - name: taux_conversion_30j
        description: Taux de conversion des candidatures en embauches sur les 30 derniers jours, entre 0 et 1.
      - name: total_auto_prescriptions
        description: >
          Nombre de candidatures en auto prescription.
      - name: total_candidatures_autonomes
        description: Nombre de candidatures déposées de manière autonome par des candidats.
      - name: total_candidatures_via_prescripteur
        description: Nombre de candidatures reçues via un prescripteur ou un orienteur.
      - name: total_candidatures_non_traitees
        description: Nombre de candidatures en attente de traitement (nouvelles ou en attente).
      - name: total_candidatures_en_etude
        description: Nombre de candidatures actuellement à l'étude.
      - name: date_derniere_connexion
        description: Date de la dernière connexion d'un membre de la structure à la plateforme.
      - name: active
        description: Entier 0/1 indiquant si la structure est active sur la plateforme.
      - name: date_derniere_evolution_candidature
        description: Date du dernier changement d'état d'une candidature reçue par la structure.
      - name: total_fiches_de_poste_actives
        description: Nombre de fiches de poste ouvertes au recrutement.
      - name: total_fiches_de_poste_inactives
        description: Nombre de fiches de poste fermées.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.

  - name: stg_emplois__organisations
    description: >
      Organisations prescriptrices et orienteuses inscrites sur les Emplois de l'Inclusion
      (France Travail, Mission locale, CCAS, CHRS, conseil départemental...). Une ligne par
      organisation. Les organisations habilitées peuvent réaliser des diagnostics d'éligibilité IAE
      et délivrer un PASS IAE, les orienteurs peuvent uniquement orienter des candidats vers des SIAE.
    config:
      tags:
        - emplois
    columns:
      - name: id
        description: Identifiant unique de l'organisation.
        tests:
          - not_null
          - unique
      - name: uid
        description: Identifiant unique universel (UUID) de l'organisation.
        tests:
          - not_null
          - unique
      - name: siret
        description: Numéro SIRET de l'organisation. Peut être null et n'est pas unique dans la table.
      - name: nom
        description: Nom de l'organisation tel que saisi lors de l'inscription.
      - name: type
        description: >
          Code du type d'organisation, par exemple FT (France Travail), ML (Mission locale),
          CAP_EMPLOI (Cap emploi), DEPT (Service social du conseil départemental), ODC
          (Organisation délégataire d'un Conseil Départemental), CCAS, CHRS, PLIE, SPIP, Orienteur
          ou Autre. Voir `type_complet` pour les libellés longs.
      - name: type_complet
        description: Libellé long du type d'organisation, par exemple Mission locale ou France Travail.
      - name: habilitee
        description: >
          Entier 0/1 indiquant si l'organisation est habilitée à réaliser des diagnostics
          d'éligibilité IAE (0 pour les orienteurs).
      - name: adresse_ligne_1
        description: Première ligne de l'adresse de l'organisation.
      - name: adresse_ligne_2
        description: Complément de l'adresse de l'organisation.
      - name: code_postal
        description: Code postal de l'organisation.
      - name: code_commune
        description: Code INSEE de la commune de l'organisation.
      - name: ville
        description: Nom de la ville de l'organisation.
      - name: longitude
        description: Longitude de l'organisation (WGS84).
      - name: latitude
        description: Latitude de l'organisation (WGS84).
      - name: departement
        description: Code du département de l'organisation, par exemple 59, 75 ou 974.
      - name: nom_departement
        description: Code et nom du département de l'organisation, par exemple 62 - Pas-de-Calais.
      - name: region
        description: Nom de la région de l'organisation.
      - name: date_inscription
        description: Date d'inscription de l'organisation sur les Emplois de l'Inclusion.
      - name: code_safir
        description: >
          Code SAFIR de l'agence France Travail. Renseigné uniquement pour les organisations
          de type FT.
      - name: total_membres
        description: Nombre d'utilisateurs rattachés à l'organisation.
      - name: total_candidatures
        description: Nombre total de candidatures émises par l'organisation.
      - name: total_embauches
        description: Nombre de candidatures émises par l'organisation ayant abouti à une embauche.
      - name: date_derniere_candidature
        description: Date de la dernière candidature émise par l'organisation.
      - name: date_derniere_connexion
        description: Date de la dernière connexion d'un membre de l'organisation à la plateforme.
      - name: active
        description: Entier 0/1 indiquant si l'organisation est active sur la plateforme.
      - name: brsa
        description: >
          Entier 0/1 indiquant si l'organisation est conventionnée pour l'accompagnement
          des bénéficiaires du RSA.
      - name: date_mise_a_jour_metabase
        description: Date de la dernière synchronisation de la ligne dans Metabase.
