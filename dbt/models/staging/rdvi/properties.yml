version: 2

models:
  - name: stg_rdvi__users
    description: >
      Une ligne par compte usager présent dans la source, y compris les comptes supprimés logiquement.
      Reprend toutes les colonnes de la source.
    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique du compte usager dans rdv-insertion.
        data_tests:
          - not_null
          - unique
      - name: created_at
        description: Date et heure de création du compte.
      - name: created_through
        description: Origine de la création du compte.
      - name: role
        description: Rôle de l'usager, par exemple demandeur ou conjoint.
      - name: rights_opening_date
        description: Date d'ouverture des droits RSA.
      - name: deleted_at
        description: Date et heure de suppression logique du compte, si renseignées.
      - name: affiliation_number
        description: Numéro d'allocataire de l'usager. Ici, la valeur est anonymisée.
      - name: first_name
        description: Prénom de l'usager. Ici, la valeur est anonymisée.
      - name: last_name
        description: Nom de l'usager. Ici, la valeur est anonymisée.
      - name: address
        description: Adresse de l'usager. Ici, la valeur est anonymisée.
      - name: phone_number
        description: Numéro de téléphone de l'usager. Ici, la valeur est anonymisée.
      - name: email
        description: Email de l'usager. Ici, la valeur est anonymisée.
      - name: title
        description: Civilité de l'usager. Ici, la valeur est anonymisée.
      - name: birth_name
        description: Nom de naissance de l'usager. Ici, la valeur est anonymisée.
      - name: nir
        description: NIR de l'usager. Ici, la valeur est anonymisée.
      - name: france_travail_id
        description: Identifiant France Travail de l'usager. Ici, la valeur est anonymisée.

  - name: stg_rdvi__motifs
    description: >
      Une ligne par motif de rendez-vous présent dans la source. Reprend toutes les colonnes de la source.
    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique du motif dans rdv-insertion.
        data_tests:
          - not_null
          - unique
      - name: name
        description: Nom du motif de rendez-vous.
      - name: motif_category_id
        description: Identifiant de la catégorie à laquelle le motif est rattaché.
      - name: collectif
        description: Indique si le motif correspond à un rendez-vous collectif.
      - name: instruction_for_rdv
        description: Consignes pour le rendez-vous. Ici, la valeur est anonymisée.

  - name: stg_rdvi__agents
    description: >
      Représente les professionnels utilisant rdv-insertion, comme les travailleurs sociaux ou
      conseillers.

      Rôle : compte utilisateur de l'agent.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique de l'agent dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: email
        description: Email de l'agent, unique et utilisé comme identifiant de connexion.
      - name: first_name
        description: Prénom de l'agent. Ici, la valeur est anonymisée.
      - name: last_name
        description: Nom de l'agent. Ici, la valeur est anonymisée.
      - name: super_admin
        description: Indique si l'agent est super-administrateur.
      - name: last_sign_in_at
        description: Date de dernière connexion de l'agent.
      - name: created_at
        description: Date de création du compte de l'agent.

  - name: stg_rdvi__agent_roles
    description: >
      Table de jonction enrichie entre agents et organisations.

      Rôle : définit les droits d'un agent dans une organisation.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique du rôle dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: agent_id
        description: Agent concerné par le rôle.
        tests:
          - not_null
      - name: organisation_id
        description: Organisation concernée par le rôle.
        tests:
          - not_null
      - name: access_level
        description: "Niveau d'accès de l'agent. Valeurs possibles : basic, admin."
      - name: authorized_to_export_csv
        description: >
          Droit d'export CSV. Ce droit est automatiquement à true pour les admins.

  - name: stg_rdvi__departments
    description: >
      Représente les départements français.

      Rôle : niveau administratif supérieur qui regroupe les organisations d'un territoire.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique du département dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: name
        description: Nom du département.
      - name: number
        description: Numéro du département, par exemple 75 ou 93.
      - name: capital
        description: Préfecture du département.
      - name: region
        description: Région administrative du département.
      - name: email
        description: Email de contact départemental. Ici, la valeur est anonymisée.
      - name: phone_number
        description: Numéro de téléphone de contact départemental. Ici, la valeur est anonymisée.
      - name: parcours_enabled
        description: Indique si le module parcours est activé pour le département.
      - name: disable_ft_webhooks
        description: Indique si les webhooks France Travail sont désactivés pour le département.

  - name: stg_rdvi__follow_ups
    description: |
      Table centrale du métier.

      Regroupe les invitations et les RDV d'un usager pour une catégorie de motif donnée.
      Un usager a au plus un suivi par catégorie.

      Rôle : suit l'état d'avancement d'un usager dans son parcours, par exemple orientation ou
      accompagnement.

      Dans l'application, chaque suivi est un bloc de l'onglet Rendez-vous de la fiche usager.
      L'usager figure dans la liste des usagers d'une catégorie tant que son suivi n'est pas clôturé.

      Création :

      - Manuellement, par l'agent depuis l'onglet Rendez-vous.
      - À l'import, lorsqu'une catégorie est choisie, pour chaque usager enregistré.
        Un suivi clôturé est alors rouvert.
      - À l'invitation, depuis l'application ou l'API, si le suivi n'existe pas encore.
      - À la prise de RDV dans RDV-Solidarités sur un motif de la catégorie, si l'organisation
        a configuré cette catégorie.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique du suivi dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: user_id
        description: Usager suivi.
      - name: motif_category_id
        description: >
          Catégorie de motif du suivi, par exemple orientation RSA ou accompagnement RSA.
      - name: status
        description: |
          Statut déduit des invitations et des participations du suivi.
          Valeurs possibles :

          - not_invited : ni invitation ni RDV.
          - invitation_pending : invitation envoyée, sans RDV pris.
          - invitation_expired : toutes les invitations ont expiré sans prise de RDV.
          - rdv_pending : RDV à venir.
          - rdv_needs_status_update : RDV passé dont le statut reste à préciser.
          - rdv_seen : RDV honoré.
          - rdv_excused : RDV annulé par l'usager, excusé.
          - rdv_revoked : RDV annulé par le service.
          - rdv_noshow : absence non excusée.
          - closed : suivi clôturé par un agent, Dossier traité.

          Le statut reflète l'événement le plus récent : une invitation envoyée après un RDV
          repasse le suivi en invitation_pending.

          Les statuts invitation_expired, rdv_needs_status_update, rdv_excused, rdv_revoked et
          rdv_noshow demandent une action de l'agent et alimentent le filtre Intervention nécessaire.
      - name: closed_at
        description: Date de clôture du suivi.

  - name: stg_rdvi__invitations
    description: >
      Représente une invitation envoyée à un usager pour qu'il prenne rendez-vous.

      Rôle : trace les invitations SMS, email ou courrier avec leur lien de prise de RDV.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique de l'invitation dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: user_id
        description: Usager invité.
      - name: follow_up_id
        description: Suivi concerné par l'invitation.
      - name: department_id
        description: Identifiant du département de rattachement de l'invitation.
      - name: format
        description: "Format de l'invitation. Valeurs possibles : sms, email, postal."
      - name: link
        description: URL de prise de RDV sur RDV-Solidarités. Ici, la valeur est anonymisée.
      - name: rdv_solidarites_token
        description: Token d'authentification RDV-Solidarités. Ici, la valeur est anonymisée.
      - name: uuid
        description: Identifiant court utilisé dans l'URL publique.
      - name: expires_at
        description: Date d'expiration de l'invitation.
      - name: clicked
        description: Indique si l'usager a cliqué sur le lien.
      - name: delivery_status
        description: |
          Statut de délivrance renvoyé par Brevo.

          - Vide : statut pas encore reçu ou non récupérable (courrier, SMS envoyé par Primotexto).
          - delivered : message reçu par le serveur mail du destinataire ou par son téléphone.
          - soft_bounce : échec temporaire, par exemple boîte mail pleine.
          - hard_bounce : échec définitif, par exemple adresse ou numéro inexistant.
          - blocked : envoi bloqué par Brevo, par exemple destinataire sur liste de blocage (email uniquement).
          - invalid_email : adresse email invalide (email uniquement).
          - error : erreur de Brevo pendant l'envoi (email uniquement).

          Les statuts renseignés autres que delivered sont des échecs. L'agent voit
          Non délivrée et peut renvoyer une invitation le jour même.
      - name: sms_provider
        description: Fournisseur SMS utilisé pour les invitations SMS.
      - name: last_brevo_webhook_received_at
        description: >
          Date du dernier webhook Brevo reçu. Pour une invitation délivrée, correspond à la
          date de délivrance.
      - name: rdv_with_referents
        description: Indique si l'invitation concerne un RDV avec référent.
      - name: rdv_solidarites_lieu_id
        description: Lieu pré-sélectionné dans le lien de prise de RDV.
      - name: help_phone_number
        description: Numéro d'aide affiché à l'usager. Ici, la valeur est anonymisée.
      - name: created_at
        description: Date de création de l'invitation.
        tests:
          - not_null
      - name: origin
        description: |
          Endroit d'où l'invitation a été envoyée.

          Envois initiés par un agent :

          - users_index_page : liste des usagers d'une catégorie.
          - user_follow_ups_page : onglet Rendez-vous de la fiche usager.
          - user_list_upload : étape d'invitation d'un import de fichier ou bouton Inviter les non-invités.
          - api : API.

          Envoi automatique :

          - reminder : relance envoyée 3 jours après une invitation d'agent si l'usager n'a toujours pas pris RDV.

          Valeurs historiques, plus attribuées :

          - legacy_triggered_by_periodic_job : ancien CRON d'invitations périodiques, supprimé.
          - legacy_triggered_by_agent : envoi par un agent avant l'enregistrement de l'endroit de l'envoi.

  - name: stg_rdvi__invitations_organisations
    description: >
      Table de jonction simple.

      Lie une invitation aux organisations concernées.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: invitation_id
        description: Invitation concernée.
      - name: organisation_id
        description: Organisation concernée par l'invitation.

  - name: stg_rdvi__motif_categories
    description: >
      Représente les grandes catégories de RDV, par exemple orientation RSA ou accompagnement RSA.

      Rôle : classification des types de suivis.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique de la catégorie de motif dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: rdv_solidarites_motif_category_id
        description: ID de la catégorie de motif dans RDV-Solidarités.
      - name: name
        description: Nom complet de la catégorie de motif.
      - name: short_name
        description: Nom court unique de la catégorie de motif.
      - name: motif_category_type
        description: >
          Type de catégorie de motif. Valeurs possibles : rsa_orientation,
          rsa_accompagnement, siae, autre.
      - name: template_id
        description: Template de messages associé à la catégorie de motif.

  - name: stg_rdvi__organisations
    description: >
      Représente les structures qui suivent les usagers, comme les conseils départementaux,
      France Travail, les SIAE ou d'autres structures.

      Rôle : structure organisationnelle qui regroupe agents, usagers et configuration.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique de l'organisation dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: rdv_solidarites_organisation_id
        description: ID de l'organisation dans RDV-Solidarités.
      - name: name
        description: Nom de l'organisation.
      - name: department_id
        description: Département de rattachement.
      - name: organisation_type
        description: >
          Type de l'organisation. Valeurs possibles : conseil_departemental,
          delegataire_rsa, france_travail, siae, autre.
      - name: email
        description: Email de contact de l'organisation. Ici, la valeur est anonymisée.
      - name: phone_number
        description: Numéro de téléphone de contact de l'organisation. Ici, la valeur est anonymisée.
      - name: safir_code
        description: Code SAFIR pour France Travail. Ici, la valeur est anonymisée.
      - name: slug
        description: Identifiant court utilisé pour repérer l'organisation dans les fichiers d'import.
      - name: website
        description: Site web de l'organisation. Ici, la valeur est anonymisée.
      - name: archived_at
        description: Date d'archivage de l'organisation si elle est inactive.
      - name: data_retention_duration_in_months
        description: Durée de conservation des données, en mois, pour le RGPD.
      - name: display_in_stats
        description: Indique si l'organisation doit être incluse dans les statistiques.

  - name: stg_rdvi__participations
    description: >
      Table de jonction enrichie entre users et rdvs.

      Rôle : lie un usager à un RDV avec son statut de participation.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique de la participation dans rdv-insertion.
      - name: user_id
        description: Usager participant au RDV.
      - name: rdv_id
        description: Rendez-vous concerné.
      - name: follow_up_id
        description: Suivi associé à la participation.
      - name: status
        description: |
          Statut de l'usager pour ce RDV, avec les mêmes valeurs que rdvs.status.

          - unknown : statut pas encore renseigné, RDV à venir ou passé à préciser par l'agent.
          - seen : RDV honoré.
          - excused : RDV annulé par l'usager, qui a prévenu (excusé).
          - revoked : RDV annulé par le service.
          - noshow : absence non excusée.

          Dans un RDV collectif, chaque participant a son propre statut.
          C'est le statut de la participation qui fait évoluer le suivi.
      - name: rdv_solidarites_participation_id
        description: ID de la participation dans RDV-Solidarités.
      - name: convocable
        description: Indique s'il s'agit d'une convocation obligatoire.
      - name: created_by_type
        description: Type de créateur du RDV, par exemple Agent, User ou Prescripteur.
      - name: created_by_agent_prescripteur
        description: Indique si le RDV a été créé par un agent prescripteur.
      - name: france_travail_id
        description: ID France Travail de l'usager. Ici, la valeur est anonymisée.

  - name: stg_rdvi__rdvs
    description: >
      Représente un rendez-vous créé dans RDV-Solidarités.

      Rôle : synchronise les RDV depuis RDV-Solidarités pour le suivi local.

    config:
      tags:
        - rdv-insertion
    columns:
      - name: id
        description: Identifiant unique du rendez-vous dans rdv-insertion.
        tests:
          - not_null
          - unique
      - name: rdv_solidarites_rdv_id
        description: ID du RDV dans RDV-Solidarités.
      - name: starts_at
        description: Date et heure de début du RDV.
      - name: duration_in_min
        description: Durée du RDV en minutes.
      - name: organisation_id
        description: Organisation concernée par le RDV.
      - name: motif_id
        description: Motif du RDV.
      - name: lieu_id
        description: Lieu du RDV. Peut être vide si le RDV est à distance.
      - name: status
        description: |
          Statut du RDV, avec les mêmes valeurs que participations.status.

          - unknown : statut pas encore renseigné, RDV à venir ou passé à préciser par l'agent.
          - seen : RDV honoré.
          - excused : RDV annulé par l'usager, qui a prévenu (excusé).
          - revoked : RDV annulé par le service.
          - noshow : absence non excusée.
      - name: cancelled_at
        description: Date d'annulation du RDV.
      - name: created_at
        description: Date et heure de création du RDV dans rdv-insertion.
      - name: created_by
        description: Origine de création du RDV, par exemple agent, user ou prescripteur.
      - name: context
        description: Contexte ou notes du RDV. Ici, la valeur est anonymisée.
      - name: address
        description: Adresse du RDV. Ici, la valeur est anonymisée.
      - name: visio_url
        description: URL de visioconférence pour les RDV à distance. Ici, la valeur est anonymisée.
      - name: uuid
        description: Identifiant utilisé dans les URLs publiques.
      - name: time_zone
        description: Fuseau horaire du RDV.
      - name: users_count
        description: Nombre de participants au RDV.
      - name: max_participants_count
        description: Nombre maximum de participants pour les RDV collectifs.
