version: 2

models:
  - name: stg_dora__user
    config:
      tags:
        - dora
      indexes:
        - columns: [id]
          unique: true
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

      - name: department
        description : >
          Première valeur présente dans la colonne `departments`.

          Il est possible qu’un même utilisateur soit rattaché à plusieurs départements. Pour gérer cette complexité, on a le modèle
          `int_user_departments`, avec une ligne par couple utilisateur x département.


  - name: stg_dora__structure
    description: >
      Staging des structures DORA, au plus proche de la source.

      Avant, dans l'historique du repo DORA, ce staging retirait les structures obsolètes
      avec un filtre `where not is_obsolete`. On a enlevé ce filtre ici parce que le
      staging n'est pas le bon endroit pour cacher des lignes de la source. Ce filtre
      pouvait faire perdre des infos plus loin, par exemple dans les tables de services
      comme `dim_dora__services`, où les colonnes de structure pouvaient rester vides.

      Pour travailler volontairement sans les structures obsolètes, utilise plutôt
      `int_dora__structure_non_obsolete`.
    config:
      tags:
        - dora
      indexes:
        - columns: [id]
          unique: true
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: structure_id_jointure_di
        description: >
          ID de structure préfixé par "dora--", utilisé pour joindre les données Data Inclusion.


  - name: stg_dora__structure_member
    description: >
      Table de correspondance entre les utilisateurs et leurs structures de rattachement.
    config:
      tags:
        - dora

    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: structure_id
        data_tests:
          - not_null
      - name: user_id
        data_tests:
          - not_null
      - name: is_admin
        description: >
          L'utilisateur a tous les droits sur la structure.


  - name: stg_dora__orientation
    config:
      tags:
        - dora
      indexes:
        - columns: [id]
          unique: true
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: prescriber_id
        data_test:
          - unique

  - name: stg_dora__mobilisationevent
    description: >
      Staging des événements de mobilisation DORA. Il regroupe les événements sur des services
      DORA (`stats_mobilisationevent`) et sur des services Data Inclusion
      (`stats_dimobilisationevent`).
    config:
      tags:
        - dora
      indexes:
        - columns: [id]
          unique: true
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: structure_source
        description: >
          Espace de noms de `structure_id`. La valeur est `dora` pour les événements issus de
          `stats_mobilisationevent` et `data_inclusion` pour ceux issus de
          `stats_dimobilisationevent`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dora
                  - data_inclusion
      - name: structure_id
        description: >
          Identifiant de la structure qui porte le service mobilisé, dans le namespace indiqué par
          `structure_source`. Ce n'est pas la structure de rattachement de l'utilisateur qui réalise
          l'événement.
      - name: structure_id_di_source
        description: >
          Identifiant normalisé utilisé pour joindre le mapping Data Inclusion. Les événements DORA
          sont préfixés par `dora--`; les événements Data Inclusion conservent leur identifiant source.



  - name: stg_dora__service
    config:
      tags:
        - dora
      indexes:
        - columns: [id]
          unique: true
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: service_id_jointure_di
        description: >
          ID de service préfixé par "dora--", utilisé pour joindre les données Data Inclusion.


  - name: stg_dora__emplois_orientation_data
    config:
      tags:
        - dora
    description: >
      Données Les Emplois associées aux orientations DORA créées via l'API Les Emplois
      ou depuis un JWT Emplois. La colonne orientation_id pointe vers `stg_dora__orientation.id`,
      tandis que les autres identifiants font référence aux tables Les Emplois.
    columns:
      - name: orientation_id
        description: >
          Identifiant de l'orientation associée, clé primaire de la table `orientations_orientation`.
          Il n'a pas de correspondance côté Les Emplois.
        data_tests:
          - unique
          - not_null
      - name: emplois_sync_uid
        description: >
          UID de synchronisation avec Les Emplois. Il correspond à `les-emplois.insertion_orientation.id`.
          Il n'y a pas encore d'export des orientations Les Emplois sur Pilotage.
        data_tests:
          - unique
          - not_null
      - name: beneficiary_id
        description: >
          UID du bénéficiaire. Il correspond à `les-emplois.users_user.public_id` et à
          `pilotage.candidats_v0.uid`.
      - name: structure_id
        description: >
          UID de la structure côté Les Emplois : organisation prescriptrice ou entreprise. Pour une
          organisation prescriptrice, il correspond à `les-emplois.prescribers_prescriberorganization.uid`
          et à `pilotage.organisations_v0.uid`. Pour une entreprise, il correspond à
          `les-emplois.companies_company.uid` et à `pilotage.structures_v0.uid`.
      - name: structure_name
        description: >
          Nom de la structure côté Les Emplois : organisation prescriptrice ou entreprise. Pour une
          organisation prescriptrice, il correspond à `les-emplois.prescribers_prescriberorganization.brand`
          ou `les-emplois.prescribers_prescriberorganization.name`, et à `pilotage.organisations_v0.nom`.
          Pour une entreprise, il correspond à `les-emplois.companies_company.brand` ou
          `les-emplois.companies_company.name`, et à `pilotage.structures_v0.nom`.
      - name: structure_siret
        description: >
          SIRET de la structure côté Les Emplois : organisation prescriptrice ou entreprise. Pour une
          organisation prescriptrice, il correspond à `les-emplois.prescribers_prescriberorganization.siret`
          et à `pilotage.organisations_v0.siret`. Pour une entreprise, il correspond à
          `les-emplois.companies_company.siret` et à `pilotage.structures_v0.siret`.
      - name: prescriber_id
        description: >
          UID du professionnel, prescripteur ou employeur, côté Les Emplois. Il est vide si l'orientation a
          été réalisée par JWT, méthode qui n'est plus utilisée depuis début juillet 2026. Il correspond à
          `les-emplois.users_user.public_id` et à `pilotage.candidats_v0.uid`.
      - name: prescriber_email
        description: Email du prescripteur transmis par Les Emplois.
      - name: prescriber_first_name
        description: Prénom du prescripteur transmis par Les Emplois.
      - name: prescriber_last_name
        description: Nom du prescripteur transmis par Les Emplois.
      - name: prescriber_phone
        description: Téléphone du prescripteur transmis par Les Emplois.
