version: 2

models:
  - name: int_monrecap__actes_metier
    description: >
      Compte les actes métier Mon Récap par mois. Le modèle reprend la logique du fetcher Python.
      Il transforme les carnets expédiés en actes de distribution et de remplissage.

      **ATTENTION : ce modèle réplique directement la logique qui existait sur Autometa pour le tableau de bord des actes métier.
      Il est possible que cette modélisation soit revue. Si tu es en train de t'en servir pour quelque chose, vérifie d'abord
      avec l'équipe data.**
    config:
      tags:
        - actes-metier
    columns:
      - name: mois
        description: >
          Mois de l'acte, au format `YYYY-MM`. Le modèle garde les 14 derniers mois complets.
        tests:
          - not_null
      - name: source
        description: Toujours `monrecap`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - monrecap
      - name: type_acte
        description: Type d'acte Mon Récap.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Distribution carnet Mon Récap
                  - Remplissage carnet Mon Récap
      - name: categorie_acte
        description: >
          `Accompagnement` pour la distribution. `Support` pour le remplissage.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Accompagnement
                  - Support
      - name: north_star
        description: Toujours `false` pour ces actes.
        tests:
          - not_null
      - name: north_star_70
        description: Toujours `false` pour ces actes.
        tests:
          - not_null
      - name: traite
        description: Toujours `false` pour ces actes.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure normalisé depuis le type de structure de la commande.
          Vaut `Autre` si le type n'est pas reconnu.
        tests:
          - not_null
      - name: departement
        description: Code département normalisé. Vaut `Inconnu` si le département est vide ou non reconnu.
        tests:
          - not_null
      - name: nombre_actes
        description: Nombre d'actes pour ce grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement
  - name: int_monrecap__tous_les_pros
    description: |
      Tous les contacts professionnels Mon Récap, commandeurs et non commandeurs, avec leur
      structure de rattachement.

      Reprend la logique de la question Metabase historique sur `monrecap.Contacts`, mais
      construite directement à partir des deux staging qui alimentent cette table
      (`stg_contacts_commandeurs` et `stg_contacts_non_commandeurs`) plutôt que du mart
      `Contacts`. Les lignes dont le département (`Code dpt`) contient une valeur aberrante
      (`To`, `LI`, `li`, `Do`, `Ch`, `AN`, `[N`) sont exclues, sauf quand il est vide.

      Les colonnes sont alignées sur `int_dora__tous_les_pros` et `int_emplois__tous_les_pros`
      pour pouvoir empiler les trois sources, à l'exception de `admin`, qui n'a pas
      d'équivalent côté Mon Récap et n'est donc pas repris ici.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: Adresse e-mail du contact, utilisée comme identifiant.
        tests:
          - not_null
      - name: source
        description: Source des données, toujours `MonRécap`.
      - name: date_derniere_connexion
        description: >
          `Date de dernière commande` du contact. Mon Récap ne porte pas de vraie date de
          connexion, celle-ci est une approximation par l'activité de commande.
      - name: prenom
        description: >
          Vaut `Contact`. Mon Récap ne distingue pas prénom et nom : les deux colonnes portent
          la même valeur, non découpée.
      - name: nom
        description: Vaut `Contact`, comme `prenom` — voir sa description.
      - name: type_utilisateur
        description: >
          Vaut `Type de contact` du contact (ex. commandeur, non commandeur), brut, sans
          normalisation.
      - name: date_inscription
        description: Vaut `Date de première commande` du contact.
      - name: email
        description: Adresse e-mail du contact (`EMAIL`), identique à `id`.
      - name: type_utilisateur_detail
        description: Toujours `NA`, Mon Récap n'a pas de détail de type d'utilisateur.
      - name: nom_structure
        description: Nom de la structure du contact (`STRUCTURE`).
      - name: type_structure
        description: Type de structure du contact (`Type de Structure`).
      - name: departement_structure
        description: >
          Département du contact (`Code dpt`). Les valeurs aberrantes historiques (`To`, `LI`,
          `li`, `Do`, `Ch`, `AN`, `[N`) sont exclues du modèle plutôt que nettoyées — voir la
          description du modèle.
