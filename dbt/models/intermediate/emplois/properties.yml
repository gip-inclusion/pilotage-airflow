version: 2

models:
  - name: int_emplois__candidats_geographie
    config:
      tags:
        - emplois
    description: >-
      Une ligne par candidat, avec son code commune et le département retenu pour les analyses.
      Ce modèle existe parce que le département qui arrive du staging n'est pas toujours le même que celui
      qu'on retrouve avec le code commune dans dim_commune. Sans règle commune, on pourrait donc classer
      un même candidat dans deux départements différents selon la table utilisée.
      On décide ici, une seule fois, quel département garder : celui de dim_commune en priorité.
      Si on ne peut pas le retrouver, on garde celui du staging pour ne pas perdre l'information.
      Le mart reprend ensuite ce département déjà choisi, sans refaire le choix de son côté.
      On garde aussi les deux valeurs d'origine et on indique laquelle a été retenue pour comprendre
      les écarts. Ces informations de suivi restent dans l'intermédiaire.
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_emplois__candidats')
    columns:
      - name: id_candidat
        description: Identifiant du candidat sur Les Emplois de l'inclusion.
        tests:
          - not_null
          - unique
      - name: code_commune_insee
        description: Code INSEE de la commune du candidat, conservé tel qu'il arrive du staging.
      - name: departement_source
        description: Code du département renseigné dans la source, conservé tel quel pour comprendre les écarts.
      - name: departement_commune
        description: >-
          Code du département trouvé dans dim_commune à partir du code commune du candidat.
          Peut être absent si la commune n'est pas renseignée, n'est pas reconnue ou n'a pas de département.
      - name: departement
        description: >-
          Code du département retenu : celui de dim_commune en priorité, sinon celui de la source.
          On enlève les espaces en début et en fin de valeur ; les textes vides sont considérés comme absents.
          Vaut NULL si aucun département n'est disponible. Les zéros initiaux et les lettres sont conservés.
      - name: origine_departement
        description: >-
          Indique d'où vient le département retenu : dim_commune quand le référentiel fournit le département,
          staging quand on utilise celui de la source, non_renseigne si aucun département n'est disponible.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dim_commune', 'staging', 'non_renseigne']

  - name: int_emplois__actes_metier
    description: >
      Compte les actes métier Emplois par mois : candidatures, créations et mises à jour d'offres d'emploi,
      créations d'employeurs solidaires et diagnostics IAE.
    config:
      tags:
        - actes-metier
    columns:
      - name: mois
        description: >
          Mois de l'acte, au format `YYYY-MM`. Le modèle garde les 14 derniers mois complets.
        tests:
          - not_null
      - name: source
        description: >
          Toujours `emplois`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - emplois
      - name: type_acte
        description: >
          Nom de l'acte : candidature, création ou mise à jour d'offre d'emploi, création d'employeur solidaire
          ou diagnostic IAE.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Candidature auprès d’un employeur solidaire
                  - Création offre d’emploi
                  - Mise à jour offre d’emploi
                  - Création employeur solidaire
                  - Diagnostic IAE
      - name: categorie_acte
        description: >
          Catégorie de l'acte. Les candidatures et diagnostics sont dans `Accompagnement`; les autres actes
          sont dans `Support`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Accompagnement
                  - Support
      - name: north_star
        description: >
          Vaut `true` pour une candidature traitée en moins de 30 jours et pour les créations ou mises à jour
          d'offres d'emploi. Vaut `false` sinon.
        tests:
          - not_null
      - name: north_star_70
        description: >
          Variante de `north_star` à 70 jours pour les candidatures. Pour les autres actes, même valeur que
          `north_star`.
        tests:
          - not_null
      - name: traite
        description: >
          Vaut `true` pour une candidature sortie des statuts de nouvelle candidature, attente ou étude. Pour les
          créations et mises à jour d'offres d'emploi, vaut `true`; pour les autres actes, vaut `false`.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure normalisé depuis le type de prescripteur, d'employeur ou d'auteur du diagnostic.
          Vaut `Autre` si le type n'est pas reconnu.
        tests:
          - not_null
      - name: departement
        description: >
          Code département normalisé. Vaut `Inconnu` si le département est vide ou non reconnu.
        tests:
          - not_null
      - name: nombre_actes
        description: >
          Nombre d'actes pour ce grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement

  - name: int_emplois__tous_les_pros
    description: |
      Tous les professionnels des Emplois de l'Inclusion avec leur structure, organisation ou
      institution de rattachement.

      Une ligne par rattachement, comme le modèle `utilisateurs` : un utilisateur rattaché à
      plusieurs organisations apparaît plusieurs fois. Les colonnes sont alignées sur
      `int_dora__tous_les_pros` pour pouvoir empiler les deux sources.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: >
            Identifiant de l'utilisateur des Emplois.
            C'est la foire aux doublons parce qu'un utilisateur peut etre rattaché a différentes structures, mais on veut garder ces infos.
        tests:
          - not_null
      - name: source
        description: Source des données, toujours Les emplois.
      - name: date_derniere_connexion
        description: Dernière connexion de l'utilisateur (`utilisateurs_v0.dernière_connexion`).
      - name: prenom
        description: Prénom de l'utilisateur. Peut être vide, pas de valeur de repli.
      - name: nom
        description: Nom de l'utilisateur. Peut être vide, pas de valeur de repli.
      - name: type_utilisateur
        description: >
          Type de l'utilisateur. Valeurs possibles : employer, prescriber, labor_inspector.
      - name: date_inscription
        description: Date d'inscription de l'utilisateur.
      - name: email
        description: Adresse e-mail de l'utilisateur.
      - name: admin
        description: >
          Administrateur de la structure/organisation/institution
      - name: type_utilisateur_detail
        description: >
          Employeur pour un employeur, Institution pour un inspecteur du travail. Pour un
          prescripteur, l'habilitation de son organisation (Prescripteur habilité ou Orienteur)
        tests:
          - not_null
      - name: departement_structure
        description: >
          Département de l'organisation, à défaut de la structure employeuse, à défaut de
          l'institution de rattachement. Peut être vide si l'utilisateur n'a aucun rattachement,
          ou si le département de celui-ci est vide.
      - name: type_structure
        description: >
          Type de l'organisation, à défaut de la structure employeuse, à défaut de l'institution
          de rattachement.
      - name: nom_structure
        description: >
          Nom de l'organisation, à défaut de la structure employeuse, à défaut de l'institution
          de rattachement.

  - name: int_emplois__pass_iae_suspensions
    config:
      tags:
        - emplois
    description: >
      Pour chaque PASS IAE qui a au moins une suspension, on résume les principales
      étapes de ses suspensions sur une seule ligne.
    columns:
      - name: id_pass_iae
        description: Identifiant du PASS IAE ou de l’ancien agrément.
        tests:
          - not_null
          - unique
      - name: nombre_suspensions
        description: Nombre total de suspensions du titre, terminées ou en cours.
        tests:
          - not_null
      - name: date_premiere_suspension
        description: Première date de début de suspension, sans filtre sur son état.
      - name: date_derniere_suspension
        description: Dernière date de début de suspension, sans filtre sur son état.
      - name: date_de_fin_derniere_suspension
        description: >
          Date de fin de la dernière suspension, choisie par date de début puis par identifiant décroissant.
          Les dates de début NULL passent en dernier. On garde la date de fin de la source,
          même si la suspension est en cours. Si cette date est NULL, elle reste NULL.
      - name: is_suspension_en_cours
        description: >
          Vaut true si au moins une suspension a en_cours = true dans la source.
          On ne regarde pas les dates. Si tous les indicateurs sont NULL, le résultat reste NULL.
        data_type: boolean
  - name: int_emplois__pass_iae_prolongations
    config:
      tags:
        - emplois
    description: Une ligne par identifiant de PASS présent dans les prolongations accordées. Une prolongation peut
      exister sans demande ; elle est toujours comptée.
    columns:
      - name: id_pass_iae
        description: Identifiant du PASS IAE ou de l’ancien agrément.
        tests:
          - not_null
          - unique
      - name: nombre_prolongations
        description: Nombre de prolongations accordées dans prolongations, avec ou sans demande liée. Les demandes
          acceptées ne sont pas ajoutées à ce nombre.
        tests:
          - not_null
      - name: date_premiere_prolongation
        description: Première date de création d’une prolongation accordée.
      - name: date_derniere_prolongation
        description: Dernière date de création d’une prolongation accordée.
      - name: date_debut_derniere_prolongation
        description: Début de la dernière prolongation accordée, choisie par date de création puis par identifiant
          décroissant. Les dates NULL passent en dernier.
      - name: date_fin_derniere_prolongation
        description: Fin de cette même dernière prolongation, conservée telle quelle depuis la source.
  - name: int_emplois__pass_iae_demandes_prolongation
    config:
      tags:
        - emplois
    description: Une ligne par identifiant de PASS présent dans les demandes. Une demande acceptée reste une demande
      et n’ajoute rien au nombre de prolongations.
    columns:
      - name: id_pass_iae
        description: Identifiant du PASS IAE ou de l’ancien agrément.
        tests:
          - not_null
          - unique
      - name: nombre_demandes_prolongation
        description: Nombre total de demandes, indépendamment des prolongations accordées.
        tests:
          - not_null
      - name: nombre_demandes_acceptees
        description: Nombre de demandes dans l’état Acceptée, même sans prolongation associée.
        tests:
          - not_null
      - name: nombre_demandes_refusees
        description: Nombre de demandes dans l’état Refusée.
        tests:
          - not_null
      - name: nombre_demandes_en_attente
        description: Nombre de demandes dans l’état À traiter.
        tests:
          - not_null
      - name: date_premiere_demande_prolongation
        description: Première date de demande de prolongation.
      - name: date_derniere_demande_prolongation
        description: Dernière date de demande de prolongation.
      - name: date_dernier_traitement_demande
        description: Dernier horodatage de traitement, toutes demandes du titre confondues. Peut concerner une demande
          plus ancienne.
      - name: etat_derniere_demande_prolongation
        description: État de la dernière demande, choisie par date de demande puis par identifiant décroissant. Les
          dates NULL passent en dernier.

  - name: int_emplois__orientations_enriched
    description: >-
      On part des orientations enregistrées dans les Emplois pour les enrichir avec les informations
      utiles à leur analyse. Les identifiants de l'entreprise et de l'organisation prescriptrice restent
      séparés pour savoir à quel type d'établissement on se réfère.

      Pour décrire le service, on utilise le catalogue Emplois car il garde aussi les services devenus
      inactifs, dont on a toujours besoin pour comprendre les orientations passées. Si une référence
      manque, on conserve quand même l'orientation pour ne pas la perdre dans les comptages.
      Les correspondances Data Inclusion permettent de retrouver les structures dans le référentiel
      commun aux différentes sources.

      Ce modèle enrichit uniquement le flux Emplois. C'est le mart qui le réunit avec les orientations
      DORA et qui ajoute les colonnes absentes de chaque flux pour les présenter dans une même table.
      Le bénéficiaire est identifié par son UUID public Emplois, également disponible pour les anciennes
      orientations DORA réalisées via le JWT Emplois.
    config:
      tags:
        - dora
    columns:
      - name: id
        description: UUID du staging converti en texte pour partager une même colonne d'identifiant avec DORA dans le mart.
        tests:
          - unique
          - not_null
      - name: origin_source
        description: Colonne ajoutée avec la valeur emplois pour distinguer ce flux de DORA dans le mart.
        tests:
          - accepted_values:
              arguments:
                values:
                  - emplois
      - name: duration_weekly_hours
        description: Volume horaire hebdomadaire ajouté depuis stg_emplois__services, via service_uid = uid.
      - name: duration_weeks
        description: Nombre de semaines ajouté depuis stg_emplois__services, via service_uid = uid.
      - name: prescriber_structure_id_di
        description: >-
          Identifiant canonique DI ajouté via int_di__structure_source_mapping.source_structure_id.
          La clé cherchée est emplois-de-linclusion-- suivi de sender_prescriber_organization_uid pour
          un emplois_prescriber, ou de sender_company_uid pour un emplois_employer.
      - name: prescriber_nom_etablissement
        description: >-
          Nom ajouté depuis stg_organisations.nom pour un emplois_prescriber
          (sender_prescriber_organization_id = id), ou stg_structures.nom pour un emplois_employer
          (sender_company_id = id).
      - name: prescriber_structure_siret
        description: >-
          SIRET ajouté par les mêmes jointures que le nom : stg_organisations.siret_org_prescripteur
          pour un emplois_prescriber, stg_structures.siret pour un emplois_employer.
      - name: oriented_service_name
        description: Nom ajouté depuis stg_emplois__services.name, via service_uid = uid, y compris pour un service inactif.
      - name: oriented_service_structure_name
        description: >-
          Nom ajouté depuis dim_data_inclusion__structures.nom. On relie structure_uid à
          int_di__structure_source_mapping.source_structure_id, puis son structure_id à celui de la dimension.
          Reste NULL si la correspondance manque.
      - name: oriented_service_code_commune_insee
        description: Code commune ajouté depuis stg_emplois__services.code_insee, via service_uid = uid.
  - name: int_emplois__structures
    description: >
      Structures inscrites sur les Emplois de l'Inclusion complétées avec les données de l'ASP.
      Pour les structures de source Export ASP (=structures mères), le nom ASP,
      le SIRET, le code NAF et la commune proviennent du flux ASP (jointure sur
      `id_strct_mere = structure_id_siae`), sinon des Emplois. Si la valeur ASP est nulle
      (structure absente du flux ASP ou champ non renseigné), on reprend celle des Emplois.
    config:
      tags:
        - emplois
    columns:
      - name: uid
        description: Identifiant unique universel (UUID) de la structure dans les Emplois.
        tests:
          - not_null
          - unique
      - name: id
        description: Identifiant de la structure dans les Emplois.
        tests:
          - not_null
          - unique
      - name: id_strct_mere
        description: >
          Identifiant ASP de la structure mère, issu de `id_asp` dans `stg_emplois__structures`.
          Renseigné pour les structures de source Export ASP, qui sont elles-mêmes des structures
          mères, et pour la plupart des antennes, qui portent l'identifiant de leur structure mère.
      - name: nom_emplois
        description: Nom de la structure saisi sur les Emplois.
      - name: type
        description: Type de structure employeuse, par exemple ACI, EI, AI, ETTI, EITI, GEIQ, EA ou OPCS.
      - name: date_inscription_emplois
        description: Date d'inscription de la structure sur les Emplois de l'Inclusion.
      - name: active
        description: Entier 0/1 indiquant si la structure est active sur la plateforme.
      - name: source
        description: >
          Origine de la création de la structure. Valeurs possibles : Export ASP, Export GEIQ,
          Utilisateur (Antenne), Staff Itou.
      - name: nom_asp
        description: Dénomination de la structure à l'ASP. Renseignée uniquement pour les structures de source Export ASP.
      - name: siret
        description: >
          Numéro SIRET de la structure : SIRET actualisé de l'ASP pour les structures de source
          Export ASP, SIRET des Emplois sinon ou si le SIRET ASP est nul.
      - name: code_naf
        description: >
          Code NAF de la structure : code NAF de l'ASP pour les structures de source Export ASP,
          code NAF des Emplois sinon ou si le code NAF ASP est nul.
      - name: code_commune
        description: >
          Code INSEE de la commune de la structure : commune de l'adresse administrative ASP pour
          les structures de source Export ASP, commune de l'adresse C1 des Emplois sinon ou si
          la commune ASP est nulle.
