version: 2

models:
  - name: int_emplois__actes_metier
    description: >
      Compte les actes métier Emplois par mois : candidatures, créations et mises à jour d'offres d'emploi,
      créations d'employeurs solidaires et diagnostics IAE.
    config:
      tags:
        - actes-metier
    columns:
      - name: mois
        description: >
          Mois de l'acte, au format `YYYY-MM`. Le modèle garde les 14 derniers mois complets.
        tests:
          - not_null
      - name: source
        description: >
          Toujours `emplois`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - emplois
      - name: type_acte
        description: >
          Nom de l'acte : candidature, création ou mise à jour d'offre d'emploi, création d'employeur solidaire
          ou diagnostic IAE.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Candidature auprès d’un employeur solidaire
                  - Création offre d’emploi
                  - Mise à jour offre d’emploi
                  - Création employeur solidaire
                  - Diagnostic IAE
      - name: categorie_acte
        description: >
          Catégorie de l'acte. Les candidatures et diagnostics sont dans `Accompagnement`; les autres actes
          sont dans `Support`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Accompagnement
                  - Support
      - name: north_star
        description: >
          Vaut `true` pour une candidature traitée en moins de 30 jours et pour les créations ou mises à jour
          d'offres d'emploi. Vaut `false` sinon.
        tests:
          - not_null
      - name: north_star_70
        description: >
          Variante de `north_star` à 70 jours pour les candidatures. Pour les autres actes, même valeur que
          `north_star`.
        tests:
          - not_null
      - name: traite
        description: >
          Vaut `true` pour une candidature sortie des statuts de nouvelle candidature, attente ou étude. Pour les
          créations et mises à jour d'offres d'emploi, vaut `true`; pour les autres actes, vaut `false`.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure normalisé depuis le type de prescripteur, d'employeur ou d'auteur du diagnostic.
          Vaut `Autre` si le type n'est pas reconnu.
        tests:
          - not_null
      - name: departement
        description: >
          Code département normalisé. Vaut `Inconnu` si le département est vide ou non reconnu.
        tests:
          - not_null
      - name: nombre_actes
        description: >
          Nombre d'actes pour ce grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement

  - name: int_emplois__tous_les_pros
    description: |
      Tous les professionnels des Emplois de l'Inclusion avec leur structure, organisation ou
      institution de rattachement.

      Une ligne par rattachement, comme le modèle `utilisateurs` : un utilisateur rattaché à
      plusieurs organisations apparaît plusieurs fois. Les colonnes sont alignées sur
      `int_dora__tous_les_pros` pour pouvoir empiler les deux sources.
    config:
      tags:
        - pro_pdi
    columns:
      - name: id
        description: >
            Identifiant de l'utilisateur des Emplois.
            C'est la foire aux doublons parce qu'un utilisateur peut etre rattaché a différentes structures, mais on veut garder ces infos.
        tests:
          - not_null
      - name: source
        description: Source des données, toujours Les emplois.
      - name: date_derniere_connexion
        description: Dernière connexion de l'utilisateur (`utilisateurs_v0.dernière_connexion`).
      - name: prenom
        description: Prénom de l'utilisateur. Peut être vide, pas de valeur de repli.
      - name: nom
        description: Nom de l'utilisateur. Peut être vide, pas de valeur de repli.
      - name: type_utilisateur
        description: >
          Type de l'utilisateur. Valeurs possibles : employer, prescriber, labor_inspector.
      - name: date_inscription
        description: Date d'inscription de l'utilisateur.
      - name: email
        description: Adresse e-mail de l'utilisateur.
      - name: admin
        description: >
          Administrateur de la structure/organisation/institution
      - name: type_utilisateur_detail
        description: >
          Employeur pour un employeur, Institution pour un inspecteur du travail. Pour un
          prescripteur, l'habilitation de son organisation (Prescripteur habilité ou Orienteur)
        tests:
          - not_null
      - name: departement_structure
        description: >
          Département de l'organisation, à défaut de la structure employeuse, à défaut de
          l'institution de rattachement. Peut être vide si l'utilisateur n'a aucun rattachement,
          ou si le département de celui-ci est vide.
      - name: type_structure
        description: >
          Type de l'organisation, à défaut de la structure employeuse, à défaut de l'institution
          de rattachement.
      - name: nom_structure
        description: >
          Nom de l'organisation, à défaut de la structure employeuse, à défaut de l'institution
          de rattachement.

  - name: int_emplois__structures
    description: >
      Structures inscrites sur les Emplois de l'Inclusion complétées avec les données de l'ASP.
      Pour les structures de source Export ASP (=structures mères), le nom ASP,
      le SIRET, le code NAF et la commune proviennent du flux ASP (jointure sur
      `id_strct_mere = structure_id_siae`), sinon des Emplois.
    config:
      tags:
        - emplois
    columns:
      - name: uid
        description: Identifiant unique universel (UUID) de la structure dans les Emplois.
        tests:
          - not_null
          - unique
      - name: id
        description: Identifiant de la structure dans les Emplois.
        tests:
          - not_null
          - unique
      - name: id_strct_mere
        description: >
          Identifiant ASP de la structure mère, issu de `id_asp` dans `stg_emplois__structures`.
          Renseigné pour les structures de source Export ASP, qui sont elles-mêmes des structures
          mères, et pour la plupart des antennes, qui portent l'identifiant de leur structure mère.
      - name: nom_emplois
        description: Nom de la structure saisi sur les Emplois.
      - name: type
        description: Type de structure employeuse, par exemple ACI, EI, AI, ETTI, EITI, GEIQ, EA ou OPCS.
      - name: date_inscription_emplois
        description: Date d'inscription de la structure sur les Emplois de l'Inclusion.
      - name: active
        description: Entier 0/1 indiquant si la structure est active sur la plateforme.
      - name: source
        description: >
          Origine de la création de la structure. Valeurs possibles : Export ASP, Export GEIQ,
          Utilisateur (Antenne), Staff Itou.
      - name: nom_asp
        description: Dénomination de la structure à l'ASP. Renseignée uniquement pour les structures de source Export ASP.
      - name: siret
        description: >
          Numéro SIRET de la structure : SIRET actualisé de l'ASP pour les structures de source
          Export ASP, SIRET des Emplois sinon.
      - name: code_naf
        description: >
          Code NAF de la structure : code NAF de l'ASP pour les structures de source Export ASP,
          code NAF des Emplois sinon.
      - name: code_commune
        description: >
          Code INSEE de la commune de la structure : commune de l'adresse administrative ASP pour
          les structures de source Export ASP, commune de l'adresse C1 des Emplois sinon.
