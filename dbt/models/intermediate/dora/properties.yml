version: 2

models:
  - name: int_dora__imer
    description: >
      Intentions de mise en relation DORA conservées pour alimenter `fct_dora__imer`.
      Avant, ce modèle comptait deux types d'événements comme des IMER : les
      orientations et les mobilisations. Ce n'est plus le cas, car une orientation
      DORA génère aussi une mobilisation et créait du double comptage.
      Maintenant, une IMER DORA correspond à une mobilisation ou à une vue des
      informations de contact d'une structure (`structure_contact`). Les
      orientations restent disponibles dans `fct_dora__orientations`.
      La colonne `is_logged` reprend le statut de connexion enregistré sur
      l'événement source. C'est le critère métier utilisé pour distinguer les
      IMER connectées et non connectées ; il est indépendant de la présence d'un
      `user_id`.
    config:
      tags:
        - dora
    columns:
      - name: event_id
        description: Identifiant de la mise en relation côté DORA.
        tests:
          - unique
          - not_null
      - name: is_logged
        description: >
          Indique si l'événement a été réalisé par un utilisateur
          connecté.
        tests:
          - not_null
      - name: kind
        description: >
          Type d'IMER DORA. Les mobilisations correspondent à une consultation
          de service ; `structure_contact` correspond à une visualisation des
          informations de contact d'une structure. On a enlevé les `orientations`
          pour éviter le double comptage.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mobilisation
                  - structure_contact
      - name: orientation_id
        description: |
          Identifiant de l'orientation liée à l'IMER, quand il y en a une.

          C'est l'identifiant de la première orientation retrouvée après la mobilisation.
          Cette orientation vient de `int_dora__mobilisation_to_orientation`. On la retrouve
          avec la règle métier déjà utilisée dans ce modèle : même utilisateur, même service
          via le slug, et une orientation créée dans l'heure qui suit la mobilisation.
          Une même orientation peut apparaître sur plusieurs lignes d'IMER si plusieurs
          mobilisations lui sont rattachées.
      - name: origin_source
        description: >
          Origine de l'IMER DORA. Vaut `dora` pour les IMER issues de DORA, y
          compris les vues de contact structure, et `dora-data-inclusion` pour
          les mobilisations de services Data Inclusion depuis DORA.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dora
                  - dora-data-inclusion
      - name: target_structure_source_id
        description: >
          Identifiant de la structure ciblée avec son espace de noms. Les IDs DORA sont préfixés par
          `dora--`; les IDs Data Inclusion conservent leur valeur source.
      - name: target_di_structure_id
        description: >
          Identifiant canonique Data Inclusion de la structure ciblée. Il reste vide si aucun mapping
          n'est trouvé.
      - name: mobilized_service_id
        description: >
          Identifiant Data Inclusion du service mobilisé, déjà validé contre
          `dim_data_inclusion__services`. Pour un événement DORA, il est reconstruit depuis le
          slug présent dans `stg_dora__mobilisationevent.path`, puis traduit via
          `dim_dora__services.service_id_jointure_di`.
          Pour un événement Data Inclusion mobilisé depuis DORA, il est reconstruit depuis
          `stg_dora__mobilisationevent.path` après suppression du préfixe `di--`.
          Si le service reconstruit n'existe pas dans `dim_data_inclusion__services`,
          la colonne reste vide. Pour les IMER `structure_contact`, cette colonne
          reste vide car aucun service n'est mobilisé.
  - name: int_dora__active_user
    description: |
      Utilisateurs DORA actifs, valides et non staff.

      Ce modèle remplace l'ancien usage de `stg_dora__user` quand on veut vraiment
      exclure les utilisateurs inactifs, invalides ou staff. Avant, le filtre était
      dans le staging. Maintenant le staging garde toute la source, et c'est ici
      qu'on filtre.

      Utilise ce modèle pour conserver le comportement historique des jointures
      d'enrichissement utilisateur.
    config:
      tags:
        - dora
      indexes:
        - columns: [id]
          unique: true
    columns:
      - name: id
        tests:
          - unique
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_active is true and is_valid is true and is_staff is false"
  - name: int_dora__actes_metier
    description: >
      Ce modele compte, par mois, les actes metier DORA reconstruits depuis les requetes historiques du fetcher Python
      des actes metier sur Autometa : orientations, intentions d'orientation iMER, recherches, creations et mises a jour
      de services et de structures. Les orientations et les iMER proviennent des facts DORA consolidées. Les iMER sont
      limitées aux profils professionnels DORA, Data Inclusion et Les Emplois retenus pour les actes métier. Tous ces
      événements restent rattachés au produit `dora` dans le référentiel des actes métier.

      **ATTENTION : ce modele replique volontairement le fetcher Python au plus proche. Certaines tables sont donc
      appelees directement via `source('dora', ...)` plutot que via les modeles staging/intermediate dbt, notamment
      `services_service`, `structures_structure`, `stats_searchview`, `users_user` et `structures_structuremember`.
      Cette dette est intentionnelle pour la premiere reprise dbt des actes metier, mais elle devra etre revisitée.**
    config:
      tags:
        - actes-metier
    columns:
      - name: mois
        description: >
          Mois de réalisation de l'acte métier DORA, au format `YYYY-MM`. Le modèle ne conserve que les actes des
          14 derniers mois complets.
        tests:
          - not_null
      - name: source
        description: >
          Produit auquel l'acte métier est rattaché. Pour ce modèle, la valeur est toujours `dora`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dora
      - name: type_acte
        description: >
          Type d'acte métier DORA reconstruit depuis les tables sources : orientation vers un service, intention
          d'orientation iMER, recherche d'offre de service, création ou mise à jour d'offre de service, création ou
          mise à jour de structure.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Orientation vers service
                  - Intention d’orientation
                  - Mise à jour offre de service, hors emploi solidaire
                  - Création ou diffusion offre de service, hors emploi solidaire
                  - Création structure, hors employeur solidaire
                  - Mise à jour d’une structure d’offre de service, hors employeur solidaire
                  - Recherche d’offre de service, hors emploi solidaire
      - name: categorie_acte
        description: >
          Catégorie métier de l'acte dans le référentiel des actes métier PDI. Les orientations vers service sont
          classées en `Accompagnement`; les intentions d'orientation, recherches, créations et mises à jour sont
          classées en `Support`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Accompagnement
                  - Support
      - name: north_star
        description: >
          Indique si l'acte est comptabilisé dans la déclinaison North Star du référentiel des actes métier PDI.
          Pour DORA, seules les orientations vers service avec un statut `VALIDÉE` ou `REFUSÉE` sont marquées à
          `true`; tous les autres types d'actes sont à `false`.
        tests:
          - not_null
      - name: north_star_70
        description: >
          Variante héritée du modèle commun des actes métier. Pour DORA, elle reprend la même valeur que
          `north_star` sur les orientations vers service traitées (`VALIDÉE` ou `REFUSÉE`) et vaut `false` pour les
          autres actes.
        tests:
          - not_null
      - name: traite
        description: >
          Indique si l'acte a été traité au sens du référentiel commun. Pour DORA, seules les orientations vers
          service dont le statut est `VALIDÉE` ou `REFUSÉE` sont considérées comme traitées; les autres actes ne sont
          pas concernés et valent `false`.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure associé à l'acte métier, normalisé à partir de la typologie brute DORA de la structure
          prescriptrice, de la structure porteuse du service, ou de la structure rattachée à l'utilisateur selon le
          type d'acte. Pour les iMER Les Emplois retenues, la valeur est `emplois_organisation` pour les profils
          `emplois_prescriber` et `emplois_structure` pour les profils `emplois_employer`. Les orientations Les Emplois
          ont la valeur `Autre`. Les autres valeurs non reconnues ou absentes sont regroupées dans `Autre`.
        tests:
          - not_null
      - name: departement
        description: >
          Département associé à l'acte métier, normalisé au format code INSEE (`01` à `95`, `2A`, `2B`, `971` à
          `976`). Pour une orientation, il correspond à la commune du service orienté. Pour une iMER, il correspond à
          la structure ciblée via son identifiant Data Inclusion ; les iMER DORA utilisent le département enregistré
          dans l'événement en fallback. La valeur est `Inconnu` lorsque le département est absent, vide ou non
          interprétable.
        tests:
          - not_null
      - name: nombre_actes
        description: >
          Nombre d'actes métier agrégés au grain mois, source, type d'acte, indicateurs North Star / traité, type de
          structure et département. Les orientations incluent toutes les lignes de la fact DORA. Les iMER sont limitées
          aux profils `accompagnateur`, `accompagnateur_offreur`, `offreur`, `emplois_employer` et
          `emplois_prescriber`. Chaque compteur provient d'un `count(*)` sur la table source correspondant au type
          d'acte, puis d'une somme après normalisation.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement
  - name: int_dora__mobilisation_to_orientation
    description: >
      Correspondance entre une mobilisation réalisée par un utilisateur DORA actif,
      valide et non staff, et la première orientation retrouvée après cette
      mobilisation, s'il y en a une. Une orientation suit une mobilisation si elle
      a le même `user_id`, si elle est créée dans l'heure qui suit la mobilisation,
      et si elle concerne le même service via le slug.
    config:
      tags:
        - dora
    columns:
      - name: mobilisation_id
        description: Identifiant de la mobilisation.
        tests:
          - unique
          - not_null
      - name: orientation_id
        description: >
          ID de la première orientation qui suit la mobilisation. Peut être `NULL`
          si aucune orientation ne suit la mobilisation.
        tests:
          - relationships:
              arguments:
                to: ref('stg_dora__orientation')
                field: id
  - name: int_dora__mobilisationevent_user
    description: |
      Correspondance entre les mobilisations DORA et leurs utilisateurs actifs.

      Ce modèle ne garde que les mobilisations dont le `user_id` correspond à un
      utilisateur présent dans `int_dora__active_user`, donc actif, valide et non
      staff.
    config:
      tags:
        - dora
    columns:
      - name: mobilisation_id
        description: |
          Identifiant de l'événement de mobilisation.
        tests:
          - unique
          - not_null
      - name: user_id
        description: >
          Identifiant de l'utilisateur actif, valide et non staff qui a réalisé la
          mobilisation.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_dora__active_user')
                field: id
  - name: int_dora__orientation_user_service
    description: |
      Orientations des utilisateurs vers des services.
    config:
      tags:
        - dora
      indexes:
        - columns: [user_id, orientation_creation_date, service_slug]
    columns:
      - name: orientation_id
        description: |
          Identifiant de l'orientation
        tests:
          - unique
          - not_null
  - name: int_dora__orientations_enriched
    description: >
      Orientations DORA enrichies, avec une ligne par orientation. On garde les orientations qui ont un
      prescripteur DORA, ou qui sont reliées à une ligne Les Emplois. Ce modèle centralise la logique
      entre DORA, Les Emplois et Data Inclusion : retrouver les bons identifiants, garder les noms utiles
      pour lire les données, et ajouter la commune du service orienté quand elle est disponible.
    config:
      tags:
        - dora
    columns:
      - name: id
        description: Identifiant canonique de l'orientation DORA.
        tests:
          - unique
          - not_null
      - name: origin_source
        description: |
          Origine qu'on retient pour choisir les bons champs :
          - `dora` : l'orientation a un prescripteur DORA (`prescriber_id_dora` renseigné). C'est aussi le
            cas des orientations DORA créées depuis Les Emplois via le flux JWT.
          - `emplois` : l'orientation vient directement de l'API Les Emplois. Elle n'a pas de prescripteur
            DORA, mais elle a une ligne dans `stg_dora__emplois_orientation_data`.
      - name: emplois_sync_uid
        description: >
          UID de synchronisation avec Les Emplois. Il correspond à `les-emplois.insertion_orientation.id`
          et vient de `stg_dora__emplois_orientation_data.emplois_sync_uid`. Il est rempli dès qu'on a une
          ligne Les Emplois, même si l'orientation est finalement classée en `dora`.
      - name: creation_date
        description: Date de création de l'orientation dans DORA.
      - name: processing_date
        description: Date de traitement de l'orientation dans DORA.
      - name: status
        description: Statut de traitement de l'orientation dans DORA.
      - name: prescriber_id_dora
        description: >
          Identifiant du prescripteur côté DORA. Il est rempli pour les orientations DORA, y compris celles
          créées depuis Les Emplois via le flux JWT. Il est vide pour les orientations qui viennent
          directement de l'API Les Emplois.
      - name: prescriber_id_emplois
        description: >
          UID du professionnel, prescripteur ou employeur, transmis par Les Emplois. Il vient de
          `stg_dora__emplois_orientation_data.prescriber_id`, correspond à
          `les-emplois.users_user.public_id` et à `pilotage.candidats_v0.uid`, et peut être vide pour les
          orientations réalisées par JWT.
      - name: prescriber_structure_id_di
        description: >
          Identifiant Data Inclusion de la structure prescriptrice, quand on le retrouve. Côté
          `dora`, on passe par `stg_dora__structure.structure_id_jointure_di`. Côté `emplois`, on part de
          `emplois-de-linclusion--<structure_id>`, construit avec la structure transmise par Les Emplois.
          La colonne peut rester vide si la structure source n'existe pas dans le mapping Data Inclusion
          du moment.
      - name: prescriber_structure_id_dora
        description: >
          Identifiant de la structure prescriptrice côté DORA. Il est rempli seulement quand
          l'orientation est classée en `dora`.
      - name: prescriber_structure_id_emplois
        description: >
          UID de la structure côté Les Emplois, repris depuis
          `stg_dora__emplois_orientation_data.structure_id`. Il peut désigner une organisation
          prescriptrice, auquel cas il correspond à `les-emplois.prescribers_prescriberorganization.uid` et
          à `pilotage.organisations_v0.uid`, ou une entreprise, auquel cas il correspond à
          `les-emplois.companies_company.uid` et à `pilotage.structures_v0.uid`. Il est rempli seulement
          quand l'orientation est classée en `emplois`.
      - name: prescriber_structure_name
        description: >
          Nom de la structure prescriptrice, pour pouvoir lire la table sans refaire une jointure. Côté
          `emplois`, on prend le nom transmis avec l'orientation dans
          `stg_dora__emplois_orientation_data.structure_name`. Côté `dora`, on prend le nom actuel dans
          `stg_dora__structure.name`. La colonne peut rester vide, par exemple si une orientation DORA n'a
          pas de structure prescriptrice renseignée.
      - name: prescriber_structure_siret
        description: >
          SIRET de la structure prescriptrice. Côté `emplois`, on prend le SIRET transmis avec
          l'orientation dans `stg_dora__emplois_orientation_data.structure_siret`. Côté `dora`, on prend le
          SIRET actuel dans `stg_dora__structure.siret`. La colonne peut rester vide, par exemple si une
          orientation DORA n'a pas de structure prescriptrice, ou si la structure DORA existe mais n'a pas
          de SIRET.
      - name: oriented_service_id_di
        description: >
          Identifiant Data Inclusion du service orienté, quand on le retrouve. Si l'orientation
          pointe vers un service DORA, on passe par `dim_dora__services.service_id_jointure_di`, puis par
          `dim_data_inclusion__services.service_id`. Si l'orientation porte déjà un identifiant Data
          Inclusion, on garde celui qui est reçu dans DORA.
      - name: oriented_service_id_dora
        description: >
          Identifiant du service orienté côté DORA. Il est rempli quand l'orientation pointe vers un service
          DORA.
      - name: oriented_service_name
        description: >
          Nom du service orienté. On prend d'abord le nom Data Inclusion stocké dans l'orientation, puis le
          nom du service DORA dans `dim_dora__services`, puis le nom source historisé dans l'orientation.
      - name: oriented_service_structure_name
        description: >
          Nom de la structure qui porte le service orienté. On prend d'abord le nom Data Inclusion stocké
          dans l'orientation, puis le nom disponible via `dim_dora__services`.
      - name: oriented_service_code_commune_insee
        description: >
          Code commune INSEE du service orienté. On prend d'abord le code commune disponible dans
          `dim_data_inclusion__services`, puis le code commune du service DORA dans `dim_dora__services`.
      - name: emplois_beneficiary_id
        description: >
          UID du bénéficiaire transmis par Les Emplois. Il vient de
          `stg_dora__emplois_orientation_data.beneficiary_id` et correspond à
          `les-emplois.users_user.public_id` et à `pilotage.candidats_v0.uid`.
  - name: int_dora__service_structure
    description: |
      Services DORA avec leur structure DORA non obsolète.

      Ce modèle garde le comportement historique des usages qui passaient par
      `stg_dora__structure` quand ce staging filtrait encore les structures obsolètes.
      Si un service est rattaché à une structure obsolète, il n'est pas gardé ici.
    config:
      tags:
        - dora
      indexes:
        - columns: [service_id]
    columns:
      - name: service_service_id_jointure_di
        description: >
          ID de service DORA préfixé par `dora--`, utilisé pour joindre les données Data Inclusion.
      - name: structure_structure_id_jointure_di
        description: >
          ID de structure DORA préfixé par `dora--`, utilisé pour joindre les données Data Inclusion.

  - name: int_dora__structure_non_obsolete
    description: |
      Structures DORA non obsolètes.

      Ce modèle remplace l'ancien usage de `stg_dora__structure` quand on veut
      vraiment exclure les structures obsolètes. Avant, le filtre était dans le
      staging. Maintenant le staging garde toute la source, et c'est ici qu'on filtre.

      Utilise ce modèle quand les obsolètes ne doivent pas entrer dans l'analyse.
      Pour de l'historique complet, ou pour éviter de perdre des infos dans les
      jointures downstream, utilise `stg_dora__structure`.
    config:
      tags:
        - dora

    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: structure_id_jointure_di
        description: >
          ID de structure DORA préfixé par `dora--`, utilisé pour joindre les données Data Inclusion.

  - name: int_dora__structure_members
    description: |
      Membres des structures DORA non obsolètes.

      Ce modèle garde le comportement historique des usages qui passaient par
      `stg_dora__structure` quand ce staging filtrait encore les structures obsolètes.
    config:
      tags:
        - dora

  - name: int_dora__tous_les_pros
    description: |
      Tous les professionnels DORA avec leur structure de rattachement.

      Une ligne par couple utilisateur / structure : un utilisateur rattaché à plusieurs
      structures apparaît plusieurs fois, et un utilisateur sans structure apparaît une fois
      avec des valeurs NA. Aucun filtre n'est appliqué sur les utilisateurs (actifs, staff)
      ni sur les structures (obsolètes).
    config:
      tags:
        - dora
        - pro_pdi
    columns:
      - name: id
        description: Identifiant de l'utilisateur DORA
        tests:
          - not_null
      - name: source
        description: Source des données, toujours Dora
      - name: date_derniere_connexion
        description: Dernière connexion de l'utilisateur (`users_user.last_login`).
      - name: prenom
        description: Prénom de l'utilisateur. Vaut `NA` si vide.
      - name: nom
        description: Nom de l'utilisateur. Vaut `NA` si vide.
      - name: type_utilisateur
        description: Activité principale de l'utilisateur (`main_activity`). Vaut `NA` si vide.
      - name: type_utilisateur_detail
        description: Toujours `NA`, Dora ne porte pas de détail de type d'utilisateur.
      - name: date_inscription
        description: Date d'inscription de l'utilisateur (`users_user.date_joined`).
      - name: email
        description: Adresse e-mail de l'utilisateur.
      - name: admin
        description: Oui si l'utilisateur est gestionnaire, Non sinon
        tests:
          - accepted_values:
              arguments:
                values:
                  - Oui
                  - Non
      - name: nom_structure
        description: Nom de la structure de rattachement. Vaut `NA` si l'utilisateur n'en a pas, ou si le nom est vide.
      - name: type_structure
        description: Typologie de la structure de rattachement. Vaut `NA` si l'utilisateur n'en a pas, ou si elle est vide.
      - name: departement_structure
        description: Département de la structure de rattachement. Vaut `NA` si l'utilisateur n'en a pas, ou s'il est vide.
