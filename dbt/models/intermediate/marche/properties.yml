version: 2

models:
  - name: int_marche__actes_metier
    description: >
      Compte les actes métier du Marché par mois : diffusion d'offre inclusive et mise à jour de fiche entreprise.
    config:
      tags:
        - actes-metier
    columns:
      - name: mois
        description: >
          Mois de l'acte, au format `YYYY-MM`. Le modèle garde les 14 derniers mois complets.
        tests:
          - not_null
      - name: source
        description: >
          Toujours `marche`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - marche
      - name: type_acte
        description: >
          Nom de l'acte. Pour `Mise à jour fiche entreprise`, le modèle utilise `siaes_siaeoffer.updated_at`.
          Comme `updated_at` change à chaque modification, une fiche peut passer d'un ancien mois à un mois plus récent.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Diffusion d’offre inclusive
                  - Mise à jour fiche entreprise
      - name: categorie_acte
        description: >
          Toujours `Support` pour le Marché.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Support
      - name: north_star
        description: >
          Vaut `true` pour une diffusion d'offre inclusive quand `siae_count > 0`. Vaut `false` sinon.
        tests:
          - not_null
      - name: north_star_70
        description: >
          Même valeur que `north_star`.
        tests:
          - not_null
      - name: traite
        description: >
          Même valeur que `north_star`.
        tests:
          - not_null
      - name: type_structure
        description: >
          Pour une diffusion, vaut `SIAE` si l'auteur est une SIAE, sinon `Autre`. Pour une mise à jour de fiche
          entreprise, vaut `SIAE`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - SIAE
                  - Autre
      - name: departement
        description: >
          Code département normalisé. Vaut `Inconnu` si le département est vide ou non reconnu.
        tests:
          - not_null
      - name: nombre_actes
        description: >
          Nombre d'actes pour ce grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement

  - name: int_marche__tous_les_pros
    description: |
      Tous les professionnels du Marché de l'inclusion, avec leur structure de rattachement.

      Reprend la logique de la question Metabase historique sur `public.users_user`, construite
      à partir de `stg_marche__users`, `stg_marche__siaes` et `stg_marche__siae_users`. Les
      colonnes sont alignées sur `int_dora__tous_les_pros` et `int_emplois__tous_les_pros` pour
      pouvoir empiler les sources.

      Deux filtres métier hérités de la question Metabase sont repris :
      - les utilisateurs spam (prénom de plus de 15 caractères contenant `nz`) sont exclus ;
      - les utilisateurs dont l'e-mail est vide, ou dont le `kind` n'est pas reconnu
        (ni vide, ni `SIAE`, `BUYER`, `PARTNER` ou `INDIVIDUAL`), sont exclus.
    config:
      tags:
        - marche
        - pro_pdi
    columns:
      - name: id
        description: Identifiant de l'utilisateur du Marché.
        tests:
          - not_null
          - unique
      - name: source
        description: Source des données, toujours `Le marché`.
      - name: date_derniere_connexion
        description: Dernière connexion de l'utilisateur (`users_user.last_login`).
      - name: prenom
        description: Prénom de l'utilisateur. Peut être vide, pas de valeur de repli.
      - name: nom
        description: Nom de l'utilisateur. Peut être vide, pas de valeur de repli.
      - name: type_utilisateur
        description: >
          `kind` brut de l'utilisateur : `SIAE`, `BUYER`, `PARTNER`, `INDIVIDUAL`, ou d'autres
          valeurs non normalisées (ex. `ADMIN`) exclues par le filtre sur `type_structure`.
      - name: date_inscription
        description: Date d'inscription de l'utilisateur (`users_user.date_joined`).
      - name: email
        description: Adresse e-mail de l'utilisateur. Ne peut pas être vide (filtré en amont).
      - name: admin
        description: >
          `Oui` si l'e-mail de l'utilisateur est l'e-mail administrateur d'au moins une SIAE,
          `Non` sinon.
        tests:
          - accepted_values:
              arguments:
                values:
                  - Oui
                  - Non
      - name: type_utilisateur_detail
        description: >
          `buyer_kind_detail` de l'utilisateur, ou à défaut son `partner_kind`.
      - name: departement_structure
        description: >
          Le Marché ne porte pas de département au niveau utilisateur. Proxy retenu :
          département de l'une des SIAE auxquelles l'utilisateur est rattaché
          (`stg_marche__siae_users`). Vaut `NA` si l'utilisateur n'est rattaché à aucune SIAE, ou
          si le département de celle-ci est vide.
          Un utilisateur peut être rattaché à plusieurs SIAE ; dans le rare cas où elles ne sont
          pas toutes dans le même département (~6 % des utilisateurs rattachés), une seule est
          retenue arbitrairement.
      - name: type_structure
        description: >
          Type de structure normalisé depuis `kind` : `SIAE`, `Entreprise acheteuse`,
          `Entreprise partenaire`, `Particulier`, ou `NA` si `kind` est vide.
        tests:
          - not_null
      - name: nom_structure
        description: Nom de l'entreprise de l'utilisateur (`company_name`), ou `NA` si vide.
