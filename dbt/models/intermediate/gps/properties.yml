version: 2

models:
  - name: int_gps__actes_metier
    description: >
      Compte les actes métier GPS par mois. Le modèle reprend la logique du fetcher Python.
      Il distingue les consultations et les mises à jour de groupes de suivi.

      **ATTENTION : ce modèle réplique directement la logique qui existait sur Autometa pour le tableau de bord des actes métier.
      Il est possible que cette modélisation soit revue. Si tu es en train de t'en servir pour quelque chose, vérifie d'abord
      avec l'équipe data.**
    config:
      tags:
        - actes-metier
    columns:
      - name: mois
        description: >
          Mois de l'acte, au format `YYYY-MM`. Le modèle garde les 14 derniers mois complets.
        tests:
          - not_null
      - name: source
        description: Toujours `GPS`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - GPS
      - name: type_acte
        description: Type d'acte GPS.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Consultation groupe de suivi
                  - Mise à jour groupe de suivi
      - name: categorie_acte
        description: Toujours `Support` pour GPS.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Support
      - name: north_star
        description: Toujours `false` pour ces actes.
        tests:
          - not_null
      - name: north_star_70
        description: Toujours `false` pour ces actes.
        tests:
          - not_null
      - name: traite
        description: Toujours `false` pour ces actes.
        tests:
          - not_null
      - name: type_structure
        description: >
          Type de structure normalisé depuis le type d'organisation de l'utilisateur.
          Vaut `Autre` si le type n'est pas reconnu.
        tests:
          - not_null
      - name: departement
        description: Code département normalisé. Vaut `Inconnu` si le département est vide ou non reconnu.
        tests:
          - not_null
      - name: nombre_actes
        description: Nombre d'actes pour ce grain.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mois
              - source
              - type_acte
              - north_star
              - north_star_70
              - traite
              - type_structure
              - departement
  - name: int_gps__tous_les_pros
    description: |
      Tous les professionnels GPS ayant au moins une activité enregistrée dans
      `gps.gps_log_data`, avec leur structure de rattachement.

      Reprend la logique de la question Metabase historique sur `public.utilisateurs`, mais
      construite directement à partir de `stg_emplois__utilisateurs` et
      `stg_emplois__collaborations` plutôt que de la mart `utilisateurs`, pour ne pas faire
      dépendre un modèle intermediate d'une mart. Les colonnes sont alignées sur
      `int_dora__tous_les_pros` et `int_emplois__tous_les_pros` pour pouvoir empiler les
      sources, à l'exception de `admin`, qui n'a pas d'équivalent côté GPS.

      Le rattachement retenu pour `type_structure` et `departement_structure` suit cet ordre
      de priorité : organisation, puis structure, puis institution. Pour `nom_structure`, le
      choix se fait sur la présence d'un nom non vide plutôt que sur l'identifiant, pour
      reprendre fidèlement la question Metabase d'origine.
    config:
      tags:
        - gps
        - pro_pdi
    columns:
      - name: id
        description: Identifiant de l'utilisateur.
        tests:
          - not_null
      - name: source
        description: Source des données, toujours `GPS`.
      - name: date_derniere_connexion
        description: Horodatage de la dernière activité de l'utilisateur dans `gps.gps_log_data`.
      - name: prenom
        description: Prénom de l'utilisateur, depuis `stg_emplois__utilisateurs`.
      - name: nom
        description: Nom de l'utilisateur, depuis `stg_emplois__utilisateurs`.
      - name: type_utilisateur
        description: >
          Type de l'utilisateur des Emplois. Valeurs possibles : employer, prescriber,
          labor_inspector.
      - name: date_inscription
        description: Horodatage de la première activité de l'utilisateur dans `gps.gps_log_data`.
      - name: email
        description: Adresse e-mail de l'utilisateur.
      - name: type_utilisateur_detail
        description: Toujours `NA`, GPS ne porte pas cette information.
      - name: nom_structure
        description: >
          Nom de l'organisation, à défaut de la structure, à défaut de l'institution de
          rattachement. Vaut `NA` si aucun des trois n'a de nom renseigné.
      - name: type_structure
        description: >
          Type de l'organisation, à défaut de la structure, à défaut de l'institution de
          rattachement.
      - name: departement_structure
        description: >
          Département de l'organisation, à défaut de la structure, à défaut de l'institution de
          rattachement. Vaut `NA` si aucun des trois n'a de département renseigné.
