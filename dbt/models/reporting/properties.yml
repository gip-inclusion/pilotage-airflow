version: 2

models:
  - name: rpt_esat__survey_answers
    config:
      tags:
        - esat
    description: >
      Modèle principal de reporting pour les réponses ESAT.

      Une ligne correspond à un ESAT de la liste officielle.

      Le modèle part du mapping entre ESAT et réponses. Il ajoute ensuite les infos de dim_esat, la commune, le
      département, la région, et les données de la réponse quand une réponse validée existe.

      Les ESAT sans réponse sont gardés. Les ESAT avec une réponse possible mais à vérifier sont gardés aussi,
      mais sans données de réponse associées.

    columns:
      - name: finess_num
        description: >
          Numéro FINESS de l'ESAT dans la liste officielle.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_esat')
              field: finess_num

      - name: answer_id
        description: >
          Identifiant de la réponse associée à l'ESAT.

          Cette colonne est vide si l'ESAT n'a pas de réponse validée.
        tests:
          - relationships:
              to: ref('fct_esat__survey_answers')
              field: answer_id

      - name: matching_method
        description: >
          Méthode utilisée pour associer l'ESAT à une réponse.
        tests:
          - not_null
          - accepted_values:
              values:
                - manual_mapping
                - direct_finess
                - same_name_and_related_managing_organization
                - related_managing_organization
                - no_answer

      - name: matching_confidence
        description: >
          Niveau de confiance du lien entre l'ESAT et la réponse.

          high veut dire que la réponse est validée.
          low veut dire qu'une réponse possible existe, mais qu'elle doit être vérifiée.
          no_answer veut dire qu'aucune réponse n'a été trouvée.
        tests:
          - not_null
          - accepted_values:
              values:
                - high
                - low
                - no_answer

      - name: esat_name
        description: >
          Nom de l'ESAT dans la liste officielle.

      - name: adresse
        description: >
          Adresse de l'ESAT dans la liste officielle.

      - name: code_postal
        description: >
          Code postal de l'ESAT.

      - name: type_esat
        description: >
          Type de l'établissement.

      - name: siret
        description: >
          Numéro SIRET de l'ESAT dans la liste officielle.

      - name: code_commune_insee
        description: >
          Code INSEE de la commune de l'ESAT.

      - name: nom_commune
        description: >
          Nom de la commune de l'ESAT.

      - name: code_departement_insee
        description: >
          Code INSEE du département de l'ESAT.

      - name: nom_departement
        description: >
          Nom du département de l'ESAT.

      - name: code_region_insee
        description: >
          Code INSEE de la région de l'ESAT.

      - name: nom_region
        description: >
          Nom de la région de l'ESAT.

      - name: capacite_autorisee
        description: >
          Capacité autorisée de l'ESAT dans la liste officielle.

      - name: managing_organization_finess
        description: >
          Numéro FINESS de l'organisme gestionnaire dans la liste officielle.

      - name: answer_finess_num
        description: >
          Numéro FINESS déclaré dans la réponse au questionnaire.

      - name: answer_esat_name
        description: >
          Nom d'ESAT déclaré dans la réponse au questionnaire.

      - name: answer_esat_siret
        description: >
          Numéro SIRET déclaré dans la réponse au questionnaire.

      - name: answer_managing_organization_finess
        description: >
          Numéro FINESS de l'organisme gestionnaire déclaré dans la réponse.


  - name: rpt_esat__low_confidence_potential_answers
    config:
      tags:
        - esat
    description: >
      Réponses possibles pour les ESAT avec un matching de faible confiance.

      Ce modèle sert à aider la vérification manuelle.

      Il ne lit pas fct_esat__survey_answers, car ce modèle contient seulement les
      réponses déjà validées pour l'analyse.

      Une ligne correspond à une réponse possible. Chaque réponse apparaît une seule fois.

    columns:
      - name: answer_id
        description: >
          Identifiant de la réponse possible.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_esat__completed_answers')
              field: answer_id

      - name: code_departement_insee
        description: >
          Code INSEE du département déclaré dans la réponse.

      - name: nom_departement
        description: >
          Nom du département déclaré dans la réponse.

      - name: code_region_insee
        description: >
          Code INSEE de la région déclarée dans la réponse.

      - name: nom_region
        description: >
          Nom de la région déclarée dans la réponse.


  - name: rpt_esat__answer_coverage_by_region
    config:
      tags:
        - esat
    description: >
      Taux de réponse au questionnaire ESAT par région.

      Une ligne correspond à une région.

      Le modèle compte les ESAT avec une réponse validée, les ESAT avec une réponse
      possible à vérifier, et les ESAT sans réponse.

      Le statut vient de matching_confidence dans fct_esat__survey_answers_mapping.

    columns:
      - name: code_region_insee
        description: >
          Code INSEE de la région.
        tests:
          - not_null
          - unique

      - name: nom_region
        description: >
          Nom de la région.
        tests:
          - not_null

      - name: total_esat
        description: >
          Nombre total d'ESAT dans la région.
        tests:
          - not_null

      - name: answered_count
        description: >
          Nombre d'ESAT avec une réponse validée.
        tests:
          - not_null

      - name: pending_count
        description: >
          Nombre d'ESAT avec une réponse possible à vérifier.
        tests:
          - not_null

      - name: no_answer_count
        description: >
          Nombre d'ESAT sans réponse trouvée.
        tests:
          - not_null

      - name: answered_rate
        description: >
          Pourcentage d'ESAT avec une réponse validée.

      - name: pending_rate
        description: >
          Pourcentage d'ESAT avec une réponse possible à vérifier.

      - name: no_answer_rate
        description: >
          Pourcentage d'ESAT sans réponse trouvée.


  - name: rpt_dora__orientations
    config:
      tags:
        - dora
    description: >
      Table de reporting des orientations DORA et Emplois.
      Une ligne correspond à une orientation, au même grain que `fct_dora__orientations`.
      Toutes les colonnes du fact sont conservées sans filtre ni agrégation.


    columns:
      - name: id
        description: Identifiant canonique de l'orientation DORA, repris du fact.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_dora__orientations')
                field: id
      - name: origin_source
        description: >
          Origine de l'orientation, reprise du fact : `dora` si un prescripteur DORA est renseigné,
          y compris pour le flux JWT Emplois historique ; `emplois` pour celles issues de
          la Plateforme.
      - name: creation_date
        description: Date de création de l'orientation, reprise du fact.
      - name: processing_date
        description: Date de traitement de l'orientation, reprise du fact.
      - name: status
        description: Statut de traitement de l'orientation, repris du fact.
      - name: requirements
        description: Prérequis ou conditions de l'orientation, repris du fact.
      - name: situation
        description: Situations ou publics indiqués pour l'orientation, repris du fact.
      - name: beneficiary_contact_preferences
        description: Préférences de contact du bénéficiaire, reprises du fact.
      - name: beneficiary_availability
        description: Date de disponibilité du bénéficiaire, reprise du fact.
      - name: duration_weekly_hours
        description: Durée hebdomadaire en heures, reprise du fact.
      - name: duration_weeks
        description: Durée en semaines, reprise du fact.
      - name: query_expires_at
        description: Date d'expiration de la demande d'orientation, reprise du fact.
      - name: last_reminder_email_sent
        description: Date du dernier email de relance pour l'orientation, reprise du fact.
      - name: data_protection_commitment
        description: Engagement de protection des données, repris du fact.
      - name: is_anonymized
        description: Indique si l'orientation est anonymisée, repris du fact.
      - name: prescriber_id_dora
        description: Identifiant du professionnel côté DORA, repris du fact.
      - name: prescriber_id_emplois
        description: UID du professionnel transmis par Les Emplois, repris du fact.
      - name: user_kind
        description: >
          Type du professionnel, repris du fact : main_activity du profil DORA actuel, y compris
          pour les JWT historiques ; sender_kind enregistré sur l'orientation Emplois
          (emplois_employer ou emplois_prescriber), sans harmonisation.
      - name: prescriber_structure_id_di
        description: Identifiant canonique Data Inclusion de la structure prescriptrice, repris du fact.
      - name: prescriber_structure_id_dora
        description: Identifiant de la structure prescriptrice côté DORA, repris du fact.
      - name: prescriber_structure_id_emplois
        description: UID de l'entreprise côté Emplois, repris du fact.
      - name: prescriber_organization_id_emplois
        description: UID de l'organisation prescriptrice côté Emplois, repris du fact.
      - name: prescriber_nom_etablissement
        description: Nom de la structure prescriptrice, conservé tel quel depuis le fact.
      - name: prescriber_structure_siret
        description: SIRET de la structure prescriptrice, conservé tel quel depuis le fact.
      - name: oriented_service_id_di
        description: Identifiant Data Inclusion du service de destination, repris du fact.
      - name: oriented_service_id_dora
        description: Identifiant DORA du service de destination, repris du fact ; NULL pour Emplois.
      - name: oriented_service_name
        description: Nom du service de destination, conservé tel quel depuis le fact.
      - name: oriented_service_structure_name
        description: Nom de la structure qui porte le service de destination, repris du fact.
      - name: oriented_service_code_commune_insee
        description: >
          Code INSEE de la commune du service de destination, repris du fact sans modification.
          Il sert de clé de jointure avec `dim_commune` pour les colonnes géographiques ajoutées.
      - name: emplois_beneficiary_id
        description: >-
          UUID public du bénéficiaire côté Emplois, repris du fact. Concerne uniquement les orientations
          réalisées dans les Emplois et les orientations DORA issues du flux JWT Emplois historique ;
          reste NULL pour les autres orientations DORA.
          Pour joindre un candidat, utiliser `candidats_v0.uid`, pas `candidats_v0.id`.
          TODO : passer à l'id du candidat via `dim_emplois__candidats` quand la dimension sera disponible.
      - name: oriented_service_nom_commune
        description: Nom de la commune du service de destination, issu de `dim_commune.nom_commune`.
        tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.4
              config:
                severity: error
                tags:
                  - dora
      - name: oriented_service_code_region_insee
        description: Code INSEE de la région du service de destination, issu de `dim_commune.code_region_insee`.
      - name: oriented_service_nom_region
        description: Nom de la région du service de destination, issu de `dim_commune.nom_region`.
      - name: oriented_service_code_departement_insee
        description: >
          Code INSEE du département du service de destination, issu de `dim_commune.code_departement_insee`.
      - name: oriented_service_nom_departement
        description: Nom du département du service de destination, issu de `dim_commune.nom_departement`.
      - name: oriented_service_nom_departement_complet
        description: >
          Code et nom du département du service de destination, issus de `dim_commune.nom_departement_complet`.

  - name: rpt_emplois__inbound_parsing_mer_email
    description: >
      Les mails envoyés depuis les Emplois, avec le type d'utilisateur qui les envoie et les infos du service contacté.
      On ajoute le nom de la structure depuis data·inclusion et la commune, le département et la région
      du service depuis `dim_commune`.
      Il y a une ligne par mail, avec ou sans réponse. On garde tous les mails depuis le début du suivi.
      Cette table permet de voir combien de mails ont été envoyés, combien ont reçu une réponse
      et combien de temps on attend en moyenne avant la première réponse.
    config:
      tags:
        - dora
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('fct_emplois__inbound_parsing_mer_email')
    columns:
      - name: id
        description: >
          Identifiant du mail envoyé. Pour compter les envois, on utilise `count(*)`
          après avoir choisi les filtres qui nous intéressent.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_emplois__inbound_parsing_mer_email')
                field: id
      - name: imer_id
        description: Identifiant de l'iMER liée au mail dans `fct_dora__imer`. On le reprend du fact des mails.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_dora__imer')
                field: id
      - name: service_uid_di
        description: >
          Identifiant data·inclusion du service contacté. Il permet de retrouver le service dans
          `dim_emplois__services.service_uid_di`. Si on ne le retrouve pas, on garde le mail,
          mais les infos du service restent vides.
      - name: sent_at
        description: Date et heure d'envoi, avec le fuseau horaire. On les reprend du fact des mails.
        tests:
          - not_null
      - name: sent_date
        description: >
          Le jour d'envoi du mail, sans l'heure. On le calcule à partir de `sent_at` pour suivre les envois par jour.
        tests:
          - not_null
      - name: answered_at
        description: >
          Date et heure de la première réponse. Cette colonne reste vide tant qu'on n'a pas de réponse.
          Pour calculer le taux de réponse, on utilise `count(answered_at)::numeric / nullif(count(*), 0)`.
      - name: is_answered
        description: >
          Dit si le mail a reçu une réponse : `true` quand `answered_at` est renseigné, `false` sinon.
          On reprend cette valeur du fact. Elle permet de choisir les mails avec ou sans réponse.
        data_type: boolean
        tests:
          - not_null
      - name: response_time_days
        description: >
          Combien de jours on a attendu entre l'envoi et la première réponse, sans arrondir.
          Par exemple, 36 heures donnent 1,5 jour. On reprend la valeur du fact ; elle reste vide sans réponse.
          Pour le délai moyen, on utilise `avg(response_time_days)`. Les mails sans réponse ne comptent pas
          dans la moyenne. Si aucun mail n'a reçu de réponse, la moyenne reste vide.
          Pour un total ou une autre période, on refait le calcul à partir des mails concernés.
          On ne fait pas la moyenne de taux ou de délais moyens déjà calculés.
      - name: date_mise_a_jour_metabase
        description: Dernière date de mise à jour du mail dans l'export pour Metabase.
      - name: source_imer_id
        description: Identifiant de l'iMER dans l'export des Emplois. On le reprend de `fct_dora__imer`, sous forme de texte.
      - name: user_kind
        description: >
          Type d'utilisateur qui a envoyé le mail, par exemple `emplois_prescriber`.
          On reprend `fct_dora__imer.user_kind` : c'est le type reçu au moment de l'iMER,
          pas celui qu'on trouverait aujourd'hui dans le profil de l'utilisateur.
      - name: user_id
        description: Identifiant de l'utilisateur qui a envoyé le mail, tel qu'on le reçoit dans l'iMER Emplois.
      - name: user_prescriber_etablissement
        description: >
          Identifiant de l'organisation ou de la structure de l'utilisateur qui a envoyé le mail.
          On reprend `fct_dora__imer.user_prescriber_etablissement`. Il permet de retrouver l'établissement
          dans `dim_emplois__etablissements.id`. Si on ne retrouve pas l'établissement, cette colonne reste vide.
        tests:
          - relationships:
              arguments:
                to: ref('dim_emplois__etablissements')
                field: id
      - name: user_prescriber_etablissement_type
        description: >
          Dit si l'utilisateur dépend d'une `organisation` ou d'une `structure` dans l'iMER liée au mail.
          On reprend la valeur de `fct_dora__imer`. Elle reste vide si on n'a reçu aucun des deux identifiants.
      - name: service_id
        description: Identifiant du service propre aux Emplois. `service_uid_di` est son identifiant côté data·inclusion.
      - name: service_structure_uid_di
        description: >
          Identifiant data·inclusion de la structure qui propose le service, tel qu'il est reçu des Emplois.
          On le relie à `int_di__structure_source_mapping.source_structure_id` pour retrouver la structure dédupliquée.
      - name: service_structure_name
        description: >
          Nom actuel de la structure qui propose le service, issu de `dim_data_inclusion__structures.nom`.
          On le retrouve via `int_di__structure_source_mapping`, y compris quand l'identifiant reçu des Emplois
          correspond à un doublon. Si la structure n'est plus dans data·inclusion, le nom reste vide et on garde le mail.
      - name: service_source
        description: >
          D'où vient le service, par exemple `dora` ou `soliguide`, d'après le dernier export des Emplois.
          On garde la source telle qu'on la reçoit, sans regrouper les valeurs en DORA ou data·inclusion.
          On cherche les services dans les données des Emplois pour retrouver aussi ceux qui sont désactivés,
          même s'ils ne sont plus dans le catalogue de data·inclusion.
      - name: service_source_link
        description: Lien vers la fiche du service sur son site d'origine, quand on l'a.
      - name: service_name
        description: Nom du service dans le dernier export des Emplois.
      - name: service_description
        description: Texte qui présente le service dans le dernier export des Emplois.
      - name: service_duration_weekly_hours
        description: Nombre d'heures par semaine prévu pour le service, quand on a cette info.
      - name: service_duration_weeks
        description: Durée du service en semaines, quand on a cette info.
      - name: service_code_insee
        description: >
          Code INSEE de la commune du service, repris du dernier export des Emplois.
          Il sert de clé de jointure avec `dim_commune` pour les colonnes géographiques.
          Si la commune n'est pas retrouvée, ces colonnes restent vides et on garde le mail.
      - name: service_nom_commune
        description: Nom de la commune du service, issu de `dim_commune.nom_commune`.
      - name: service_code_region_insee
        description: Code INSEE de la région du service, issu de `dim_commune.code_region_insee`.
      - name: service_nom_region
        description: Nom de la région du service, issu de `dim_commune.nom_region`.
      - name: service_code_departement_insee
        description: Code INSEE du département du service, issu de `dim_commune.code_departement_insee`.
      - name: service_nom_departement
        description: Nom du département du service, issu de `dim_commune.nom_departement`.
      - name: service_nom_departement_complet
        description: Code et nom du département du service, issus de `dim_commune.nom_departement_complet`.
      - name: service_is_active
        description: >
          Dit si le service est actif dans le dernier export des Emplois. On garde les mails envoyés
          vers des services désactivés. Les infos du service sont celles du dernier export :
          elles peuvent donc avoir changé depuis l'envoi du mail.
      - name: service_date_mise_a_jour_metabase
        description: Dernière date de mise à jour du service dans l'export pour Metabase.

  - name: rpt_dora__imer
    config:
      tags:
        - dora
    description: >
      Table de reporting large des intentions de mise en relation (IMER), avec les lignes
      qui viennent des Emplois et celles qui viennent de DORA.

      Une ligne correspond à une intention de mise en relation, enrichie avec la meilleure information
      de structure disponible pour le reporting et avec les informations du service Data Inclusion
      ciblé quand on les retrouve. Pour les lignes Emplois, elle reprend aussi les informations de
      l'organisation prescriptrice et de la structure employeuse de l'utilisateur.
      Comme dans `fct_dora__imer`, certaines colonnes gardent l'identifiant de la source d'origine :
      par exemple `source_imer_id` et `user_id`. Il faut donc toujours les lire avec
      `origin_source` avant de faire une jointure vers une table source.

      Les colonnes `target_structure_*` décrivent la structure la plus complète disponible pour
      l'analyse. Elles utilisent d'abord la structure Data Inclusion canonique retrouvée via
      `target_di_structure_id`, puis la structure Data Inclusion du service mobilisé, puis la
      structure DORA retrouvée via `target_structure_source_id`. Pour travailler strictement avec la
      structure Data Inclusion canonique directe, il faut joindre `target_di_structure_id` à
      `dim_data_inclusion__structures.structure_id`.

    columns:
      - name: id
        description: Identifiant unique de l'IMER dans le mart.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_dora__imer')
                field: id
      - name: origin_source
        description: >
          Source de l'IMER. La valeur est `emplois` quand la ligne vient des Emplois, et `dora`
          quand elle vient des événements DORA. La valeur `dora-data-inclusion` distingue les IMER
          DORA qui mobilisent un service Data Inclusion.
      - name: source_imer_id
        description: >
          Identifiant de l'IMER dans sa source d'origine. Cette colonne mélange des IDs Emplois
          et des IDs DORA. Il ne faut pas faire de jointure avec cette colonne seule : pour revenir
          à une source, il faut toujours utiliser `origin_source` avec `source_imer_id`.
      - name: date
        description: Date à laquelle l'intention de mise en relation a été enregistrée.
        tests:
          - not_null
      - name: user_session
        description: >
          Identifiant de session reçu côté Emplois. Cette information reste vide pour les lignes
          DORA.
      - name: user_kind
        description: >
          Type d'utilisateur à l'origine de l'intention, tel qu'il est reçu dans la source.
      - name: is_logged_imer
        description: >
          Dit si l'IMER a été faite par un utilisateur connecté à son compte.
        tests:
          - not_null
      - name: user_id
        description: >
          Identifiant source de l'utilisateur à l'origine de l'intention. Quand `origin_source =
          'emplois'`, c'est un identifiant utilisateur Emplois. Quand `origin_source = 'dora'`,
          c'est un identifiant utilisateur DORA. Il ne faut donc pas faire une jointure unique avec
          cette colonne seule : il faut choisir la table utilisateur selon `origin_source`. Pour les
          lignes DORA, les structures de rattachement de l'utilisateur se retrouvent via
          `int_dora__structure_members`, mais cette relation peut être 1:N et multiplier les lignes.
      - name: user_prescriber_etablissement
        description: >
          Identifiant de l'établissement de l'utilisateur, repris de `fct_dora__imer`.
          On peut l'utiliser pour retrouver l'établissement dans `dim_emplois__etablissements.id`.
          Il reste vide pour les IMER DORA.
      - name: user_prescriber_etablissement_type
        description: >
          Dit si l'utilisateur dépend d'une `organisation` ou d'une `structure` dans cette IMER Emplois.
          On reprend la valeur de `fct_dora__imer`. Elle nous sert à choisir les infos à afficher :
          celles de l'organisation ou celles de la structure, même si elles partagent le même établissement.
          Cette colonne reste vide pour les IMER DORA.
      - name: target_structure_source_id
        description: >
          Identifiant de la structure ciblée avec son espace de noms. Pour DORA, il vaut `dora--<id>`;
          pour Data Inclusion, l'identifiant Data Inclusion reçu; pour Emplois, l'identifiant source
          Emplois. Son espace de noms se déduit de `origin_source`. Pour les lignes `origin_source =
          'dora'`, il peut être joint à `dim_dora__structures.structure_id_jointure_di`.
      - name: target_di_structure_id
        description: >
          Identifiant canonique Data Inclusion de la structure ciblée par l'intention de mise en
          relation, quand on le retrouve depuis la structure cible reçue dans l'événement. Si ce
          mapping direct n'aboutit pas, on peut le compléter depuis le service mobilisé.
      - name: kind
        description: >
          Type de l'intention de mise en relation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - service_ext_link
                  - service_orientation
                  - service_contact
                  - structure_contact
                  - mobilisation
      - name: service_id
        description: >
          Identifiant Data Inclusion du service concerné par l'intention, quand on le retrouve.
          Il garde le format Data Inclusion avec espace de noms, par exemple `dora--<uuid>`
          ou `soliguide--<id>`. Pour DORA, il vient d'abord du service confirmé de l'orientation
          liée à la mobilisation, puis du service reconstruit depuis la mobilisation. Les services
          reconstruits depuis les mobilisations sont gardés uniquement s'ils existent dans
          `dim_data_inclusion__services`. Il reste vide pour les IMER DORA de type
          `structure_contact`.
      - name: source
        description: >
          Source du service concerné par l'intention. Cette colonne décrit le service ciblé, pas
          forcément la source de l'IMER. Pour savoir si la ligne vient des Emplois ou de DORA, il
          faut utiliser `origin_source`.
      - name: orientation_id
        description: |
          Identifiant de l'orientation dans `fct_dora__orientations`, quand l'IMER est liée à
          une orientation.

          - Sur une IMER DORA, c'est la première orientation retrouvée après la mobilisation.
          - Sur une IMER DORA `structure_contact`, cette colonne reste vide.
          - Cette colonne sert à joindre les orientations.
          - Il ne faut pas l'utiliser pour dédoublonner les IMER.
      - name: target_structure_nom
        description: >
          Nom de structure le plus complet disponible pour le reporting. Il vient d'abord de la
          structure Data Inclusion ciblée, puis de la structure Data Inclusion du service mobilisé,
          puis de la structure DORA.
      - name: target_structure_siret
        description: SIRET de la structure retenue pour le reporting.
      - name: target_structure_code_commune
        description: Code commune INSEE de la structure retenue pour le reporting.
      - name: target_structure_region
        description: Région de la structure retenue pour le reporting.
      - name: target_structure_code_departement
        description: Code INSEE du département de la structure retenue pour le reporting.
      - name: target_structure_nom_departement
        description: Nom du département de la structure retenue pour le reporting.
      - name: di_services_nom
        description: Nom du service concerné par l'intention.
      - name: di_services_thematiques
        description: Thématiques du service concerné par l'intention.
      - name: di_services_region
        description: Région du service concerné par l'intention.
      - name: di_services_code_departement
        description: Code INSEE du département du service concerné par l'intention.
      - name: di_services_nom_departement
        description: Nom du département du service concerné par l'intention.
      - name: organization_nom
        description: Nom de l'organisation prescriptrice.
      - name: organization_type
        description: Type de l'organisation prescriptrice.
      - name: organization_region
        description: Région de l'organisation prescriptrice.
      - name: organization_numero_departement
        description: Numéro de département INSEE de l'organisation prescriptrice.
      - name: organization_nom_departement
        description: Nom du département de l'organisation prescriptrice.
      - name: company_nom
        description: Nom de la structure prescriptrice.
      - name: company_type
        description: Type de la structure prescriptrice.
      - name: company_region
        description: Région de la structure prescriptrice.
      - name: company_numero_departement
        description: Numéro de département de la structure prescriptrice.
      - name: company_nom_departement
        description: Nom du département de la structure prescriptrice.
      - name: company_source
        description: Source de la structure prescriptrice.

  - name: rpt_geiq__assessments_contracts
    config:
      tags:
        - geiq
    description: >
      Modèle de reporting au grain du bilan d'éxecution geiq.

      Une ligne correspond à un bilan, soit un geiq et une année de campagne, éventuellement décliné par
      antenne. Le modèle reprend toutes les colonnes de fct_geiq__assessments et y ajoute le département et
      la région du geiq principal (via dim_geiq et dim_commune) ainsi que les mesures des contrats du
      bilan, agrégées depuis fct_geiq__contracts.

      C'est ici que se croisent les deux grains : l'écart entre le montant conventionné et le montant
      potentiel des contrats retenus, et le taux de réalisation, se lisent sur une seule ligne, sans
      jointure ni duplication des montants du bilan.

      Les bilans sans aucun contrat sont conservés, avec des mesures de contrats à zéro.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fct_geiq__assessments')
    columns:
      - name: id
        description: >
          id unique associé au bilan d'éxecution.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_geiq__assessments')
              field: id
      - name: geiq_department
        description: >
          code du département du geiq principal pour cette année de campagne.
      - name: geiq_department_name
        description: >
          nom complet du département du geiq principal, lu depuis dim_commune (jointure sur
          code_departement_insee).
      - name: geiq_region
        description: >
          région du geiq principal, lue depuis dim_commune (jointure sur code_departement_insee).
      - name: contract_nb
        description: >
          nombre de contrats rattachés au bilan, présentés ou non.
      - name: requested_contract_nb
        description: >
          nombre de contrats présentés par le geiq.
      - name: granted_contract_nb
        description: >
          nombre de contrats dont l'aide a été accordée par la DDETS/DREETS. À croiser avec
          is_final_reviewed pour ne compter que les contrats déclarés éligibles après validation finale.
      - name: short_derogated_contract_nb
        description: >
          nombre de contrats présentés, de moins de 90 jours sur l'année de campagne, assortis du motif
          dérogatoire de prise en compte de l'accompagnement.
      - name: requested_allowance_amount
        description: >
          montant potentiel des contrats présentés, en euros, soit la somme des aides potentielles des
          contrats présentés par le geiq.
      - name: granted_allowance_amount
        description: >
          montant potentiel des contrats retenus, en euros, soit la somme des aides potentielles des
          contrats dont l'aide a été accordée.
      - name: convention_vs_granted_allowance_gap
        description: >
          écart en euros entre le montant potentiel des contrats retenus et le montant conventionné.
          Négatif lorsque les contrats retenus pèsent moins que le conventionnement.
      - name: convention_vs_granted_amount_gap
        description: >
          écart en euros entre le montant accordé des contrats retenus et le montant conventionné.
          Négatif lorsque les contrats retenus pèsent moins que le conventionnement.
      - name: realization_rate
        description: >
          taux de réalisation d'un bilan, soit son montant accordé rapporté à son montant conventionné,
          arrondi au millième. Vaut 0 lorsque le montant conventionné est nul, la division étant sécurisée.
          Ce taux n'est pas additif : une moyenne de cette colonne sur plusieurs bilans ne donne pas le taux
          de l'ensemble. Pour un taux agrégé, rapporter la somme des granted_amount à la somme des
          convention_amount.
      - name: realization_rate_granted_allowance
        description: >
          taux de réalisation d'un bilan, soit son montant potentiel accordé rapporté à son montant conventionné,
          arrondi au millième. Vaut 0 lorsque le montant conventionné est nul, la division étant sécurisée.
          Ce taux n'est pas additif : une moyenne de cette colonne sur plusieurs bilans ne donne pas le taux
          de l'ensemble.

  - name: rpt_geiq__contracts
    config:
      tags:
        - geiq
    description: >
      Modèle de reporting au grain du contrat geiq, prêt à l'emploi : une ligne par contrat, combinant
      fct_geiq__contracts, le contexte du bilan porteur (fct_geiq__assessments) et les informations
      descriptives du geiq (dim_geiq), sans jointure à faire côté restitution.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('fct_geiq__contracts')
    columns:
      - name: id
        description: >
          id unique associé au contrat.
        tests:
          - not_null
          - unique
      - name: assessment_state
        description: >
          état du bilan d'éxecution porteur.
      - name: is_assessment_final_reviewed
        description: >
          indique si le bilan porteur a fait l'objet d'une validation finale par la DREETS. Indispensable
          pour isoler les contrats déclarés éligibles après validation finale : is_allowance_granted est
          déjà renseigné sur des bilans non finalisés.
      - name: with_main_geiq
        description: >
          indique si le bilan porteur porte sur le geiq principal.
      - name: antenna_nb
        description: >
          nombre d'antennes concernées par le bilan porteur.
      - name: assessment_employee_nb
        description: >
          nombre de salarié.e.s concerné.e.s par le bilan porteur.
      - name: convention_amount
        description: >
          montant conventionné du bilan porteur, en euros.
      - name: granted_amount
        description: >
          montant accordé du bilan porteur, en euros.
      - name: advance_amount
        description: >
          montant de l'avance versée au titre du bilan porteur, en euros.
      - name: conventionned_institutions_departments
        description: >
          départements des DDETS/DREETS ayant conventionné le geiq porteur du bilan. Champ multivalué.
      - name: label_geiq_id
        description: >
          identifiant du geiq dans Label, l'outil de la fédération des geiq.
      - name: label_geiq_name
        description: >
          nom du geiq tel que renseigné dans Label.
      - name: geiq_department
        description: >
          code du département du geiq principal pour l'année de campagne du contrat. À ne pas confondre
          avec antenna_department.
      - name: geiq_department_name
        description: >
          nom complet du département du geiq principal, lu depuis dim_commune (jointure sur
          code_departement_insee).
      - name: geiq_region
        description: >
          région du geiq principal, lue depuis dim_commune (jointure sur code_departement_insee).
      - name: antenna_department_nb
        description: >
          nombre de départements dans lesquels le geiq a une antenne ayant porté au moins un contrat sur
          l'année de campagne du contrat. Calculé à partir des contrats, à distinguer de antenna_nb qui
          est la déclaration du geiq pour le bilan spécifique auquel ce contrat est rattaché.
      - name: antenna_departments
        description: >
          liste dédupliquée des départements dans lesquels le geiq a une antenne ayant porté au moins un
          contrat sur l'année de campagne du contrat.
