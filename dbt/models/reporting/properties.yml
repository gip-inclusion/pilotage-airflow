version: 2

models:
  - name: rpt_esat__survey_answers
    config:
      tags:
        - esat
    description: >
      Modèle principal de reporting pour les réponses ESAT.

      Une ligne correspond à un ESAT de la liste officielle.

      Le modèle part du mapping entre ESAT et réponses. Il ajoute ensuite les infos de dim_esat, la commune, le
      département, la région, et les données de la réponse quand une réponse validée existe.

      Les ESAT sans réponse sont gardés. Les ESAT avec une réponse possible mais à vérifier sont gardés aussi,
      mais sans données de réponse associées.

    columns:
      - name: finess_num
        description: >
          Numéro FINESS de l'ESAT dans la liste officielle.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_esat')
              field: finess_num

      - name: answer_id
        description: >
          Identifiant de la réponse associée à l'ESAT.

          Cette colonne est vide si l'ESAT n'a pas de réponse validée.
        tests:
          - relationships:
              to: ref('fct_esat__survey_answers')
              field: answer_id

      - name: matching_method
        description: >
          Méthode utilisée pour associer l'ESAT à une réponse.
        tests:
          - not_null
          - accepted_values:
              values:
                - manual_mapping
                - direct_finess
                - same_name_and_related_managing_organization
                - related_managing_organization
                - no_answer

      - name: matching_confidence
        description: >
          Niveau de confiance du lien entre l'ESAT et la réponse.

          high veut dire que la réponse est validée.
          low veut dire qu'une réponse possible existe, mais qu'elle doit être vérifiée.
          no_answer veut dire qu'aucune réponse n'a été trouvée.
        tests:
          - not_null
          - accepted_values:
              values:
                - high
                - low
                - no_answer

      - name: esat_name
        description: >
          Nom de l'ESAT dans la liste officielle.

      - name: adresse
        description: >
          Adresse de l'ESAT dans la liste officielle.

      - name: code_postal
        description: >
          Code postal de l'ESAT.

      - name: type_esat
        description: >
          Type de l'établissement.

      - name: siret
        description: >
          Numéro SIRET de l'ESAT dans la liste officielle.

      - name: code_commune_insee
        description: >
          Code INSEE de la commune de l'ESAT.

      - name: nom_commune
        description: >
          Nom de la commune de l'ESAT.

      - name: code_departement_insee
        description: >
          Code INSEE du département de l'ESAT.

      - name: nom_departement
        description: >
          Nom du département de l'ESAT.

      - name: code_region_insee
        description: >
          Code INSEE de la région de l'ESAT.

      - name: nom_region
        description: >
          Nom de la région de l'ESAT.

      - name: capacite_autorisee
        description: >
          Capacité autorisée de l'ESAT dans la liste officielle.

      - name: managing_organization_finess
        description: >
          Numéro FINESS de l'organisme gestionnaire dans la liste officielle.

      - name: answer_finess_num
        description: >
          Numéro FINESS déclaré dans la réponse au questionnaire.

      - name: answer_esat_name
        description: >
          Nom d'ESAT déclaré dans la réponse au questionnaire.

      - name: answer_esat_siret
        description: >
          Numéro SIRET déclaré dans la réponse au questionnaire.

      - name: answer_managing_organization_finess
        description: >
          Numéro FINESS de l'organisme gestionnaire déclaré dans la réponse.


  - name: rpt_esat__low_confidence_potential_answers
    config:
      tags:
        - esat
    description: >
      Réponses possibles pour les ESAT avec un matching de faible confiance.

      Ce modèle sert à aider la vérification manuelle.

      Il ne lit pas fct_esat__survey_answers, car ce modèle contient seulement les
      réponses déjà validées pour l'analyse.

      Une ligne correspond à une réponse possible. Chaque réponse apparaît une seule fois.

    columns:
      - name: answer_id
        description: >
          Identifiant de la réponse possible.
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('int_esat__completed_answers')
              field: answer_id

      - name: code_departement_insee
        description: >
          Code INSEE du département déclaré dans la réponse.

      - name: nom_departement
        description: >
          Nom du département déclaré dans la réponse.

      - name: code_region_insee
        description: >
          Code INSEE de la région déclarée dans la réponse.

      - name: nom_region
        description: >
          Nom de la région déclarée dans la réponse.


  - name: rpt_esat__answer_coverage_by_region
    config:
      tags:
        - esat
    description: >
      Taux de réponse au questionnaire ESAT par région.

      Une ligne correspond à une région.

      Le modèle compte les ESAT avec une réponse validée, les ESAT avec une réponse
      possible à vérifier, et les ESAT sans réponse.

      Le statut vient de matching_confidence dans fct_esat__survey_answers_mapping.

    columns:
      - name: code_region_insee
        description: >
          Code INSEE de la région.
        tests:
          - not_null
          - unique

      - name: nom_region
        description: >
          Nom de la région.
        tests:
          - not_null

      - name: total_esat
        description: >
          Nombre total d'ESAT dans la région.
        tests:
          - not_null

      - name: answered_count
        description: >
          Nombre d'ESAT avec une réponse validée.
        tests:
          - not_null

      - name: pending_count
        description: >
          Nombre d'ESAT avec une réponse possible à vérifier.
        tests:
          - not_null

      - name: no_answer_count
        description: >
          Nombre d'ESAT sans réponse trouvée.
        tests:
          - not_null

      - name: answered_rate
        description: >
          Pourcentage d'ESAT avec une réponse validée.

      - name: pending_rate
        description: >
          Pourcentage d'ESAT avec une réponse possible à vérifier.

      - name: no_answer_rate
        description: >
          Pourcentage d'ESAT sans réponse trouvée.


  - name: rpt_imer
    config:
      tags:
        - imer
    description: >
      Table de reporting large des intentions de mise en relation (IMER), avec les lignes
      qui viennent des Emplois et celles qui viennent de DORA.

      Une ligne correspond à une intention de mise en relation, enrichie des informations
      de la structure et du service Data Inclusion ciblés quand on les retrouve. Pour les lignes
      Emplois, elle reprend aussi les informations de l'organisation prescriptrice et de la structure
      employeuse de l'utilisateur.
      Comme dans `fct_dora__imer`, certaines colonnes gardent l'identifiant de la source d'origine :
      par exemple `source_imer_id` et `user_id`. Il faut donc toujours les lire avec
      `origin_source` avant de faire une jointure vers une table source.

    columns:
      - name: id
        description: Identifiant unique de l'IMER dans le mart.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_dora__imer')
                field: id
      - name: origin_source
        description: >
          Source de l'IMER. La valeur est `emplois` quand la ligne vient des Emplois, et `dora`
          quand elle vient des événements DORA. La valeur `dora-data-inclusion` distingue les IMER
          DORA qui mobilisent un service Data Inclusion.
      - name: source_imer_id
        description: >
          Identifiant de l'IMER dans sa source d'origine. Cette colonne mélange des IDs Emplois
          et des IDs DORA. Il ne faut pas faire de jointure avec cette colonne seule : pour revenir
          à une source, il faut toujours utiliser `origin_source` avec `source_imer_id`.
      - name: date
        description: Date à laquelle l'intention de mise en relation a été enregistrée.
        tests:
          - not_null
      - name: user_session
        description: >
          Identifiant de session reçu côté Emplois. Cette information reste vide pour les lignes
          DORA.
      - name: user_kind
        description: >
          Type d'utilisateur à l'origine de l'intention, tel qu'il est reçu dans la source.
      - name: user_id
        description: >
          Identifiant source de l'utilisateur à l'origine de l'intention. Quand `origin_source =
          'emplois'`, c'est un identifiant utilisateur Emplois. Quand `origin_source = 'dora'`,
          c'est un identifiant utilisateur DORA. Il ne faut donc pas faire une jointure unique avec
          cette colonne seule : il faut choisir la table utilisateur selon `origin_source`. Pour les
          lignes DORA, les structures de rattachement de l'utilisateur se retrouvent via
          `int_dora__structure_members`, mais cette relation peut être 1:N et multiplier les lignes.
      - name: user_prescriber_organization_id
        description: >
          Identifiant de l'organisation prescriptrice côté Emplois. Il reste vide pour les lignes
          DORA.
      - name: user_company_id
        description: >
          Identifiant de la structure employeuse côté Emplois. Il reste vide pour les lignes DORA.
      - name: target_structure_source_id
        description: >
          Identifiant de la structure ciblée avec son espace de noms. Pour DORA, il vaut `dora--<id>`;
          pour Data Inclusion, l'identifiant Data Inclusion reçu; pour Emplois, l'identifiant source
          Emplois. Son espace de noms se déduit de `origin_source`.
      - name: target_di_structure_id
        description: >
          Identifiant canonique Data Inclusion de la structure ciblée par l'intention de mise en
          relation, quand on le retrouve depuis la structure cible reçue dans l'événement. Si ce
          mapping direct n'aboutit pas, on peut le compléter depuis le service mobilisé.
      - name: kind
        description: >
          Type de l'intention de mise en relation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - service_ext_link
                  - service_orientation
                  - service_contact
                  - structure_contact
                  - mobilisation
      - name: service_id
        description: >
          Identifiant Data Inclusion du service concerné par l'intention, quand on le retrouve.
          Il garde le format Data Inclusion avec espace de noms, par exemple `dora--<uuid>`
          ou `soliguide--<id>`. Pour DORA, il vient d'abord du service confirmé de l'orientation
          liée à la mobilisation, puis du service reconstruit depuis la mobilisation. Les services
          reconstruits depuis les mobilisations sont gardés uniquement s'ils existent dans
          `dim_data_inclusion__services`.
      - name: source
        description: >
          Source du service concerné par l'intention. Cette colonne décrit le service ciblé, pas
          forcément la source de l'IMER. Pour savoir si la ligne vient des Emplois ou de DORA, il
          faut utiliser `origin_source`.
      - name: orientation_id
        description: |
          Identifiant de l'orientation dans `fct_dora__orientations`, quand l'IMER est liée à
          une orientation.

          - Sur une IMER DORA, c'est la première orientation retrouvée après la mobilisation.
          - Cette colonne sert à joindre les orientations.
          - Il ne faut pas l'utiliser pour dédoublonner les IMER.
      - name: di_nom_structure
        description: Nom de la structure concernée par l'intention.
      - name: di_siret_structure
        description: SIRET de la structure concernée par l'intention.
      - name: di_structure_code_commune
        description: Code INSEE de la structure concernée par l'intention.
      - name: di_structure_region
        description: Région de la structure concernée par l'intention.
      - name: di_structure_code_departement
        description: Code INSEE du département de la structure concernée par l'intention.
      - name: di_structure_nom_departement
        description: Nom du département de la structure concernée par l'intention.
      - name: di_services_nom
        description: Nom du service concerné par l'intention.
      - name: di_services_thematiques
        description: Thématiques du service concerné par l'intention.
      - name: di_services_region
        description: Région du service concerné par l'intention.
      - name: di_services_code_departement
        description: Code INSEE du département du service concerné par l'intention.
      - name: di_services_nom_departement
        description: Nom du département du service concerné par l'intention.
      - name: organization_nom
        description: Nom de l'organisation prescriptrice.
      - name: organization_type
        description: Type de l'organisation prescriptrice.
      - name: organization_region
        description: Région de l'organisation prescriptrice.
      - name: organization_numero_departement
        description: Numéro de département INSEE de l'organisation prescriptrice.
      - name: organization_nom_departement
        description: Nom du département de l'organisation prescriptrice.
      - name: company_nom
        description: Nom de la structure prescriptrice.
      - name: company_type
        description: Type de la structure prescriptrice.
      - name: company_region
        description: Région de la structure prescriptrice.
      - name: company_numero_departement
        description: Numéro de département de la structure prescriptrice.
      - name: company_nom_departement
        description: Nom du département de la structure prescriptrice.
      - name: company_source
        description: Source de la structure prescriptrice.
